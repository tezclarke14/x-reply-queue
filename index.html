<script>
const POSTS=[{"handle": "fredsoda", "name": "Soda", "followers": 9375, "id": "2116139549071946127", "url": "https://x.com/fredsoda/status/2116139549071946127", "text": "this is an absurd take when we haven’t even seen one successful VC-backed AI-rollup achieve an exit yet https://t.co/NBn4cAmEJ0", "posted_utc": "2026-10-30T12:05:59.000Z", "posted_ct": "Oct 30, 07:05 AM CT", "likes": 1, "replies": 0, "reply": "", "angle": "AI rollup skeptic: run one shop first", "tier": "Reply now", "hot": true, "new": true}, {"handle": "OwenGregorian", "name": "Owen Gregorian", "followers": 171797, "id": "2116121925122441592", "url": "https://x.com/OwenGregorian/status/2116121925122441592", "text": "Meet the Baby Boomer whose life changed when 2 Gen Z AI founders walked into her plumbing business. She became their first COO | Nick Lichtenberg, Fortune\n\nWhen Marcelle Flowers’ staff told her that two students were waiting at the counter of her Sacramento plumbing shop, she grabbed her wallet. She assumed they were selling chocolate bars for a soccer team.\n\n“I literally said, you have five minutes,” recalled Flowers, now 62 years old. It was June 2024 and a deal to sell her business, Armstrong Plumbing, had fallen through months earlier. She was also “really opposed to AI,” she told Fortune. She feared it would take her people and “take all the jobs.”\n\nThe visitors were AJ Jain and Aditya Ketkar, two engineers in their mid-20s whose energy startup had just fizzled. They had spent that spring walking into about 140 contractors’ shops across Northern California, carrying a diary instead of laptops and offering no sales pitch.\n\n“People were not treating us like salesmen,” Jain said. “Curious kids was, like, our persona,”\n\nThey had built exactly one thing worth showing: an automated appointment-reminder call for a San Francisco electrician.\n\nTwo years later, their company, Broccoli AI, has raised $52 million across its Series A and Series B. Khosla Ventures led both rounds, with Y Combinator and Operator Partners also participating. The raise was $22 million in Series A and $30 million in Series B, nine months apart, Jain, the company’s co-founder and CEO, told Fortune.\n\nThe Series A had not previously been announced. Broccoli is valued at $300 million post-money, according to a person familiar with the matter (Broccoli declined to comment on its valuation). The company had earlier raised in a $1.5 million seed round after going through Y Combinator.\n\nAnd Marcelle Flowers is now working with the company. She got an apartment in San Francisco to work for them, and her life changed.\n\n“If you had told me that I’d be running an AI company in the heart of San Francisco I would have laughed you out of the room,” Flowers said. “Like, furthest thing from my mind.”\n\nWhat the company sells\n\nBroccoli sells AI agents to plumbing, HVAC and electrical companies. They answer inbound calls, book jobs directly into the scheduling software the contractor already uses, follow up on open estimates, and renew service memberships.\n\nThe company says more than 1,500 businesses now use it, including Ace Hardware Home Services, Mr. Electric and Any Hour Group. In the past seven months it has added roofing, pool care, garage doors, home improvement, and exteriors.\n\nRevenue has tripled since the Series A, Jain said, and headcount has grown from 15 people as of 12 months ago to more than 150. The company said the new money will go toward hiring engineers and salespeople as well as speeding up product development.\n\nOwners wanted someone to answer the phone after the office emptied out at 5 p.m., close the books and chase the estimates technicians wrote up, Jain said. The company says its AI does work equivalent to roughly 30% of a typical contractor’s office staff.\n\n‘The American Dream is still alive’\n\nJain, 27, is the first engineer in a family of business owners on both sides. He and Ketkar met at BITS Pilani in India in 2016 and have been starting companies together since 2017: a delivery app for closed college campuses, an interview-prep bootcamp, and, after Y Combinator, a universal API for electric vehicles that took them to London. They signed eight customers there in two years. “We couldn’t scale that business, even after raising a seed round from YC,” Jain said.\n\nThey arrived in San Francisco in January 2024. That May and June they went door to door across the Bay Area, then Stockton, Lodi, Modesto and Sacramento. They wanted an owner to build with.\n\nAt the utilities they had worked with before, Jain explained, he used to deal with product managers at 5,000-person companies. A contractor-owner, on the other hand, “cares about solving their customer’s problem.” Owners took them along on smoke breaks and told them how their fathers had started the business.\n\n“The surprising thing is the American Dream is still alive,” Jain said, describing himself and Ketkar as two curious strangers who were met with trust and openness. “No one looked at our accents, our color.”\n\nThe turning point was when they met Flowers, who gave them five minutes that changed their lives, Jain said. It was eerie since it almost didn’t happen; Armstrong Plumbing was the only cold call they made twice.\n\nThey played her a recording of their one product, an automated call reminding customers of upcoming appointments. Flowers had just lost the employee who made those calls for her shop and hadn’t replaced her. “That hooks me,” she said.\n\nOnce the product worked for Flowers, her word of mouth took Broccoli from one customer to 10, and the door-knocking stopped. “She was the operator who helped us create this,” Jain said. “She’s the soul of the company.”\n\nThe woman at the counter\n\nTo understand this unlikely alliance, it helps to understand where Flowers came from. Born in 1963, she grew up in a blue-collar family in Anaheim, Calif., one of five children. Her father was a commercial plumber who built restaurants, hotels and schools, and plumbers were regulars at the family breakfast table, while her mother stayed home. “Very, very much Brady Bunch family,” Flowers said.\n\nShe was the middle child, and the “hellraiser.” At 14, she sat her parents down at dinner and told them they were done raising her. “From here on out, I got this,” she recalled saying, describing herself as “barely a high school graduate.” She got pregnant at 19, had her son at 20 and raised him as a single mother. “I really went sideways for a while,” she said. She found her faith at 26.\n\nShe has a name for that stretch of life, roughly ages 16 to 26: “the stupid stage.” Decades of hiring young tradesmen gave her patience for men still in it. “I have a lot of grace for people because I was one of those,” she said.\n\nShe joined her father’s company in 1995, then opened its residential service-and-repair business in 2011. She said she grew it from about $1 million to $8 million in seven years with no outside capital, operating in a “very male-dominated” field.\n\nCOVID hit hard. She said she was sick for about nine months with long COVID, and the business “tanked.” She had already battled cancer twice, she said, both times diagnosed as terminal, and was not expected to live past 35. “I have been through hell and high water in my life,” she said. After she failed to sell the business in 2023, something told her to “wait till June,” and that’s when she met the Broccoli boys. Then a five-minute pitch turned into a half-four consultation.\n\nWithin two days, Flowers recalled, Jain and Ketkar had loaded the reminder bot with her scripts. But her real pain was the answering service. She was paying $5,000 a month for one that booked jobs into her software 33% of the time and asked whether the founders could do for inbound calls what they’d done for outbound. “We had that in 10 days,” she said.\n\nFor about three months, Jain said, the founders stopped writing code in San Francisco and began doing it from Flowers’ shop in Sacramento while she explained how a contracting business worked. “They didn’t speak trade,” Flowers said. “They knew nothing about a plunger and a toilet.” She became their first customer, then an adviser, then COO.\n\nFans of AMC’s Halt and Catch Fire series will recognize the arrangement. In the show, John Bosworth, the Texas computer-company salesman played by Toby Huss, ends up running the business side of a startup founded by a far younger coder: part operator, part surrogate parent. She also designed the logo, the brand colors and the first trade-show booth. “In my own heart they were like my two kids,” Flowers said of her ostensible bosses. “I didn’t assume the mom role. I probably did a little bit.”\n\n‘Not taking away jobs’\n\nJain and Flowers both say AI is a teammate rather than a replacement. Jain said a call-center representative at a Utah customer threatened to quit if the owner and his wife took Broccoli away. “It’s not taking away jobs,” Jain said. “It’s making jobs.” Owners who never took vacations now do, he said.\n\nStill, Jain acknowledged limits to what he’s built. The AI is “maybe good at like 80% of the tasks,” he said, with the other 20% needing human judgment. Emergencies such as a flooding basement or a fire go to people in the contractor’s office.\n\nJain sees Broccoli as a “business in a box” that could let a young technician in, say, Columbus, Ohio, start a company without first hiring a receptionist and a bookkeeper.\n\nBy his telling, Broccoli has built maybe 1% of what it plans to, and his company competes with the AI labs “not just for talent, even for real estate,” Jain said. Its San Francisco office shares a parking lot with Cognition, and at least 30% of his engineers still work on-site with customers. Jain said he was in Utah visiting a customer the week before and was headed to Arkansas that Sunday to visit another.\n\n“Half of the week is an existing customer who we are working with on a product that we’ve not even released yet,” he said. “We are at a scale which is, like, a growth-stage company, but you’re still in the zero-to-one phase because there’s so much more to build.”\n\nhttps://t.co/0KXeWleVk6", "posted_utc": "2026-10-30T10:55:57.000Z", "posted_ct": "Oct 30, 05:55 AM CT", "likes": 5, "replies": 2, "reply": "", "angle": "Owner-turned-COO: HVAC test bed parallel", "tier": "Reply now", "hot": true, "new": true}, {"handle": "guilleflorvs", "name": "Guillermo Flor", "followers": 12760, "id": "2116109740832936033", "url": "https://x.com/guilleflorvs/status/2116109740832936033", "text": "Sequoia's thesis that the next $1T company will sell work, not software, is the most important reframe in AI right now.\n\nThe argument: if you sell a copilot, you're competing with every new model release. But if you sell the outcome, books closed, contracts reviewed, claims handled, every AI improvement makes your margins better, not your product obsolete.\n\nThe key insight most people miss: for every $1 spent on software, ~$6 is spent on services.\n\nThe entire SaaS playbook was about capturing the software dollar. The AI playbook is about capturing the services dollar, at software margins.\n\nNot \"AI for accountants.\" The AI accounting firm.\nNot \"AI for lawyers.\" The AI law firm.\n\nThe companies that figure this out won't look like SaaS companies. They'll look like services firms rebuilt on software infrastructure.\n\nThat's a fundamentally different company to build, fund, and scale. And most founders are still building copilots.\n\nI went deeper on this in AI Market Fit: Sequoia Capital: The next $1T company won’t sell software. It will sell the work.\nhttps://t.co/DVNi7LQ6JW", "posted_utc": "2026-10-30T10:07:32.000Z", "posted_ct": "Oct 30, 05:07 AM CT", "likes": 9, "replies": 7, "reply": "", "angle": "Selling the work: your HVAC company", "tier": "Reply now", "hot": false, "new": true}, {"handle": "agazdecki", "name": "Andrew Gazdecki", "followers": 317128, "id": "2116137980842971172", "url": "https://x.com/agazdecki/status/2116137980842971172", "text": "A founder who makes $300K a year for 10 years and then sells their startup for $3M has made $6M from one business and I think that's a pretty underrated way to get wealthy.\n\nImagine bootstrapping a small SaaS company.\n\nYou've got 5 employees, a few hundred customers, and a product that solves a pretty boring problem.\n\nNobody is writing TechCrunch articles about you.\n\nYou're probably not getting invited to speak at startup conferences lol.\n\nBut every year you're making $300K.\n\nOver 10 years, that's $3M.\n\nThen one day you decide you're ready to move on.\n\nYou find a buyer who loves the business and sell it for another $3M.\n\nThat's $6M in total earnings and sale proceeds before taxes.\n\nAll from a company you built from scratch.\n\nI think founders sometimes forget that you can make a ton of money along the way and still have a valuable business to sell at the end.\n\nYou don't need to build the next unicorn.\n\nA profitable little startup that quietly makes money for a decade can turn into a pretty incredible financial outcome.\n\nP.S. thinking about selling your startup? Our team will help you understand what your business is worth, prepare it for buyers, and guide you through the entire acquisition process. Meet the team here: https://t.co/6hqLR8REAe", "posted_utc": "2026-10-30T11:59:45.000Z", "posted_ct": "Oct 30, 06:59 AM CT", "likes": 6, "replies": 4, "reply": "", "angle": "Boring profitable business, YC founder view", "tier": "Reply now", "hot": false, "new": true}, {"handle": "noahiglerSEO", "name": "Noah Igler", "followers": 7537, "id": "2116127986730631381", "url": "https://x.com/noahiglerSEO/status/2116127986730631381", "text": "We've never seen Google filter as many reviews as it is right now.\n\nSo when we launch a new Google profile, we build it up to 40+ reviews a month by month four instead of hitting it with 200 in month one.\n\nMonth one gets about 15 reviews, month two 25 to 30, month three 30 to 35, then 40 to 45 a month after that. One review link lets us point reviews at whichever profile needs them, so the new one gets a growing share while the older ones stay steady.\n\nThe system behind the 7,482 new Google reviews our partners got in September:\n\n1. Booked: text the homeowner a photo of the tech who's coming\n2. On the job: the tech asks in person at the moment of relief, with a QR code or tap card on the back of their phone. The review comes from the customer's phone, and the tech can suggest mentioning the service and text over the after photo to attach. The job can't close in the CRM until the ask is checked off, a version of the rule Tommy Mello has talked about running at A1. About 60% of our partners' reviews come from this step.\n3. Right after: a review button on the invoice and a text from the tech by name. On big tickets, the GM or office calls the next day.\n4. Follow-ups: a text at 12 hours, an email with the job photos at 24, an office call around 48, and a check-in at 7 days\n5. Past customers: maintenance members who never left a review first, then the rest of the CRM, worked in waves over a few months instead of one blast\n6. Replies: every review gets one, including the 1-stars\n\nThen pay your team for it. We recommend about $30 a review for techs and CSRs in plumbing and HVAC, a weekly leaderboard, and a prize at the end of the month.\n\nThe target is a 30%+ review rate, new reviews divided by jobs, held month after month.", "posted_utc": "2026-10-30T11:20:02.000Z", "posted_ct": "Oct 30, 06:20 AM CT", "likes": 4, "replies": 3, "reply": "", "angle": "Reviews ramp at the Texas HVAC shop", "tier": "Reply now", "hot": false, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';

const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;

c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}${isQt?'<span class="badge" style="background:#7c3aed">QT</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>

${p.angle?'<div class="angle">Angle: '+esc(p.angle)+'</div>':''}<textarea placeholder="${isQt?'Your quote take...':'Your one-liner...'}">${esc(draft)}</textarea><div class="row"><button class="primary rp">${isQt?'Quote on X':'Reply on X'}</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};

const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}

else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
