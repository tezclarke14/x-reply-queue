<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

*{box-sizing:border-box}body{margin:0;font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:#f5f6f8;color:#14171a}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e3e6ea;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1}.pill{background:#eef3ff;color:#1d4ed8;border-radius:99px;padding:4px 10px;font-weight:600}
.bar{height:4px;background:#e3e6ea;width:100%}.bar i{display:block;height:100%;background:#1d9bf0;width:0}
button{font:inherit;border:1px solid #cfd5db;background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{background:#0f1419;color:#fff;border-color:#0f1419}
main{max-width:680px;margin:0 auto;padding:12px}h2{font-size:13px;text-transform:uppercase;color:#536471;margin:18px 4px 8px}

.card.done{opacity:.45}.card.skip{opacity:.3}.who{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.who b{font-size:15px}.muted{color:#536471;font-size:13px}.text{white-space:pre-wrap;margin:8px 0;max-height:220px;overflow:auto}
textarea{width:100%;min-height:84px;font:inherit;border:1px solid #cfd5db;border-radius:8px;padding:8px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.cnt{margin-left:auto;font-size:13px;color:#536471}.cnt.over{color:#d00;font-weight:700}
a{color:#1d9bf0;text-decoration:none}
.card.new{border-left:5px solid #16a34a}.card.hot{background:#fff4d6;border-color:#f0b429}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:4px;color:#fff;vertical-align:middle}
.b-new{background:#16a34a}.b-hot{background:#e8590c}.legend{font-size:13px;color:#536471;margin:4px 4px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}

<main><div class="legend"><span><span class="sw" style="border-left:5px solid #16a34a;background:#fff;border:1px solid #ccc;border-left:5px solid #16a34a"></span><span class="badge b-new">NEW</span>new account / first time in queue</span><span><span class="sw" style="background:#fff4d6;border:1px solid #f0b429"></span><span class="badge b-hot">HOT</span>top pick / highest engagement</span></div><div id="list"></div></main>
<script>
const POSTS=[{"handle": "agazdecki", "name": "Andrew Gazdecki", "followers": 316746, "id": "2113603036614738276", "url": "https://x.com/agazdecki/status/2113603036614738276", "text": "I'd take a $4M cash offer for my startup over a complicated $5M offer any day of the week. \n\nHere's why. \n\nBuyer #1 offers you $4M in cash at closing.\n\nBuyer #2 offers you $5M.\n\nSounds like an easy decision, right?\n\nExcept buyer #2 wants to pay you $3M upfront, $1M over the next two years, and another $1M if the business hits certain revenue targets.\n\nOh and they want you to stick around for three years.\n\nSuddenly that extra $1M doesn't sound quite as exciting. Haha.\n\nI've seen founders get so focused on the headline acquisition price that they overlook how much money they're actually guaranteed to receive.\n\nAnd who wants to spend 3 years working for someone else just to hopefully collect the rest of their exit?\n\nObviously every deal is different.\n\nSometimes earnouts and seller financing make a ton of sense.\n\nBut if you've spent the last five years building a startup and someone offers you $4M in cash to buy it, that's a pretty incredible outcome.\n\nThe amount you actually get paid matters a whole lot more than the number in the press release.\n\nP.S. thinking about selling your startup? Our team will help you understand what your business is worth, prepare it for buyers, and guide you through the entire acquisition process. Meet the team here: https://t.co/6hqLR8REAe", "posted_utc": "2026-10-23T12:06:47.000Z", "posted_ct": "Oct 23, 07:06 AM CT", "likes": 8, "replies": 7, "reply": "That extra $1M is a 3-year job offer with a bonus you don't control. In a trades deal it's worse: the earnout rides on techs who were loyal to you, not the buyer.", "tier": "Reply now", "hot": true, "new": true}, {"handle": "ChrisRamsey60", "name": "Chris Ramsey | SMB and R.E.", "followers": 125043, "id": "2113595155756265745", "url": "https://x.com/ChrisRamsey60/status/2113595155756265745", "text": "You need to get multiple loan quotes on every deal.\n\nI just got five quotes for the same deal:\n\n6.5%\n6.975%\n7%\n7.1%\n7.2%\n\nSame borrower. Same property. Five different rates.\n\nA few extra phone calls can make a big difference in your cash flow.", "posted_utc": "2026-10-23T11:35:28.000Z", "posted_ct": "Oct 23, 06:35 AM CT", "likes": 18, "replies": 4, "reply": "70 basis points from five phone calls. Most owners spend more time picking a truck wrap than shopping their debt.", "tier": "Reply now", "hot": false, "new": true}, {"handle": "Codie_Sanchez", "name": "Codie Sanchez", "followers": 715774, "id": "2113453377883394484", "url": "https://x.com/Codie_Sanchez/status/2113453377883394484", "text": "Never apologize for charging what you’re worth. https://t.co/AYkaZ6KTHx", "posted_utc": "2026-10-23T02:12:06.000Z", "posted_ct": "Oct 22, 09:12 PM CT", "likes": 530, "replies": 45, "reply": "Trades version: the cheapest quote wins the job and loses the business. Charge enough to answer the phone on a Sunday in August.", "tier": "Reply now", "hot": false, "new": true}, {"handle": "ericwilliamrea", "name": "Eric Rea", "followers": 4715, "id": "2113265406316044777", "url": "https://x.com/ericwilliamrea/status/2113265406316044777", "text": "We built a $150M ARR business twice.\n\nThe first time took 8 years. The second took 2.5.\n\nToday, Podium crossed $150M in AI annual recurring revenue.\n\nThree years ago, we already had a great software business. Well over $100M in revenue, tens of thousands of customers, and a product we'd spent nearly a decade building.\n\nAnd we decided to start over.\n\nThe business was performing well. But we believed AI was going to fundamentally change the software industry and make much of traditional software obsolete.\n\nAs a founder, you pour your life into what you're building. An insane amount of time, sacrifice, and effort. The hard part is not getting too attached to it.\n\nWhen we started building our first AI agents, we had to confront the possibility that much of what we'd built might not be that valuable in the future. That's a tough pill to swallow.\n\nBut we also realized those same 10 years had put us in a unique position to take advantage of what AI could do for our customers.\n\nInstead of protecting what we'd spent a decade building, we decided to bet the future of the company on AI employees that actually do the work for our customers.\n\nWe massively underestimated what we'd signed up for.\n\nWe ended up building entirely new operating systems for the industries we serve, from the AI agents all the way down to the systems of record. Now customers run their entire businesses on Podium.\n\nReinventing our product wasn't even the hardest part. We had to reinvent how the entire company operated.\n\nWhen you've been running a company for over a decade, the operational inertia is incredibly powerful. We had to rethink how we build products, how we sell, how we serve customers, and how we run the business.\n\nWe effectively started a second startup inside an already successful company. And we're still at the very beginning.\n\nToday, we have 20,000 AI agents working for our customers. They've helped generate more than $13 billion in revenue for those businesses. And we're barely scratching the surface of what AI will be able to do for them.\n\nAnd we've done all of this while becoming profitable and generating free cash flow. We're building Podium to be around for decades.\n\nHuge credit to our team for having the guts to make this bet and the ability to actually pull it off. We still have a long way to go and tons of problems to solve, but it's so damn fun to be winning when the opportunity ahead is this big.\n\nIn the age of AI, you can either disrupt your own company or wait for somebody else to do it.\n\nI'd rather do it ourselves.", "posted_utc": "2026-10-22T13:45:10.000Z", "posted_ct": "Oct 22, 08:45 AM CT", "likes": 691, "replies": 131, "reply": "Starting over at $100M+ is the hardest part of this story. In home services the system of record is often the owner's cell phone, so building all the way down is the only way the agent works.", "tier": "New account: just added", "hot": true, "new": true}, {"handle": "DannyMagazu", "name": "Dan Magazu", "followers": 5717, "id": "2113329319166542308", "url": "https://x.com/DannyMagazu/status/2113329319166542308", "text": "One of the biggest marketing opportunities for home service businesses right now is the owner getting on camera for their Facebook ads.\n\nPull out your phone and record a little selfie video talking about your business.\n\nIn so many industries, these kinds of videos dominate, but I haven't seen them take off in home services yet.\n\nMost owners skip it because they're not used to being on camera.\n\nBut in our tests, video ads have significantly outperformed static ones, and the owner's selfie video works phenomenally.", "posted_utc": "2026-10-22T17:59:08.000Z", "posted_ct": "Oct 22, 12:59 PM CT", "likes": 39, "replies": 20, "reply": "Owner selfies work because local trades run on trust. Two Austin property managers asked me why our number shows up as Palo Alto. A face fixes that faster than a logo.", "tier": "New account: just added", "hot": false, "new": true}, {"handle": "_toddanderson", "name": "Todd Anderson - SEO for the Trades", "followers": 7499, "id": "2113588499731345890", "url": "https://x.com/_toddanderson/status/2113588499731345890", "text": "A profile with 25,000 reviews lost the map pack to one with 1,400. Here's what I'd do if I owned the big one. \n\nWhat they do well: decades in business, a brand everyone in DFW knows, fresh 5-star reviews coming in constantly. \n\nSo we know reviews aren't the problem.\n\n1. The category. Their website sells plumbing, HVAC and electrical. Their Google profile is set up as HVAC only. So for a plumbing search, Google has a 25,000-review HVAC company to rank. \n\nFix: if you're a multi-trade home service contractor, you need to have multiple business profiles targeting one of your singular services per profile. \n\n2. The name. The 1,400-review profile filed a DBA and got keywords added to their business name for emergency plumbing services. \n\nFix: for the 25,000-review juggernaut, I would get other business profiles stood up, file the DBAs for each one, and get keywords added to those business profiles titles/names \n\n3. The location. One address can't be close to every searcher in a metro the size of DFW.\n\nFix: put each new profile where the profitable jobs are. If central Dallas is the money, that's where the plumbing location goes. \n\nThe problem with companies like this is they have an insane review velocity, getting 3 five-star reviews a day, but they're all being slammed onto a profile that targets the wrong clients.", "posted_utc": "2026-10-23T11:09:01.000Z", "posted_ct": "Oct 23, 06:09 AM CT", "likes": 0, "replies": 1, "reply": "25,000 reviews on the wrong category is just a very loud HVAC company.\n\nWe're building an HVAC shop in Texas from zero reviews.\n\nPoint 1 is the cheapest lesson I've read all week. Pick the category before you chase the stars.", "tier": "New account: just added", "hot": false, "new": true}, {"handle": "noahiglerSEO", "name": "Noah Igler", "followers": 7489, "id": "2113591272975843488", "url": "https://x.com/noahiglerSEO/status/2113591272975843488", "text": "Roto-Rooter, A1 Garage Door, Parker & Sons, and One Hour Heating & Air have almost nothing in common.\n\nUnder the hood, they all run the same 6 moves on Google.\n\nHere's each one, and how a $10M shop copies it: https://t.co/8BjCCQOXDq", "posted_utc": "2026-10-23T11:20:02.000Z", "posted_ct": "Oct 23, 06:20 AM CT", "likes": 7, "replies": 2, "reply": "Four brands, one playbook.\n\nThe moat isn't the van wrap. It's boring Google work done every week.\n\nStarting an HVAC company from zero right now. Taking notes on all 6.", "tier": "New account: just added", "hot": false, "new": true}, {"handle": "LoganARobison", "name": "Logan Robison", "followers": 9203, "id": "2113275311970189709", "url": "https://x.com/LoganARobison/status/2113275311970189709", "text": "I own an Airbnb cleaning business. This was the best possible outcome for me and the worst possible outcome for guests and hosts\n\nThe fewer things a host can ask a guest to do, the more they will ask us to do and the more we will charge for a cleaning fee. That cleaning fee will continue to get pushed onto the guests which raises the cost of every booking. Or, the host will eat the increased cost we give them and their profitability will decrease\n\nGuests pay more, hosts pay more, cleaning companies make more\n\nLose, lose, win", "posted_utc": "2026-10-22T14:24:31.000Z", "posted_ct": "Oct 22, 09:24 AM CT", "likes": 952, "replies": 1387, "reply": "Every rule a host adds becomes a line item on your invoice.\n\nLose, lose, win is the most honest P&L on here.\n\nService businesses quietly win when someone else makes the job harder.", "tier": "New account: just added", "hot": true, "new": true}, {"handle": "lawyer4SMBs", "name": "Eric Hsu", "followers": 21710, "id": "2113262872897741130", "url": "https://x.com/lawyer4SMBs/status/2113262872897741130", "text": "Seller hired a litigator.\n\nSix turns of the purchase agreement.\n\nThree and a half months on the PA alone.\n\nThe closing date was decided the day the seller picked his lawyer. \n\nThat's why I put in every LOI a sentence whereby the seller agrees to hire \"competent transactional counsel.\"\n\nNot legally binding. \n\nBut psychologically binding.", "posted_utc": "2026-10-22T13:35:06.000Z", "posted_ct": "Oct 22, 08:35 AM CT", "likes": 10, "replies": 5, "reply": "The closing date was decided the day the seller picked his lawyer.\n\nBrutal. And true.\n\nPsychologically binding is the most underrated clause in an LOI.", "tier": "New account: just added", "hot": false, "new": true}, {"handle": "agazdecki", "name": "Andrew Gazdecki", "followers": 316746, "id": "2113427992735277408", "url": "https://x.com/agazdecki/status/2113427992735277408", "text": "Startup founders should remember that the world rewards people who actually makes stuff happen.", "posted_utc": "2026-10-23T00:31:13.000Z", "posted_ct": "Oct 22, 07:31 PM CT", "likes": 105, "replies": 16, "reply": "Research feels like progress because nobody can reject it. Making stuff happen means someone can say no, which is why most people stall.", "tier": "Worth a reply", "hot": false, "new": true}, {"handle": "cleanwithmike", "name": "Mike Cleans", "followers": 82197, "id": "2113329063242719697", "url": "https://x.com/cleanwithmike/status/2113329063242719697", "text": "Everyone's worried AI will replace their job.\n\nMeanwhile, I'm looking at all the businesses AI can help one person operate:\n\n• Home maintenance\n• Cleaning companies\n• Landscaping services\n• Property management\n\nTons of opportunity out there right now.", "posted_utc": "2026-10-22T17:58:07.000Z", "posted_ct": "Oct 22, 12:58 PM CT", "likes": 18, "replies": 4, "reply": "Add HVAC to the list. The hard part isn't the AI. It's the license, the trucks, and the first property manager who'll take your call.", "tier": "Worth a reply", "hot": false, "new": true}, {"handle": "andywalkerhq", "name": "Andy Walker - SMB Marketing", "followers": 8002, "id": "2113298143181680973", "url": "https://x.com/andywalkerhq/status/2113298143181680973", "text": "If you hate selling, great.\n \nBuild an offer so clear and a guarantee so strong that the homeowner talks himself into it, and you'll never have to be the pushy guy to win the job.", "posted_utc": "2026-10-22T15:55:15.000Z", "posted_ct": "Oct 22, 10:55 AM CT", "likes": 14, "replies": 4, "reply": "Best close I heard this week wasn't mine. A realtor said \"I appreciate the hustle\" and offered to post us in her 177-person vendor group. Clear offer, zero pushing.", "tier": "Worth a reply", "hot": false, "new": true}, {"handle": "zachglabman", "name": "zach", "followers": 11841, "id": "2113324056665555048", "url": "https://x.com/zachglabman/status/2113324056665555048", "text": "big thanks to @connorkapoor @rhobusiness for cohosting Made In America (Austin) last night 🤙\n\n@digitalmetalinc makes the fastest castings in the west\n\nWe saw a live demo of the full process and screened Made Right Here, covering the skilled trades workforce America needs to win https://t.co/BfkkeOW5V4 https://t.co/CEGYHdPNEF", "posted_utc": "2026-10-22T17:38:13.000Z", "posted_ct": "Oct 22, 12:38 PM CT", "likes": 72, "replies": 6, "reply": "Building an HVAC company just up the road in Hutto. The trades story in central Texas is getting more interesting than the tech one.", "tier": "Worth a reply", "hot": false, "new": true}, {"handle": "sweatystartup", "name": "Nick Huber", "followers": 528762, "id": "2113302306682794452", "url": "https://x.com/sweatystartup/status/2113302306682794452", "text": "I know a lot of very average people who make phenomenal money simply because they aren’t insecure. \n\nThey are confident enough in themselves and their own abilities to move forward regardless of other people’s opinions. \n\nThey aren’t afraid to make an ask, do some marketing to drum up business, or hop on the phone to spend a few days or weeks cold calling folks when business gets slow. \n\nThey don’t spend time feeling sorry for themselves if some of their calls or campaigns don't work out. \n\nThey don't waste days or weeks second guessing their strategy or over-analyzing what someone said to them last week in an email or on the phone. \n\nThey just move forward and keep taking action.", "posted_utc": "2026-10-22T16:11:47.000Z", "posted_ct": "Oct 22, 11:11 AM CT", "likes": 617, "replies": 50, "reply": "11 cold calls to property managers in two days. Half assumed I wanted to rent an apartment. You keep dialing anyway, that's the whole edge.", "tier": "Worth a reply", "hot": false, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
<textarea>${esc(draft)}</textarea><div class="row"><button class="primary rp">Reply on X</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>window.open('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value),'_blank','noopener');
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
