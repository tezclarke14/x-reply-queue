<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

*{box-sizing:border-box}body{margin:0;font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:#f5f6f8;color:#14171a}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e3e6ea;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

button{font:inherit;border:1px solid #cfd5db;background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}

main{max-width:680px;margin:0 auto;padding:12px}h2{font-size:13px;text-transform:uppercase;color:#536471;margin:18px 4px 8px}

.card.done{opacity:.45}.card.skip{opacity:.3}.who{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.who b{font-size:15px}.muted{color:#536471;font-size:13px}.text{white-space:pre-wrap;margin:8px 0;max-height:220px;overflow:auto}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.cnt{margin-left:auto;font-size:13px;color:#536471}.cnt.over{color:#d00;font-weight:700}
a{color:#1d9bf0;text-decoration:none}
.card.new{border-left:5px solid #16a34a}.card.hot{background:#fff4d6;border-color:#f0b429}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:4px;color:#fff;vertical-align:middle}
.b-new{background:#16a34a}.b-hot{background:#e8590c}.legend{font-size:13px;color:#536471;margin:4px 4px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.angle{background:#eef3ff;border-left:3px solid #1d4ed8;padding:6px 10px;border-radius:6px;margin:8px 0;font-weight:600}.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:4px}
</style></head><body>
<header><h1>X Reply Queue <span class="muted">@onhand_terry</span></h1>
<span class="pill" id="prog"></span><span class="pill" id="timer">30:00</span>
<a class="pill" href="scorecard.html" style="text-decoration:none">📊 Scorecard</a><a class="pill" href="plan.html" style="text-decoration:none">🗓️ Plan</a><a class="pill" href="investors.html" style="text-decoration:none">💼 Investors</a><button id="tbtn">Start</button><button id="treset">Reset</button></header><div class="bar"><i id="pbar"></i></div>
<main><div class="legend"><span><span class="sw" style="border-left:5px solid #16a34a;background:#fff;border:1px solid #ccc;border-left:5px solid #16a34a"></span><span class="badge b-new">NEW</span>new account / first time in queue</span><span><span class="sw" style="background:#fff4d6;border:1px solid #f0b429"></span><span class="badge b-hot">HOT</span>top pick / highest engagement</span></div><div id="list"></div></main>
<script>
const POSTS=[{"handle": "sweatystartup", "name": "Nick Huber", "followers": 535826, "id": "2116485800904827155", "url": "https://x.com/sweatystartup/status/2116485800904827155", "text": "Europe is a growing market for Somwhere dot com. \n\nWhy hire under your own worthless government when you can hire contractors in the Philippines or South Africa who show up and kick ass? https://t.co/LGNyhALqTx", "posted_utc": "2026-10-31T11:01:51.000Z", "posted_ct": "Oct 31, 06:01 AM CT", "likes": 12, "replies": 4, "reply": "", "angle": "Offshore CSRs vs AI at the HVAC shop", "tier": "Reply now", "hot": true, "new": true}, {"handle": "noahiglerSEO", "name": "Noah Igler", "followers": 7544, "id": "2116493135039647899", "url": "https://x.com/noahiglerSEO/status/2116493135039647899", "text": "Every new Google Business Profile we launch goes through the same setup.\n\nWe've done it 40+ times for home service companies, including for 10+ eight-figure brands.\n\nHere's the whole thing, in order:\n\nBefore the profile exists:\n\n> A real office, with the lease in the business name, a permanent sign with the exact business name, and keys to the door. It's still the most reliable way to get a profile verified and keep it live.\n> If the name will have a keyword in it, the DBA gets filed first, and that same name goes on the lease, the sign, invoices and citations\n> Proof ready before you ask Google to verify: the lease, a utility bill or customer invoice at that address, and a shot list for the verification video\n\nDuring verification:\n\n> You don't need every field filled in to get verified. On one live video verification, the Google rep wouldn't approve a profile until the owner deleted every service area. Google also called the office to ask whether customers walk in.\n\nOnce it's verified:\n\n> Primary category for the trade that office runs, plus secondary categories for its other services\n> Every service it runs, each with a real description in the words people search\n> Its own tracking number, with the same name, address and number on 50 core directory listings\n> A website button that goes to that office's city page, with tracking tags\n> Booking turned on and pointed at the booking tool\n> Real photos from jobs in that area\n> Posts twice a week, each with a Learn More button pointing at a service or city page, which helps Google find those pages\n> Reviews built up over a few months: about 15 in month one, 25 to 30 in month two, 30 to 35 in month three, then 40 to 45 a month", "posted_utc": "2026-10-31T11:31:00.000Z", "posted_ct": "Oct 31, 06:31 AM CT", "likes": 3, "replies": 0, "reply": "", "angle": "What GBP verification looked like for your HVAC profiles", "tier": "Reply now", "hot": true, "new": true}, {"handle": "LoganARobison", "name": "Logan Robison ⚡️", "followers": 9249, "id": "2116503725321715882", "url": "https://x.com/LoganARobison/status/2116503725321715882", "text": ". @X paid my mortgage again this month \n\nDon’t know how I got so lucky that many of you follow me here. I’ll try to share the little that I’ve learned about growing a (modest) following here on X. Hope it’s helpful to someone who is trying to grow:\n\n1. Pick a lane and share everything you know\n\nWhen I first started posting, I only talked about starting a cleaning business. I was building it in real time and it was fun to share everything I was learning. My experiments, all my failures, and some of the successes\n\nEvery day I tried to share just 1 thing I learned. That provided content every day and helped others who were doing the same thing\n\n2. Make friends and be friendly with all. \n\nPeople follow people they like and trust (usually). Be someone that people like and enjoy engaging with. I’ve always tried to comment supportive / helpful things on other people’s content. Not only is it good for the soul + humanity, but it also helps you build relationships. That is actually important for building a following\n\n3. Post how you talk. \n\nPeople are on this platform for entertainment + education. Big words don’t usually work. They scare people because they’re not here for a lecture. Just post how you talk and you’ll draw people to you because you’re real\n\n4. Don’t try to be perfect and hide your scars. \n\nI share my failures all the time. I think that’s helped people trust and connect. No one wants to follow someone who is un relatable. \n\n5. Do stuff and talk about it\n\nLike actually be working on something (fitness, business, hobbies, etc). People want to see what other people are up to and share in their experiences. You will automatically attract people trying to learn/do the same things. \n\nMake it a series or “your thing”. At least for a while at the beginning \n\n6. Be patient\n\nIf you look at top creators on X, you’ll see they’ve posted thousands of times. It’s not a coincidence that, often, the number of followers someone has mirrors the number of times they’ve posted. There are exceptions of course but I’d say is true more times than not\n\nSo that’s it. That’s what I’ve learned from +8.6k posts and +9.2k followers (see what I did there 👀). Hope this was helpful to someone. Comment your questions (if any) and I’ll try to share what I know", "posted_utc": "2026-10-31T12:13:05.000Z", "posted_ct": "Oct 31, 07:13 AM CT", "likes": 0, "replies": 0, "reply": "", "angle": "Your lane: building an AI-run HVAC company", "tier": "Reply now", "hot": false, "new": true}, {"handle": "aiwithkelso", "name": "Micheal O'Neill", "followers": 3068, "id": "2116500624091054123", "url": "https://x.com/aiwithkelso/status/2116500624091054123", "text": "You're spending money on AI, but you're not seeing any more of it in your bank account.\n\nYou're in good company. In a Goldman Sachs survey of 1,256 US small business owners this year, 76% were using AI and only 14% had fully built it into how the business runs. Nearly half of the users said choosing the right tools was a struggle.\n\nI think the tools are the last thing to choose.\n\nA business with AI built in has three layers, and you can draw them on one page.\n\nAt the bottom is what the business knows, written down in plain files: what you do, who your customers are, and how the work gets done. I call that the organisational brain.\n\nIn the middle are AI team members. Each one is set up to do one job from those files. One drafts replies to enquiries. Another writes up your meetings.\n\nAt the top are your people. They check what the AI produces and keep the files current.\n\nWatch what happens when something changes. Update your opening hours in one file and every AI team member is using the new hours by that afternoon. Nobody retypes them into five different prompts.\n\nThe tools sit underneath all of this. You can swap them without starting again, because the knowledge lives in your files rather than inside any one product.\n\nUsing AI here and there saves you a few minutes a day, and building it in is what finally shows up in your bank account.\n\nComment BRAIN and I'll send you my business brain starter kit, with five templates and a prompt that interviews you to fill them in.", "posted_utc": "2026-10-31T12:00:46.000Z", "posted_ct": "Oct 31, 07:00 AM CT", "likes": 1, "replies": 0, "reply": "", "angle": "Only 14% built in: what the HVAC test bed shows", "tier": "Reply now", "hot": false, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');const isQt=p.mode==='qt';
c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}${isQt?'<span class="badge" style="background:#7c3aed">QT</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
${p.angle?'<div class="angle">Angle: '+esc(p.angle)+'</div>':''}<textarea placeholder="${isQt?'Your quote take...':'Your one-liner...'}">${esc(draft)}</textarea><div class="row"><button class="primary rp">${isQt?'Quote on X':'Reply on X'}</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>{const u=isQt?('https://x.com/intent/post?url='+encodeURIComponent(p.url)+'&text='+encodeURIComponent(ta.value)):('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value));window.open(u,'_blank','noopener')};
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
