<script>
const POSTS=[{"handle": "agazdecki", "name": "Andrew Gazdecki", "followers": 317428, "id": "2118691439010095273", "url": "https://x.com/agazdecki/status/2118691439010095273", "text": "I think more founders should consider buying their second startup instead of building it from scratch.\n\nHear me out.\n\nYou spend five years bootstrapping a SaaS company.\n\nFinally sell it for $3M.\n\nYou've learned how to build products, hire employees, acquire customers, and run a business.\n\nNow you're ready for your next adventure.\n\nMost founders immediately start thinking about what they should build next.\n\nBut what if you bought a SaaS company already doing $300K in annual revenue?\n\nIt has paying customers.\n\nA working product.\n\nSome organic traffic.\n\nMaybe even a small team.\n\nYou could spend the next three years growing that business instead of spending the first year trying to get your first 10 customers again lol.\n\nAnd with your experience, you might see opportunities the previous founder never had the time or resources to pursue.\n\nObviously buying a startup comes with its own risks. You still need to understand the customers, financials, and why the owner wants to sell.\n\nBut I think experienced founders are uniquely positioned to become incredible startup buyers.\n\nYou've already learned how to build a company.\n\nImagine what you could do with one that already has a head start.\n\nP.S. thinking about selling your startup? Our team will help you understand what your business is worth, prepare it for buyers, and guide you through the entire acquisition process. Meet the team here: https://t.co/6hqLR8REAe", "posted_utc": "2026-11-06T13:06:17.000Z", "posted_ct": "Nov 06, 07:06 AM CT", "likes": 5, "replies": 6, "reply": "", "angle": "Buying vs building: ops is the moat", "tier": "Reply now", "hot": true, "new": true}, {"handle": "noahiglerSEO", "name": "Noah Igler", "followers": 7595, "id": "2118679820234023310", "url": "https://x.com/noahiglerSEO/status/2118679820234023310", "text": "Orkin's parent company, Rollins, told investors in September that leads had been falling by double digits since May.\n\nIts CEO's best guess is that at least half of that drop comes from the shift to AI search.\n\nSo we went through all 461 of Orkin's U.S. Google profiles, every review they got in the last 30 days, the map results in 15 big metros and the whole website.\n\n(Bookmark this)\n\n1. What Rollins told investors\n\nOrkin is the flagship brand at Rollins, a public company that did $3.76 billion in revenue last year. Orkin alone has more than 350 company-owned branches in the U.S.\n\nIn May, Orkin's VP of marketing, citing recent reporting, told investors that Orkin had the number one share of AI visibility among pest control brands. In September, at a J.P. Morgan conference, Rollins CEO Jerry Gahlhoff described double-digit lead declines and said that if he had to name it, \"at least 50 to 60% of what we experienced is probably related to this shift in the LLMs.\"\n\nHe also explained what changed. In the old search world, \"Google ratings, or your Google reviews, were the key driver of a lot of that search.\" Now, \"Chat's not going to use Google's reviews, they're going to use someone else, and they partnered with Yelp.\" And about the company's own websites, \"We have 400 branch web pages that all have to make sure we have the local feel.\"\n\nRollins' October earnings deck lays out the fix, including \"optimizing business listings and reviews,\" \"expanding locally relevant content,\" \"greater price transparency\" and \"same- and next-day availability.\" It also says Orkin showed \"early but encouraging signs of progress\" by the end of the quarter.\n\nThat's the list we checked Orkin against.\n\n2. How Orkin's local setup works\n\nThe foundation is clean, and it's more than most home service companies have.\n\n> Nearly every office has its own Google profile, its own local phone number and its own page on https://t.co/miikfIE7u1, and the profile and the page almost always match. The numbers are assigned in blocks, like 786-868-1001, 1002 and 1003 for three Miami-area offices.\n> 449 of the 461 profiles send the website click to that office's page, and 444 of those links carry the same tracking tags (utm_source=local, utm_medium=local and a campaign code that's usually specific to the office). That's how Orkin can see what each profile brings in.\n> 448 of the 461 profiles are named just \"Orkin,\" with no service or town in the name. Ten of the others belong to its insulation business and are named \"Orkin Therm\" or \"Orkin Insulation,\" and a few of those sit at the same address as a pest control office.\n\nThe website follows the same structure. There are 49 state pages, about 1,600 town pages and 469 branch records. Each office page sits under the town it's in, and most town pages are for towns without an office. Each of those names the office that serves it, so the Temple, GA page points to the Carrollton office.\n\nThe office pages we checked name the branch manager and say \"Call Before Noon for Same-Day Service.\" Residential calls, commercial calls and customer service each get their own toll-free number. The homepage runs a different promo code (50OFF) than the estimate page (APPLY75), which is a simple way to see which page drove the first job. There's also a quote tool that asks for your address, bedrooms, bathrooms and yard size.\n\nPart of why it's all so consistent is ownership. Orkin started franchising in 1994, mainly for smaller markets, and its filings describe a contract option to buy franchises back at a formula price. Today it has nearly 50 U.S. franchises against more than 350 company branches, and on the website, you can't tell which locations are franchises.\n\n3. The reviews\n\nIn the last 30 days, all 461 profiles got 3,339 new reviews combined. That's about 7 per profile, and the median is 6.\n\n72 profiles got zero, and about 7 in 10 got fewer than 10. Only 19 got 20 or more, and only 2 got 30 or more: Sterling Heights, MI with 32 and Indianapolis with 30.\n\nFor comparison, when we pulled A1 Garage Door last month, it got 3,806 new reviews in 30 days across 111 profiles. That's about 34 per profile, almost 5 times Orkin's pace.\n\nBig review totals don't mean the reviews are still coming in. Orkin's most-reviewed profile, in Crestwood, IL, has 4,391 reviews and got 1 this month. Cherry Hill, NJ (3,693), Long Beach, CA (3,372) and San Antonio (2,934) got none. Across all 461 profiles, there's almost no link between how many reviews a profile has and how many it got this month.\n\nOne pattern stood out. In 14 cities, Orkin has a big profile that stopped getting reviews and a smaller profile in the same city that's getting them. In Charlotte, the profile with 2,470 reviews got 0 this month, and the one with 307 got 17. In Jacksonville, the profile with 2,072 got 1, and the one with 579 got 22. Both profiles in each city are live branches with their own pages on orkin(dot)com, and from the outside, there's no way to tell why.\n\nTwo more details. A third of the new reviews (1,079 of 3,339) are star ratings with no text, so they don't mention the service or the town. And 83% came in Monday through Friday, with almost half landing between noon and 5 p.m. Eastern, which fits techs asking on the job.\n\n4. Where Orkin shows up on the map, and where it doesn't\n\nWe searched \"pest control\" and \"exterminator\" in 15 big metros and pulled the top 10 local results for each. Orkin showed up in 16 of the 30 result sets. It didn't show up for either search in Dallas, Phoenix, Chicago, New York, Seattle or Boston.\n\nIn four of those six (Dallas, Chicago, Seattle and Boston), Orkin doesn't have a profile with an address in the city. Its Dallas town page lists offices in Forney, Wylie and Carrollton. In the Chicago area, Orkin has 14 profiles and none in the city. The Crestwood profile has more reviews than any company that showed up for Chicago, and it still didn't make the list. It's 17 miles from downtown.\n\nNew York shows it isn't only distance. Orkin's Astoria profile is in Queens, Queens companies showed up in the New York results, and Astoria didn't. It has 341 reviews and a 4.1 rating.\n\nPhoenix has a different problem. Orkin's Phoenix office has 392 reviews, while Moxie has 7,503. Orkin's biggest profile in the Phoenix area is in Peoria, with 2,254 reviews, and it got zero new ones this month.\n\nIn 11 of the 15 metros, a smaller competitor has more reviews than Orkin's most-reviewed profile anywhere in that metro:\n\n> Houston: Kindred has 11,394, and Orkin's top profile has 2,327\n> Phoenix: Moxie has 7,503, and Orkin's has 2,254\n> Seattle: Insight has 7,361, and Orkin's has 2,632\n> Atlanta: Hawx has 6,786, and Orkin's has 3,152\n> Denver: Berrett has 6,443, and Orkin's has 2,559\n> Charlotte: ClearDefense has 6,381, and Orkin's has 2,470\n> Nashville: EcoShield has 6,035, and Orkin's has 1,330\n\nEvery Orkin profile that did show up has an address in the city that was searched. Its best showings were first for \"exterminator\" in Denver, second in Miami and second for \"pest control\" in Los Angeles.\n\nMy read is that the map comes down to distance and reviews, and a famous name doesn't override either one.\n\n5. The website is wide, but thin\n\nMost of Orkin's roughly 1,600 town pages are one template with the town name swapped in. Lines like \"Proudly serving [town] and the surrounding areas\" and \"Most [town] customers get same-day or next-day service\" repeat from page to page. The part written for the town is usually a sentence or two, like \"Forney, Texas, is known as the Antique Capital of Texas.\"\n\nNone of the 21 town pages we sampled showed a review. Atlanta's page asks \"How much is pest control in Atlanta?\" and answers that costs \"can vary depending on the service, frequency of service required, and the size of the area affected.\" Meanwhile, Orkin publishes real price ranges in a cost guide elsewhere on the site, like $120 to $441 for ants, spiders or roaches and $1,000 to $2,300 for termite baiting.\n\nThere are cracks in the structure too. The California and Texas state pages stop at exactly 100 town links, so pages like San Diego and San Francisco aren't linked from them. The towns each office serves are listed as plain text instead of links. And the San Diego commercial office page says Orkin's \"commercial pest control services in Doral can help.\" Doral is in Florida.\n\nThat lines up with what the CEO said about all 400 branch pages needing \"the local feel.\"\n\nThe strongest part of the site is the pest library. It covers 59 pests across at least 300 pages, plus 321 \"Ask Orkin\" question pages, and most of them link to the matching service, the quote form and the branch finder.\n\n6. The Top 50 lists\n\nFour times a year, Orkin ranks the 50 worst cities for termites, mosquitoes, bed bugs or rats, based on its own treatment data. Local TV stations and news sites pick them up, and the bed bug list has been running since at least 2010.\n\nThe miss is that each 2026 list links only 1 to 12 of its 50 cities to Orkin's own town pages.\n\nAny home service company can do its own version, like the towns where you replaced the most water heaters this year or found the most hail damage. Link every town on it to that town's page.\n\n7. The multi-brand play\n\nRollins keeps the brands it buys under their own names. It paid about $137 million for HomeTeam in 2008, about $400 million for Clark starting in 2019, $350 million for Fox in 2023 and $207 million for Saela in 2025, and none of them became Orkin. Its CFO told investors in May that the approach \"enables multiple bites at the apple with potential customers.\"\n\nYou can see it in Denver. For \"exterminator Denver,\" Orkin came up first out of 9 results, and two Saela Pest Control profiles came up fifth and ninth. That's one parent company in 3 of the 9 spots. The Englewood Saela profile has 3,817 reviews, more than Orkin Denver's 2,236.\n\nThe home service version is a separate, real brand with its own location, like a plumbing brand alongside your HVAC brand. It isn't the same office listed twice, which Google doesn't allow.\n\n8. What I'd copy\n\n> Give every office its own profile, its own page and its own local number, and point the profile at that office's page.\n> Tag every profile link so you can see what each one sends you.\n> Build a page for every town you serve, even where you don't have an office, and name the office that serves it.\n> Put the manager's name and a same-day promise on every office page.\n> Publish real price ranges, and put them on your town and service pages too.\n> Turn your own job data into a yearly list that local news can pick up.\n> Use different phone numbers and promo codes by line of business and by page.\n\n9. Where a local company has the edge\n\n> Get more new reviews every month than the Orkin office closest to you. The median Orkin profile got 6 this month.\n> Put a real office where your customers are. Orkin has no office address in Dallas, Chicago, Seattle or Boston, and it didn't show up in any of them.\n> Use a real DBA with the service and the town in the name. 448 of Orkin's 461 profiles are named just \"Orkin.\"\n> Ask customers to mention the job and the town in their reviews. A third of Orkin's new reviews have no text.\n> Build town pages with reviews, prices, real photos and local detail. None of the 21 Orkin town pages we sampled showed a review or a price.\n> Grow your reviews on Yelp and the BBB, not just Google. Rollins' own CEO pointed out that ChatGPT doesn't use Google's reviews.\n\nOur ramp for a new Google profile targets 40 to 45 reviews a month by month four. Orkin's best profile got 32 this month...", "posted_utc": "2026-11-06T12:20:06.000Z", "posted_ct": "Nov 06, 06:20 AM CT", "likes": 6, "replies": 5, "reply": "", "angle": "AI search vs HVAC leads: what we see", "tier": "Reply now", "hot": false, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');const isQt=p.mode==='qt';
c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}${isQt?'<span class="badge" style="background:#7c3aed">QT</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
${p.angle?'<div class="angle">Angle: '+esc(p.angle)+'</div>':''}<textarea placeholder="${isQt?'Your quote take...':'Your one-liner...'}">${esc(draft)}</textarea><div class="row"><button class="primary rp">${isQt?'Quote on X':'Reply on X'}</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>{const u=isQt?('https://x.com/intent/post?url='+encodeURIComponent(p.url)+'&text='+encodeURIComponent(ta.value)):('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value));window.open(u,'_blank','noopener')};
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}

else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};

if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
