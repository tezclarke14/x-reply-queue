<script>
const POSTS=[{"handle": "DannyMagazu", "name": "Dan Magazu", "followers": 5773, "id": "2123446211973685663", "url": "https://x.com/DannyMagazu/status/2123446211973685663", "text": "The fastest company to call back usually has the best chance of getting the job.\n\nHomeowners aren't sitting around waiting for one contractor to respond.\n\nThey're reaching out to multiple companies, and whoever gets them on the phone first has the opportunity to answer their questions and book the estimate.\n\nI've seen home service businesses spend thousands on marketing only to let their leads sit in an inbox for hours.\n\nBy the time somebody finally calls, the homeowner might already have an appointment scheduled with another contractor.\n\nYou're paying to generate those leads. Don't make it easier for your competitors to close them.\n\nCall back in minutes, not hours.", "posted_utc": "2026-11-19T16:00:03.000Z", "posted_ct": "Nov 19, 10:00 AM CT", "likes": 6, "replies": 7, "reply": "", "angle": "Ohm test bed: speed-to-lead, real version", "tier": "Reply now", "hot": true, "new": true}, {"handle": "noahiglerSEO", "name": "Noah Igler", "followers": 7812, "id": "2123472388381626393", "url": "https://x.com/noahiglerSEO/status/2123472388381626393", "text": "If you're moving your marketing off Angi, HomeAdvisor and other lead aggregators, plan on 6 to 12 months to really turn it around.\n\nCutting the channels that lose money is still the right call, but the leads you own take longer to build.\n\nThis is the timeline I'd plan around:\n\n> Google Ads: about 3 months to get more profitable, once the budget moves to replacements, installs and new systems\n> A new Google profile: 3 to 12 months to ramp, as its reviews build up\n> SEO: 6 to 14 months to really get going, if you're working with a good team\n> Turning the whole thing around: 6 to 12 months\n\nWe've worked with a family-owned plumbing and HVAC company for 12 months. It does 8 figures a year in one big metro, up against bigger PE-backed competitors. Its Google Ads went from about 3.5x to 5.6x, and its two Google profiles sold $918K in under 6 months.\n\nPlan for a dip on the way. When you cut the campaigns that weren't profitable, you get fewer leads for a while. Cut the aggregators that are losing you money now, and taper the ones that are about breaking even as your own channels pick up.", "posted_utc": "2026-11-19T17:44:04.000Z", "posted_ct": "Nov 19, 11:44 AM CT", "likes": 2, "replies": 1, "reply": "", "angle": "Ohm on Angi/Thumbtack: why we're staying (for now)", "tier": "Reply now", "hot": false, "new": true}, {"handle": "sweatystartup", "name": "Nick Huber", "followers": 536121, "id": "2123479661451629003", "url": "https://x.com/sweatystartup/status/2123479661451629003", "text": "Why would you buy shares in a company where all of the employees just became millionaires?\n\nThe average Anthropic employee is worth $44 million.\n\nThey won't be worth a shit from here on out.\n\nWhy work any harder or any longer?", "posted_utc": "2026-11-19T18:12:58.000Z", "posted_ct": "Nov 19, 12:12 PM CT", "likes": 9, "replies": 4, "reply": "Can confirm the opposite also works. My startup closed and I've never worked harder.", "angle": "Big reach: closed-not-sold founder deadpan", "tier": "Reply now", "hot": true, "new": true}, {"handle": "irentdumpsters", "name": "Bodhi- Local SEO", "followers": 23727, "id": "2123473574904135908", "url": "https://x.com/irentdumpsters/status/2123473574904135908", "text": "If you own a home service company I would go look at the “Web Results” section on your Google Maps listing because Google is basically showing you which websites it associates with your business.\n\nA recent analysis looked at more than 21,000 businesses and found some really interesting stuff.\n\nYour own website showed up as a citation in 86% of listings.\n\nThat makes sense.\n\nYour website should be the strongest source connecting your business name, services, location and brand together.\n\nBut the third-party sites are where it gets interesting.\n\nFacebook showed up for 41% of businesses.\n\nThat is a huge number.\n\nA lot of home service owners treat Facebook like some dead social platform they do not need anymore.\n\nMeanwhile Google is clearly using Facebook business pages as a major third-party source when it is associating businesses across the web.\n\nSo I would make sure your Facebook page is actually cleaned up.\n\nCorrect business name\n\nCorrect phone number\n\nCorrect website\n\nCorrect city\n\nCorrect services\n\nRecent posts\n\nReal photos\n\nReviews if you have them\n\nThen there is MapQuest.\n\nMapQuest showed up for 18% of listings.\n\nNobody talks about MapQuest anymore but this is exactly why I still care about citations.\n\nYou have no idea which third-party directories Google is going to use when it is trying to verify and understand your business.\n\nI would rather have my information cleaned up everywhere than assume some old directory does not matter anymore.\n\nReddit was another interesting one.\n\nOld Reddit threads can show up inside these Web Results.\n\nEven threads that are more than a decade old.\n\nThat is great if people are talking positively about your business.\n\nIt is a completely different story if the first Reddit result Google associates with your company is somebody complaining about you from 2014.\n\nThis is why I keep saying local SEO is becoming way more than putting keywords on your website and building a few backlinks.\n\nGoogle is looking at your entire brand footprint across the internet.\n\nYour website\n\nFacebook\n\nDirectories\n\nReview platforms\n\nReddit\n\nIndustry websites\n\nLocal websites\n\nAnd whatever other sources it decides are important enough to connect to your business.\n\nIf I owned a home service company I would search the business on Google Maps and look at what Google is actually surfacing in that Web Results section.\n\nThen I would audit every single one.\n\nIs the information correct?\n\nDoes the page link to the right website?\n\nIs the branding consistent?\n\nAre the reviews good?\n\nIs there outdated information?\n\nIs there negative content ranking that you should be paying attention to?\n\nThen I would start strengthening the sources I actually want Google associating with the company.\n\nThis is why citations still matter.\n\nThis is why Facebook still matters.\n\nThis is why local PR matters.\n\nThis is why Reddit matters.\n\nAnd this is why your brand needs to exist in more places than just your website.\n\nGoogle is literally showing you some of the sources it is connecting to your business.\n\nI would probably pay attention to them.", "posted_utc": "2026-11-19T17:48:47.000Z", "posted_ct": "Nov 19, 11:48 AM CT", "likes": 4, "replies": 3, "reply": "", "angle": "Ohm's Maps listing: what Google links", "tier": "Worth a look", "hot": false, "new": true}, {"handle": "LoganARobison", "name": "Logan Robison ⚡️", "followers": 9605, "id": "2123476518730973560", "url": "https://x.com/LoganARobison/status/2123476518730973560", "text": "Instead of scrolling your feed, watch this 50-minute breakdown about how to start an Airbnb cleaning business\n\n(p.s., we've done $1.5M just cleaning up after people) https://t.co/E6wTjXwFWw", "posted_utc": "2026-11-19T18:00:29.000Z", "posted_ct": "Nov 19, 12:00 PM CT", "likes": 4, "replies": 2, "reply": "", "angle": "Garage door cert: picking a trade to start", "tier": "Worth a look", "hot": false, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');const isQt=p.mode==='qt';
c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}${isQt?'<span class="badge" style="background:#7c3aed">QT</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
${p.angle?'<div class="angle">Angle: '+esc(p.angle)+'</div>':''}<textarea placeholder="${isQt?'Your quote take...':'Your one-liner...'}">${esc(draft)}</textarea><div class="row"><button class="primary rp">${isQt?'Quote on X':'Reply on X'}</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>{const u=isQt?('https://x.com/intent/post?url='+encodeURIComponent(p.url)+'&text='+encodeURIComponent(ta.value)):('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value));window.open(u,'_blank','noopener')};
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
