<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

*{box-sizing:border-box}body{margin:0;font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:#f5f6f8;color:#14171a}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e3e6ea;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

main{max-width:680px;margin:0 auto;padding:12px}h2{font-size:13px;text-transform:uppercase;color:#536471;margin:18px 4px 8px}

a{color:#1d9bf0;text-decoration:none}

.b-new{background:#16a34a}.b-hot{background:#e8590c}.legend{font-size:13px;color:#536471;margin:4px 4px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.angle{background:#eef3ff;border-left:3px solid #1d4ed8;padding:6px 10px;border-radius:6px;margin:8px 0;font-weight:600}.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:4px}
</style></head><body>
<header><h1>X Reply Queue <span class="muted">@onhand_terry</span></h1>

<main><div class="legend"><span><span class="sw" style="border-left:5px solid #16a34a;background:#fff;border:1px solid #ccc;border-left:5px solid #16a34a"></span><span class="badge b-new">NEW</span>new account / first time in queue</span><span><span class="sw" style="background:#fff4d6;border:1px solid #f0b429"></span><span class="badge b-hot">HOT</span>top pick / highest engagement</span></div><div id="list"></div></main>
<script>
const POSTS=[{"handle": "gregisenberg", "name": "GREG ISENBERG", "followers": 771400, "id": "2126356350875709581", "url": "https://x.com/gregisenberg/status/2126356350875709581", "text": "New trend I'm observing:\n\n1. Startup raises venture capital\n2. Uses venture dollars to become creator \n3. Startup fails\n4. Fall back on becoming a full-time creator and makes $500k-$5M/year as creator\n5. Incubates other products bootstrapped\n6. Never raises VC again", "posted_utc": "2026-11-27T16:43:54.000Z", "posted_ct": "Nov 27, 10:43 AM CT", "likes": 771, "replies": 137, "reply": "", "angle": "Building on a real HVAC P&L, not VC", "tier": "Reply now", "hot": true, "new": true}, {"handle": "sweatystartup", "name": "Nick Huber", "followers": 536036, "id": "2126364177853722935", "url": "https://x.com/sweatystartup/status/2126364177853722935", "text": "This weekend go for a walk by yourself or with a friend in your local downtown area.\n\nEvery business you pass by, ask yourself these 6 questions:\n\n1) How does this business make money?\n\n2) Roughly how much money do they make per day, week and month?\n\n3) How many employees do they have and what do these employees cost the business each month?\n\n4) How much did it cost to start this business? What's the minimum amount of $ you would need to make it happen?\n\n5) How much rent do they pay for this location or how much was it to buy this building?\n\n6) How much profit might this business generate for the owner each year?\n\nObserve ALL of the companies around you.\n\nRestaurants, bars, coffee shops, retail stores, professional services, banks, hotels, movie theaters, barber shops, etc.\n\nIf they are in business in your town and they have been there for a while, they are making money and providing value.\n\nThen answer the following two questions:\n\n1) How would I run this business more efficiently if I were the owner of it?\n\n2) How would I create more revenue or reduce costs and how could I operate this business just a little bit better than the competition?\n\nIf you walk around the world with this mindset, you’ll discover an infinite amount of opportunities.\n\nYou will start to understand which businesses are good businesses (i.e profitable, easy to operate, sustainable, simple)\n\nAnd which businesses are bad businesses (i.e low margin, complex, difficult to staff, difficult to grow, etc)\n\nAnd you will learn a ton about where you want to spend your time and which opportunities you might want to pursue.\n\nGo do this and then respond to this post with what you learned or saw this weekend or next week.", "posted_utc": "2026-11-27T17:15:00.000Z", "posted_ct": "Nov 27, 11:15 AM CT", "likes": 48, "replies": 23, "reply": "", "angle": "Add question 7: could AI run it?", "tier": "Reply now", "hot": true, "new": true}, {"handle": "noahiglerSEO", "name": "Noah Igler", "followers": 7870, "id": "2126371990407692599", "url": "https://x.com/noahiglerSEO/status/2126371990407692599", "text": "Google kept switching the tracking number on a flooring company's profile back to its main office line.\n\nIts hours kept changing too, and nobody on their team was touching them.\n\nHere's why that happens, and where we look to stop it:\n\nGoogle keeps profiles up to date with information from other places, like user reports and licensed data, and those updates can go live on Maps and Search before you ever see them.\n\nFor this company, some of its other listings, like its Yelp page and a flooring brand's store locator, don't match the profile. Our read is that Google trusts those and keeps \"fixing\" the profile back.\n\nWhere we look when Google keeps changing a profile:\n\n> Every other listing. Each one should show that profile's exact name, address, hours and tracking number.\n> The website. The page the profile links to should show the same address and the same tracking number.\n> Old tools and old managers. An old listing tool, a citation service or a past agency with access can keep pushing old info back, so check who has access and remove anyone you don't recognize.\n> Edits from the public. Anyone can suggest an edit to your profile, competitors included. Google marks these updates in your profile editor, where you can accept, edit or discard them, so check it every week.\n> Google's own calls. Google sometimes calls or texts the number on your profile to confirm your details, so whoever answers needs to know your real hours.\n\nFix the profile, then fix wherever the bad info came from. If you only fix the profile, Google can switch it right back.", "posted_utc": "2026-11-27T17:46:03.000Z", "posted_ct": "Nov 27, 11:46 AM CT", "likes": 0, "replies": 0, "reply": "", "angle": "HVAC test bed: Google edits your profile too", "tier": "Reply now", "hot": false, "new": true}, {"handle": "SBA_Matthias", "name": "Matthias Smith, CEO - Pioneer Capital Advisory LLC", "followers": 37890, "id": "2126369469727739948", "url": "https://x.com/SBA_Matthias/status/2126369469727739948", "text": "Live footage of the sell-side M&amp;A broker digging your LOI out of Outlook after Thanksgiving.\n\n“Should still be an easy year-end close.” https://t.co/VAP8fpDJVN", "posted_utc": "2026-11-27T17:36:02.000Z", "posted_ct": "Nov 27, 11:36 AM CT", "likes": 1, "replies": 1, "reply": "Easy year-end close. Year TBD.", "angle": "Deadpan on post-holiday deal pace", "tier": "Reply now", "hot": false, "new": true}, {"handle": "andywalkerhq", "name": "Andy Walker", "followers": 8618, "id": "2126359407617286457", "url": "https://x.com/andywalkerhq/status/2126359407617286457", "text": "If you own a roofing company, would you rather have:\n\nA) 500 people visit your website\n\nB) 40 homeowners call asking for roof replacements\n\nI'd take the calls all day.\n\nTraffic numbers are easy to celebrate.\n\nGetting people to pick up the phone is where things get interesting.", "posted_utc": "2026-11-27T16:56:03.000Z", "posted_ct": "Nov 27, 10:56 AM CT", "likes": 6, "replies": 5, "reply": "", "angle": "Calls beat traffic, until nobody answers", "tier": "Reply now", "hot": false, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');const isQt=p.mode==='qt';
c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}${isQt?'<span class="badge" style="background:#7c3aed">QT</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
${p.angle?'<div class="angle">Angle: '+esc(p.angle)+'</div>':''}<textarea placeholder="${isQt?'Your quote take...':'Your one-liner...'}">${esc(draft)}</textarea><div class="row"><button class="primary rp">${isQt?'Quote on X':'Reply on X'}</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>{const u=isQt?('https://x.com/intent/post?url='+encodeURIComponent(p.url)+'&text='+encodeURIComponent(ta.value)):('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value));window.open(u,'_blank','noopener')};
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
