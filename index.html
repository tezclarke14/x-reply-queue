<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X Reply Queue</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:#f5f6f8;color:#14171a}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e3e6ea;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1}.pill{background:#eef3ff;color:#1d4ed8;border-radius:99px;padding:4px 10px;font-weight:600}
.bar{height:4px;background:#e3e6ea;width:100%}.bar i{display:block;height:100%;background:#1d9bf0;width:0}
button{font:inherit;border:1px solid #cfd5db;background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{background:#0f1419;color:#fff;border-color:#0f1419}
main{max-width:680px;margin:0 auto;padding:12px}h2{font-size:13px;text-transform:uppercase;color:#536471;margin:18px 4px 8px}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:12px;padding:14px;margin-bottom:12px}
.card.done{opacity:.45}.card.skip{opacity:.3}.who{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.who b{font-size:15px}.muted{color:#536471;font-size:13px}.text{white-space:pre-wrap;margin:8px 0;max-height:220px;overflow:auto}
textarea{width:100%;min-height:84px;font:inherit;border:1px solid #cfd5db;border-radius:8px;padding:8px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.cnt{margin-left:auto;font-size:13px;color:#536471}.cnt.over{color:#d00;font-weight:700}
a{color:#1d9bf0;text-decoration:none}
</style></head><body>
<header><h1>X Reply Queue <span class="muted">@onhand_terry</span></h1>
<span class="pill" id="prog"></span><span class="pill" id="timer">30:00</span>

<main id="list"></main>
<script>
const POSTS=[{"handle": "sweatystartup", "name": "Nick Huber", "followers": 528681, "id": "2112552081701601690", "url": "https://x.com/sweatystartup/status/2112552081701601690", "text": "Americans are productive AF.\n\nBut there isn't much community. \n\nNo after-work meetups at the pub. No popping over to neighbors houses unannounced. No kids playing with other kids and group dinners several nights / wk.\n\nAnd I think thats why most Americans are miserable.", "posted_utc": "2026-10-20T14:30:40.000Z", "posted_ct": "Oct 20, 09:30 AM CT", "likes": 23, "replies": 7, "reply": "The trades are one of the last places that still has this: crews eating lunch together and owners who know every customer by name. Worth protecting as we automate the back office.", "tier": "Reply now"}, {"handle": "jasonlk", "name": "Jason ✨👾SaaStr.Ai✨ Lemkin", "followers": 253638, "id": "2112553702930158045", "url": "https://x.com/jasonlk/status/2112553702930158045", "text": "#1 way to impress VCs IMHO:\n\nBe incredibly deep and strong on the competition.  Super deep. Know literally everything.\n\nAnd be extremely honest and even complimentary about their strengths, and your gaps.\n\nThe best founders always do this.", "posted_utc": "2026-10-20T14:37:06.000Z", "posted_ct": "Oct 20, 09:37 AM CT", "likes": 9, "replies": 6, "reply": "In field services the real competitor is usually a whiteboard and a dispatcher's memory. Being honest that it works pretty well is how you earn the right to replace it.", "tier": "Reply now"}, {"handle": "levelsio", "name": "@levelsio", "followers": 978744, "id": "2112544287745302743", "url": "https://x.com/levelsio/status/2112544287745302743", "text": "Today is the first time a friend living in a small town in Austria with a regular software job in a regular traditional company finally got fully AI-pilled\n\nHe's in the group chat:\n\n\"It's crazy, everything takes me only 5 seconds now\"\n\n\"This is the future guys\"\n\n\"I don't care what he does as long as he's doing the work\"\n\n\"My employer yesterday said we our CMS renews soon for a $10K/year license, so we'll cancel it and vibe code our own dashboard now lol\"\n\n\"Being a coder in 2027 will only be about taste\"\n\n\"Code is over\"\n\nObviously on X all of us have already been using AI to code for years now and I haven't read code for over a year myself, but this is the first time I hear someone working not in a startup but a regular software job in a small town in Europe starts to say this kind of stuff\n\nSo maybe a signal AI coding has really reached mainstream? I thought it already did but apparently it didn't!\n\nAttached a random location but kind of like his town (he asked to stay anon)", "posted_utc": "2026-10-20T13:59:42.000Z", "posted_ct": "Oct 20, 08:59 AM CT", "likes": 231, "replies": 31, "reply": "The next wave is the trades. Plumbers and HVAC owners lose hours a day to quoting, scheduling and callbacks, and when they get AI-pilled it changes the whole business, not just one desk job.", "tier": "Reply now"}, {"handle": "Codie_Sanchez", "name": "Codie Sanchez", "followers": 715657, "id": "2112537843541102741", "url": "https://x.com/Codie_Sanchez/status/2112537843541102741", "text": "How to be successful:\n\n- fall in love with rejection\n- be willing to look stupid for years\n- keep going way longer than anyone else", "posted_utc": "2026-10-20T13:34:05.000Z", "posted_ct": "Oct 20, 08:34 AM CT", "likes": 427, "replies": 56, "reply": "In blue-collar businesses, looking stupid means answering the phone at 9pm and learning the trade before you automate it. Founders who skip that build software nobody in the field uses.", "tier": "Reply now"}, {"handle": "levelsio", "name": "@levelsio", "followers": 978744, "id": "2112545529884193188", "url": "https://x.com/levelsio/status/2112545529884193188", "text": "AI is GREAT at investment advice\n\nAlthough watch out because everyone gets the same advice which you can use to your benefit or not \n\n(e.g. investing same what AI says works now because everyone else follows it too, but at some point that's going to be a counter signal maybe but I am not an expert)", "posted_utc": "2026-10-20T14:04:38.000Z", "posted_ct": "Oct 20, 09:04 AM CT", "likes": 61, "replies": 8, "reply": "Same thing is about to hit SaaS. The edge moves to messy real-world ops like trades, where you can't prompt your way to a crew showing up on time.", "tier": "Reply now"}, {"handle": "levelsio", "name": "@levelsio", "followers": 978744, "id": "2112549989532438898", "url": "https://x.com/levelsio/status/2112549989532438898", "text": "Okay I think it works, it's building an Alexa skill now that can play music from my own server on the Alexa Echo without Spotify or Amazon Music https://t.co/smThbT0VvH https://t.co/2sNdX662Tr", "posted_utc": "2026-10-20T14:22:21.000Z", "posted_ct": "Oct 20, 09:22 AM CT", "likes": 36, "replies": 10, "reply": "This is what's coming for small businesses: owners getting AI to build the one weird tool they need instead of paying for 6 SaaS subscriptions.", "tier": "Reply now"}, {"handle": "agazdecki", "name": "Andrew Gazdecki", "followers": 316631, "id": "2112516452582596710", "url": "https://x.com/agazdecki/status/2112516452582596710", "text": "One of the best times to sell your startup is when you have absolutely no reason to sell.\n\nBusiness is growing and customers are happy.\n\nYou're making $500K a year in profit.\n\nAnd you've got enough cash in the bank that you're not worried about next month's payroll.\n\nThat's a pretty great position to be in.\n\nNow imagine a buyer comes along and offers you $4M.\n\nYou can take the offer seriously without feeling like you need the money.\n\nYou can negotiate harder.\n\nYou can walk away if the terms suck.\n\nIf the deal falls apart, you still own a profitable business that's doing just fine.\n\nI've seen founders wait until they're burned out, growth has slowed, or they're desperate to move on before they start thinking about selling.\n\nThat's usually when negotiating gets a whole lot harder.\n\nThere's nothing wrong with testing the market while things are going great.\n\nYou might be surprised what someone is willing to pay for the business you've built.\n\nAnd if the offers aren't good enough?\n\nKeep making money lol.\n\nP.S. thinking about selling your startup? Our team will help you understand what your business is worth, prepare it for buyers, and guide you through the entire acquisition process. Meet the team here: https://t.co/6hqLR8REAe", "posted_utc": "2026-10-20T12:09:05.000Z", "posted_ct": "Oct 20, 07:09 AM CT", "likes": 22, "replies": 9, "reply": "Even more true for service businesses. Buyers pay up when it runs without the owner, so automating ops before a sale can beat another year of growth.", "tier": "Reply now"}, {"handle": "jasonlk", "name": "Jason ✨👾SaaStr.Ai✨ Lemkin", "followers": 253638, "id": "2112490509176570367", "url": "https://x.com/jasonlk/status/2112490509176570367", "text": "\"Never, ever, never hire a CRO or VP Sales that does not understand your product during the interview process.\n\nIf that can't understand what it really does, they will never be able to really sell it.\n\nDon't trust they'll figure out what you really do after they start.\n\nThey never do. They aren't curious enough.\"", "posted_utc": "2026-10-20T10:26:00.000Z", "posted_ct": "Oct 20, 05:26 AM CT", "likes": 18, "replies": 32, "reply": "Selling to contractors makes this even stricter. If your rep can't explain how the product saves a tech a truck roll, they're done within 30 seconds.", "tier": "Reply now"}, {"handle": "Austen", "name": "Austen Allred", "followers": 487362, "id": "2112360784806453689", "url": "https://x.com/Austen/status/2112360784806453689", "text": "Just used Claude for the first time in ~3 weeks.\n\nAI is a brutal space.\n\nIf you’re 1% better I’m switching 99% of my usage.", "posted_utc": "2026-10-20T01:50:31.000Z", "posted_ct": "Oct 19, 08:50 PM CT", "likes": 745, "replies": 94, "reply": "That's why the moat isn't the model, it's the workflow and the customer. A plumber doesn't care which model booked the job, only that it got booked.", "tier": "High reach (last night)"}, {"handle": "levie", "name": "Aaron Levie", "followers": 3528582, "id": "2112404676436222170", "url": "https://x.com/levie/status/2112404676436222170", "text": "The big bitter lesson question in the applied AI layer is that as models get better and better, what is the best way to diffuse that intelligence into an enterprise. \n\nIronically, I’d argue that as models are getting more capable, and can handle longer running tasks and better tool use, the ability to differentiate on a domain by domain basis goes up instead of down. \n\nWhen models were quite limited in what they could do, ironically all you could be literally was a “wrapper” because you were effectively delivering tokens back to the user with a custom prompt or some limited RAG. \n\nBut in a world of agents using tools, tasks that run on for hours or days, workflows that kick off agents, agent swarms that need to be coordinated against a goal, data sources that are domain specific, model routing that requires domain-specific routing, implementation that requires real change management of the workflow instead of “just type into this chat box”, it’s very very possible that specialization of these systems goes up more. \n\nObviously this doesn’t apply to everything - the closer you are to the labs core use-cases the tougher this play gets, but I’d argue we’re going to see autonomous systems for a wide range of job functions that weren’t practical to build out before. We’ll see this in security, life sciences, healthcare, finance, manufacturing, and many other fields. Either way going to be a fun and wild couple of years.", "posted_utc": "2026-10-20T04:44:56.000Z", "posted_ct": "Oct 19, 11:44 PM CT", "likes": 217, "replies": 114, "reply": "SMBs face the same question with less patience. A 10-person HVAC shop won't run a change program, so AI has to sit inside their phones, texts and job board.", "tier": "High reach (last night)"}, {"handle": "jasonlk", "name": "Jason ✨👾SaaStr.Ai✨ Lemkin", "followers": 253638, "id": "2112355091160170934", "url": "https://x.com/jasonlk/status/2112355091160170934", "text": "New!! 5 Learnings From Anthropic's Workforce Report\n\nJunior technical hiring fell from 27% to 9%.\n\nAgents do 6x the hours of humans. And wait on us 80% of the time.\n\nhttps://t.co/QeAWo2xGkA", "posted_utc": "2026-10-20T01:27:54.000Z", "posted_ct": "Oct 19, 08:27 PM CT", "likes": 29, "replies": 43, "reply": "The flip side is that hands-on work can't be done by agents. That's why I'm betting on pairing AI back offices with skilled trades crews.", "tier": "High reach (last night)"}, {"handle": "Codie_Sanchez", "name": "Codie Sanchez", "followers": 715657, "id": "2112378227373060297", "url": "https://x.com/Codie_Sanchez/status/2112378227373060297", "text": "Why @TheSharkDaymond turned down a billion dollars? https://t.co/PpDo8FjIeS", "posted_utc": "2026-10-20T02:59:50.000Z", "posted_ct": "Oct 19, 09:59 PM CT", "likes": 144, "replies": 13, "reply": "Boring businesses teach the same lesson: cash flow you control beats a valuation someone hands you.", "tier": "High reach (last night)"}, {"handle": "jimfarley98", "name": "Jim Farley", "followers": 5117443, "id": "2112322990327156761", "url": "https://x.com/jimfarley98/status/2112322990327156761", "text": "It was great sitting down with @ChristineRomans @NBCNews at #FordAccelerate to talk about the Essential Economy and skilled trades. Grateful to be working alongside other leaders as part of our Alliance for America’s Skilled Trades so we can tackle this problem together. \nhttps://t.co/Uj5ScIHXAk", "posted_utc": "2026-10-19T23:20:20.000Z", "posted_ct": "Oct 19, 06:20 PM CT", "likes": 17, "replies": 5, "reply": "The trades shortage is partly an admin problem. Techs spend hours on paperwork instead of jobs, and automating that is the fastest way to add capacity.", "tier": "Smaller / follow-back"}, {"handle": "skep_haaa", "name": "Duk-ezeee Dynasty!", "followers": 76, "id": "2112546270682239143", "url": "https://x.com/skep_haaa/status/2112546270682239143", "text": "I want to keep the plumbing, HVAC, electrical, tile, cabinet etc home services Private Equity multiples growing to infinity...\n\nOkhaaaay!😂 https://t.co/gtO7dotThO", "posted_utc": "2026-10-20T14:07:34.000Z", "posted_ct": "Oct 20, 09:07 AM CT", "likes": 0, "replies": 0, "reply": "Multiples only hold up if it runs without the owner, and most rolled-up shops still depend on one dispatcher's brain.", "tier": "Smaller / follow-back"}, {"handle": "SamXtrooTH", "name": "SamB | AI & AGI", "followers": 305, "id": "2112531778271686698", "url": "https://x.com/SamXtrooTH/status/2112531778271686698", "text": "Small business owners miss calls every day because they're busy doing the actual work.\n\nSo we built Hirely: AI agents that answer, text back, book, collect, and handle the paperwork.\n\nHire one in minutes. https://t.co/qirJS5FK9f", "posted_utc": "2026-10-20T13:09:59.000Z", "posted_ct": "Oct 20, 08:09 AM CT", "likes": 1, "replies": 0, "reply": "Missed calls really are the #1 leak in trades businesses. Getting owners to trust the booking is the hard part.", "tier": "Smaller / follow-back"}, {"handle": "startbuddi", "name": "startbuddi", "followers": 38, "id": "2112524413782446346", "url": "https://x.com/startbuddi/status/2112524413782446346", "text": "Most \"AI agents for small business\" are autoresponders with a new logo and a bigger monthly fee.\n\nThey reply instantly, sure. Ask one to read three months of a client's history and tell you whether that client is about to leave, and it falls apart.\n\nThe hard part of running a service business has always been knowing which client needs you today. Fast replies were solved years ago.\n\nWhich AI tool have you paid for that turned out to be a chatbot in a nice jacket?\n\n#AIautomation #SmallBusiness #startbuddi", "posted_utc": "2026-10-20T12:40:43.000Z", "posted_ct": "Oct 20, 07:40 AM CT", "likes": 1, "replies": 1, "reply": "The useful ones take actions: they reschedule the job, chase the invoice and flag the unhappy customer.", "tier": "Smaller / follow-back"}, {"handle": "RasberryJoshua", "name": "Josh", "followers": 14, "id": "2112375373153591566", "url": "https://x.com/RasberryJoshua/status/2112375373153591566", "text": "I've seen so much in the last 2 months transitioning from data &amp; AI into the data brokerage space. It is BLOWING UP. My biggest surprise was the readiness of blue collar businesses, like HVAC/roofing/refrigeration. I have more data than contacts! Any neo-labs open to chat?", "posted_utc": "2026-10-20T02:48:29.000Z", "posted_ct": "Oct 19, 09:48 PM CT", "likes": 0, "replies": 0, "reply": "Same thing I've seen. Trades owners aren't anti-tech, they're anti-wasting time.", "tier": "Smaller / follow-back"}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');c.className='card '+s;c.innerHTML=`<div class="who"><span><b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
<textarea>${esc(draft)}</textarea><div class="row"><button class="primary rp">Reply on X</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>window.open('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value),'_blank','noopener');
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
