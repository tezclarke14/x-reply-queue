<script>
const POSTS=[{"handle": "agazdecki", "name": "Andrew Gazdecki", "followers": 316661, "id": "2112678694053679488", "url": "https://x.com/agazdecki/status/2112678694053679488", "text": "There are probably 1000s of startup ideas sitting inside businesses where employees complain about the same problem every single day.", "posted_utc": "2026-10-20T22:53:46.000Z", "posted_ct": "Oct 20, 05:53 PM CT", "likes": 87, "replies": 16, "reply": "Spend a day riding along with an HVAC tech or sitting next to a dispatcher and you'll leave with ten of them. The complaints are almost always about the phone, the schedule, or chasing paperwork.", "tier": "Reply now"}, {"handle": "levie", "name": "Aaron Levie", "followers": 3528396, "id": "2112769686798832013", "url": "https://x.com/levie/status/2112769686798832013", "text": "Pretty cool that we clearly have an emerging form factor for what AI might look like for the foreseeable future as autonomous systems dedicated to specific tasks or domains.\n\nThis is a huge leap past the LLM wrapper days because the new expectation is that you can finally farm out more sophisticated work to the agent to tackle for you. And you can reliably trust that work can get accomplished properly (still with a human in the loop) because of far better tool and computer use, and the general intelligence of the models improving. \n\n1) The tool and computer use capability increases in the models mean that you can provide the agent with far more granular access to external data systems and other software to operate. This means, in effect, the agent begins to execute workflows similar to how a person would have in that same function. And where there isn’t existing software, the agent just builds it itself. This is a huge unlock. \n\n2) Next, the actual capability of the models are improving in just about every vertical domain. The models can make far better judgment calls in legal, do deeper bio research, scan for security issues in code, understand supply chain processes, and more. Obviously in many of these spaces then models still have worse intuition than people, but that will only get better.\n\n3) Finally, the harnesses and surrounding infra — sandboxes, file systems, data pipelines, etc. — allows for longer running agents, agents to be able to work on arbitrarily complex or long tasks, process data at enormous scale, and more. Few of these components worked well for AI even a year ago, but we now have many of the core primitives necessary for more autonomous systems.\n\nWhen combined with the right UX, implementation, and change management for the human oversight and coordination, it’s clear that these autonomous systems will become quite powerful in a wide variety of enterprise workflows. \n\nWe’re starting to see them in IT automation, cyber operations, drug discovery, manufacturing, AI research, and more spaces. You can almost imagine one or more of these systems for every role in the economy. Quite a bit of opportunity ahead.", "posted_utc": "2026-10-21T04:55:21.000Z", "posted_ct": "Oct 20, 11:55 PM CT", "likes": 199, "replies": 73, "reply": "This is exactly what's about to hit the trades. An agent that owns dispatch or quoting end to end, with the owner approving the edge cases, is worth more to a plumbing shop than any new app.", "tier": "Reply now"}, {"handle": "Austen", "name": "Austen Allred", "followers": 487416, "id": "2112796391756193904", "url": "https://x.com/Austen/status/2112796391756193904", "text": "A hack at the root of all PHP versions is brutal.\n\nThe website someone put up 15 years ago on a cheap host that no one remembers how to log into is now the direct target. https://t.co/N6bLkB35fA", "posted_utc": "2026-10-21T06:41:28.000Z", "posted_ct": "Oct 21, 01:41 AM CT", "likes": 209, "replies": 19, "reply": "Half the trades businesses I talk to have exactly this site. Built by somebody's nephew years ago, nobody has the login, and it's still where customers find the phone number.", "tier": "Reply now"}, {"handle": "levelsio", "name": "@levelsio", "followers": 979222, "id": "2112686345617547538", "url": "https://x.com/levelsio/status/2112686345617547538", "text": "I asked Claude Code to make a new GTA: San Andreas mission where CJ has to vibe code a startup and then raise money from investors in SF https://t.co/tuUAsBew1D", "posted_utc": "2026-10-20T23:24:11.000Z", "posted_ct": "Oct 20, 06:24 PM CT", "likes": 13302, "replies": 193, "reply": "Next mission: CJ has to get a plumber to show up on a Saturday. Hardest level in the game.", "tier": "Reply now"}, {"handle": "jasonlk", "name": "Jason ✨👾SaaStr.Ai✨ Lemkin", "followers": 253712, "id": "2112689822460719276", "url": "https://x.com/jasonlk/status/2112689822460719276", "text": "Today one of our core vendors from a leading software company went down -- the entire day.\n\n😢 Just a large \"INTERNAL ERROR\" on the screen, and API down\n\n10K our AI VP Revenue routed around it, qualified a new solution, and was using it within ... an hour\n\nEvery outage now means an agent finding a new solution.  Right then and there.", "posted_utc": "2026-10-20T23:38:00.000Z", "posted_ct": "Oct 20, 06:38 PM CT", "likes": 22, "replies": 24, "reply": "Small service businesses can't do this yet. When their field software goes down, the whole day runs off paper and group texts. That gap is a real opening for agents.", "tier": "Reply now"}, {"handle": "agazdecki", "name": "Andrew Gazdecki", "followers": 316661, "id": "2112878058952966445", "url": "https://x.com/agazdecki/status/2112878058952966445", "text": "Some founders make $1M in profit and somehow manage to take home almost nothing. Every dollar goes right back into the startup.\n\nAnother engineer.\n\nAnother marketing campaign.\n\nAnother feature nobody asked for.\n\nI get it. I've been there.\n\nWhen you're building something it's easy to convince yourself that every dollar should go toward growth.\n\nBut at some point you should probably start enjoying the financial rewards of what you've built.\n\nIf your startup makes $500K a year in profit, taking $200K off the table and reinvesting the other $300K is a perfectly reasonable decision.\n\nDo that for five years and you've taken $1M out of the business before taxes.\n\nAnd you still own the company.\n\nYou might even sell it for $3M or $4M someday.\n\nI think more founders should think about building personal wealth alongside growing their startups.\n\nBecause you can build an incredible business, sell it for millions, and still wish you'd taken a little more money off the table along the way.\n\nThere's no trophy for reinvesting every dollar you've ever made.\n\nP.S. thinking about selling your startup? Our team will help you understand what your business is worth, prepare it for buyers, and guide you through the entire acquisition process. Meet the team here: https://t.co/6hqLR8REAe", "posted_utc": "2026-10-21T12:05:59.000Z", "posted_ct": "Oct 21, 07:05 AM CT", "likes": 10, "replies": 5, "reply": "Same in the trades. Owners pour every dollar into another truck and another tech, then realize the business is their only retirement plan. Paying yourself is part of building something sellable.", "tier": "Reply now"}, {"handle": "jasonlk", "name": "Jason ✨👾SaaStr.Ai✨ Lemkin", "followers": 253712, "id": "2112730006967447962", "url": "https://x.com/jasonlk/status/2112730006967447962", "text": "Astra deleted one of core workflows for SaaStr AI Connect (coming soon) with two words of text “DO IT!” and said … “It Wasn’t Me”\n\nPretty common: https://t.co/Y0yHDXzHVP https://t.co/UMlYND902t", "posted_utc": "2026-10-21T02:17:40.000Z", "posted_ct": "Oct 20, 09:17 PM CT", "likes": 11, "replies": 23, "reply": "This is why I keep a human sign-off on anything an agent can delete or send to a customer. In ops, one bad \"DO IT\" can wipe out a week of scheduled jobs.", "tier": "Reply now"}, {"handle": "jasonlk", "name": "Jason ✨👾SaaStr.Ai✨ Lemkin", "followers": 253712, "id": "2112853400366854367", "url": "https://x.com/jasonlk/status/2112853400366854367", "text": "\"You can't hire a CRO / VP Sales ... that doesn't want to actually sell themselves anymore.\n\nIt's not just about 'process' and a 'playbook' and hiring.  That matters.\n\nBut the best sales leaders are still in deals, selling themselves.\n\nAll of them.\" https://t.co/s3z3g0rYtS", "posted_utc": "2026-10-21T10:28:00.000Z", "posted_ct": "Oct 21, 05:28 AM CT", "likes": 5, "replies": 8, "reply": "Same in home services. The best owners still go out on the big estimates themselves, even with a sales team. Customers can tell when the person quoting knows the work.", "tier": "Reply now"}, {"handle": "Austen", "name": "Austen Allred", "followers": 487416, "id": "2112870202157236489", "url": "https://x.com/Austen/status/2112870202157236489", "text": "I’m blown away at how many recruiters we *still* run into who think like this.\n\nIt wasn’t true before AI, but in a world with AI?\n\nIf you think someone with 10 years of React experience can’t ship Node I’m not sure what to tell you. https://t.co/dIsj2d3kwI", "posted_utc": "2026-10-21T11:34:46.000Z", "posted_ct": "Oct 21, 06:34 AM CT", "likes": 16, "replies": 2, "reply": "The trades have the same blind spot. A good tech picks up new software fast, but job posts still filter for years on one exact tool. AI makes that filter even dumber.", "tier": "Reply now"}, {"handle": "Codie_Sanchez", "name": "Codie Sanchez", "followers": 715747, "id": "2112566325843214564", "url": "https://x.com/Codie_Sanchez/status/2112566325843214564", "text": "Me looking at the seller as he says \"the business basically runs itself” https://t.co/76bW0r4P0G", "posted_utc": "2026-10-20T15:27:16.000Z", "posted_ct": "Oct 20, 10:27 AM CT", "likes": 160, "replies": 56, "reply": "Translation in the trades: it runs itself because the owner answers every call at 9pm and keeps the pricing in his head. First diligence question is always who picks up the phone.", "tier": "Worth a reply"}, {"handle": "Codie_Sanchez", "name": "Codie Sanchez", "followers": 715747, "id": "2112611630060106152", "url": "https://x.com/Codie_Sanchez/status/2112611630060106152", "text": "Do the work. Show the work. Teach the work. Sell the system.\n\nSecret to winning.", "posted_utc": "2026-10-20T18:27:17.000Z", "posted_ct": "Oct 20, 01:27 PM CT", "likes": 1685, "replies": 111, "reply": "That's the playbook for trades businesses too. Learn the job on site, write down how it actually gets done, then automate the system. Skip step one and the software never sticks.", "tier": "Worth a reply"}, {"handle": "SMB_RealEstate", "name": "Ryan Murray - SMB CRE Operator", "followers": 735, "id": "2112637692181897696", "url": "https://x.com/SMB_RealEstate/status/2112637692181897696", "text": "If you own a home service business (or looking to buy one) that installs anything, here's a question: How much money are you (or the target company) losing sending crews back to jobs you've already completed?\n\nIn Q3, we scheduled 513 installation jobs and recorded 61 \"go-backs.\" That's an 11.9% go-back rate. An inporvment over Q2 (15.4%), but our goal is under 8% (and frankly, I'd like to get it much lower than that).\n\nI've posted about this problem a couple of times before, but we've since started tracking it in a lot more detail. We're finally getting a better picture of what's actually causing these return trips.\n\nFor context, we manufacture, sell, and install plantation shutters and shades. A go-back might mean returning to adjust a product, repair something, replace a damaged component, or occasionally remake an entire shutter or shade.\n\nEach one costs us labor, drive time, production capacity, and sometimes materials. It also means asking a customer to rearrange their schedule because we didn't get something right the first time.\n\nWe reviewed 60 repair tickets from July 27 through October 19 and categorized each by department and root cause.\n\n31 (52%) originated in measuring/sales.\n\nAnother 8 involved roller shade manufacturing, 8 involved suppliers or outsourced products, and 4 involved errors on our production cut sheets.\n\nOnly 4 (7%) were classified as installation errors, which we originally thought was the main problem!\n\nWe also found that 5 customers required multiple return visits. Those 5 jobs accounted for 11 of the 60 repair tickets. That means at least THREE trips to the same customer's house, including the original installation.\n\nPreviously, we primarily tracked our go-back rate by installation crew. That was useful for measuring how often we were returning to jobs, but it didn't tell us enough about WHY.\n\nNow we're recording each issue in a Google Sheet with the responsible department, root cause, and details about what went wrong.\n\nWe've connected that data to Claude, which generates the dashboard, using the new dashboards-artifacts feature (super awesome) shown in the attached screenshots. It gives us an executive view of go-back rates, trends, root causes, and repeat visits.\n\nWe're using it in our leadership meetings and with individual departments to identify recurring problems and decide what needs to change.\n\nFor example, if half our issues originate in measuring or order entry, spending more time coaching installers isn't going to solve the problem.\n\nWe need to look at how measurements are taken, how products are quoted and entered, what gets checked before production, and where mistakes are slipping through.\n\nLikewise, if something was measured and entered correctly but manufactured incorrectly, that's an entirely different problem with a different person and process responsible for fixing it.\n\nWe're trying to move from simply tracking mistakes to identifying the cause, assigning responsibility for correcting the underlying process, and then measuring whether the changes actually reduce go-backs.\n\nBuilding a dashboard is atracking data is the easy part now with AI. Getting people to change established habits, consistently follow the processes, and hold each other accountable is where you still add value as an operator and leader.\n\nWe haven't solved this yet. Our last four weeks averaged 12.8%, so we're actually moving in the wrong direction relative to our 8% goal.\n\nAt least now we have a much better understanding of where to focus our efforts.\n\nCurious how other home service operators handle this. Do you track return trips or rework by root cause? What's your go-back rate? I can't find an industry benchmark for this so would lvee to know!", "posted_utc": "2026-10-20T20:10:51.000Z", "posted_ct": "Oct 20, 03:10 PM CT", "likes": 8, "replies": 2, "reply": "Love that you traced it back. Most of your go-backs starting at measuring and sales tracks with what I see: the field captures bad data and the install crew takes the blame.", "tier": "Worth a reply"}, {"handle": "jasonlk", "name": "Jason ✨👾SaaStr.Ai✨ Lemkin", "followers": 253712, "id": "2112614828284264737", "url": "https://x.com/jasonlk/status/2112614828284264737", "text": "\"Agents will pick your next software vendors.\n\nThis is not the same as 'GEO' and 'AEO'.  That mattered a lot the past 12-18 months.  What a human using ChatGPT would get recommended.\n\nBut agents make very different recommendations that humans asking ChatGPT or Claude.\" https://t.co/LxKYY0qF6C https://t.co/lakH8R6Ooh", "posted_utc": "2026-10-20T18:40:00.000Z", "posted_ct": "Oct 20, 01:40 PM CT", "likes": 31, "replies": 25, "reply": "This is going to change how trades owners buy software. Most never sit through a demo, they ask a buddy. Soon they'll ask an agent, and it won't care who runs the best ads.", "tier": "Worth a reply"}, {"handle": "Austen", "name": "Austen Allred", "followers": 487416, "id": "2112636398826291426", "url": "https://x.com/Austen/status/2112636398826291426", "text": "Conversation I just had:\n\n\"I have an enterprise C++ codebase that was deprecated in the mid 2000s, I'm trying to determine what it's worth.\"\n\n\"Wow, how many pull requests are in the codebase?\"\n\n\"...Zero, Git didn't exist yet.\"\n\nOh yeah", "posted_utc": "2026-10-20T20:05:43.000Z", "posted_ct": "Oct 20, 03:05 PM CT", "likes": 908, "replies": 31, "reply": "The trades version is a 20-year-old Access database holding an HVAC company's entire customer history. Zero commits, still the most valuable asset in the business.", "tier": "Worth a reply"}, {"handle": "typesfast", "name": "Ryan Petersen", "followers": 755456, "id": "2112561980364197972", "url": "https://x.com/typesfast/status/2112561980364197972", "text": "AI to classify products for customs compliance is a great use case but 1) requires lots of post training with real world compliance data and 2) by law requires a human in the loop to use the classifications for U.S. Customs.  \n\nFlexport offers both with our new AI Classification engine: After you use our AI to classify a product, we created a built-in workflow to send the classification to a licensed customs broker to review and sign off (or suggest a change).  \n\nUse the new AI classification engine here: https://t.co/LZdpTw9Hht", "posted_utc": "2026-10-20T15:10:00.000Z", "posted_ct": "Oct 20, 10:10 AM CT", "likes": 85, "replies": 8, "reply": "AI drafts, licensed pro signs off is the right model for regulated work. Same pattern fits the trades: AI preps the quote or permit packet, a licensed tech approves it.", "tier": "Worth a reply"}, {"handle": "mashadrokova", "name": "Masha Bucher", "followers": 34931, "id": "2112636072983396789", "url": "https://x.com/mashadrokova/status/2112636072983396789", "text": "When you ask small business owners what they spend all their time on it’s usually just “random stuff”\n\nAffiniti is perfectly positioned to deploy AI agents to help with the half of a business owner’s day that is just “random stuff”. It’s going to be absolutely gigantic. https://t.co/lL6Bht5D76", "posted_utc": "2026-10-20T20:04:25.000Z", "posted_ct": "Oct 20, 03:04 PM CT", "likes": 10, "replies": 4, "reply": "In the trades the \"random stuff\" is chasing invoices, rescheduling jobs, and calling back leads from the truck. It eats an owner's evenings and it's the easiest place for agents to start.", "tier": "Worth a reply"}, {"handle": "cleanwithmike", "name": "Mike Cleans", "followers": 82006, "id": "2112559739259240611", "url": "https://x.com/cleanwithmike/status/2112559739259240611", "text": "7 businesses that will never be “cool,” but will always have customers:\n\n1. House cleaning\n2. Pest control\n3. HVAC\n4. Plumbing\n5. Landscaping\n6. Junk removal\n7. Commercial cleaning\n\nEveryone wants to build the next billion-dollar app.\n\nNobody wants to own the business that gets paid like clockwork.", "posted_utc": "2026-10-20T15:01:05.000Z", "posted_ct": "Oct 20, 10:01 AM CT", "likes": 8, "replies": 4, "reply": "And all seven run on the same boring stuff: answering the phone fast, showing up on time, and following up. Nail that with real systems and you can win your whole market.", "tier": "New account: just added"}, {"handle": "WilsonCompanies", "name": "John Wilson", "followers": 39136, "id": "2112539998985552244", "url": "https://x.com/WilsonCompanies/status/2112539998985552244", "text": "How long does it take to build a home service business?\n\nThere’s no universal timeline. Your progress depends on how well you:\n\n/Generate leads\n/Price jobs for profit\n/Manage cash flow\n/Hire the right people\n\nGet those fundamentals right before chasing scale.", "posted_utc": "2026-10-20T13:42:39.000Z", "posted_ct": "Oct 20, 08:42 AM CT", "likes": 22, "replies": 15, "reply": "Cash flow is the one that sneaks up on people. Plenty of busy trades shops are profitable on paper and broke on Friday because invoices go out late. Fix billing before adding a truck.", "tier": "New account: just added"}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');c.className='card '+s;c.innerHTML=`<div class="who"><span><b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
<textarea>${esc(draft)}</textarea><div class="row"><button class="primary rp">Reply on X</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>window.open('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value),'_blank','noopener');
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
