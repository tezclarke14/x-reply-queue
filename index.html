.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.cnt{margin-left:auto;font-size:13px;color:#536471}.cnt.over{color:#d00;font-weight:700}
a{color:#1d9bf0;text-decoration:none}

.b-new{background:#16a34a}.b-hot{background:#e8590c}.legend{font-size:13px;color:#536471;margin:4px 4px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.angle{background:#eef3ff;border-left:3px solid #1d4ed8;padding:6px 10px;border-radius:6px;margin:8px 0;font-weight:600}.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:4px}
</style></head><body>
<header><h1>X Reply Queue <span class="muted">@onhand_terry</span></h1>
<span class="pill" id="prog"></span><span class="pill" id="timer">30:00</span>
<a class="pill" href="scorecard.html" style="text-decoration:none">📊 Scorecard</a><a class="pill" href="plan.html" style="text-decoration:none">🗓️ Plan</a><a class="pill" href="investors.html" style="text-decoration:none">💼 Investors</a><button id="tbtn">Start</button><button id="treset">Reset</button></header><div class="bar"><i id="pbar"></i></div>
<main><div class="legend"><span><span class="sw" style="border-left:5px solid #16a34a;background:#fff;border:1px solid #ccc;border-left:5px solid #16a34a"></span><span class="badge b-new">NEW</span>new account / first time in queue</span><span><span class="sw" style="background:#fff4d6;border:1px solid #f0b429"></span><span class="badge b-hot">HOT</span>top pick / highest engagement</span></div><div id="list"></div></main>
<script>
const POSTS=[{"handle": "noahiglerSEO", "name": "Noah Igler", "followers": 7796, "id": "2123029966644216115", "url": "https://x.com/noahiglerSEO/status/2123029966644216115", "text": "I used to be an AI search doubter.\n\nAI was clearly where search was headed, but I didn't think it was sending home service companies real calls yet.\n\nNow I think it's bringing in a good share of your calls... but almost nobody can track them.\n\nSearch \"best roofer in [your city]\" or \"best plumber near me\" and look at the top of the page. For a lot of these searches, Google's AI Overview now sits above the map pack, and it pushes the organic results even further down.\n\nA roofing owner we work with told me two homeowners called him this summer straight from an AI answer. Someone on my team pointed out what a lot of homeowners do instead: grab a few names from the AI answer, then look those companies up on Maps and read the reviews.\n\nTracking it is the hard part:\n\n> There's no tracking number for an AI Overview, and no UTM tag on the click.\n> Search Console shows how many times your site appears in AI Overviews and AI Mode, but not the clicks. Those stay mixed in with your regular search numbers.\n> ChatGPT's new Business Hub shows clicks from ChatGPT to your site, which is more than Google gives you for its own AI answers.\n\nWhether you call it AEO, GEO or what I call it, search everywhere optimization, it deserves real budget now.\n\nThe good news is that a lot of what ranks you in the map pack helps you show up in AI Overviews too, and the multi-location playbook is as strong as ever.\n\nIf someone in Plano or Allen searches for the best roofer and your only Google profile has a Dallas address, you're going to have a hard time showing up. Real offices with their own profiles across the metro give you a shot in each of those towns, on the map and in the AI answer above it.", "posted_utc": "2026-11-18T12:26:02.000Z", "posted_ct": "Nov 18, 06:26 AM CT", "likes": 4, "replies": 4, "reply": "", "angle": "HVAC test bed: tracking AI-sourced calls", "tier": "Reply now", "hot": true, "new": true}, {"handle": "agazdecki", "name": "Andrew Gazdecki", "followers": 317994, "id": "2123036955680358668", "url": "https://x.com/agazdecki/status/2123036955680358668", "text": "A $2M acquisition offer hits a little differently when you almost went bankrupt three years earlier. \n\nImagine you're building a SaaS company.\n\nYou've got $8K left in the bank.\n\nPayroll is due Friday and your biggest customer just canceled.\n\nYou're sitting there wondering if you should just shut the whole thing down and get a normal job.\n\nPretty much every founder has had some version of this moment lol.\n\nBut you somehow figure it out.\n\nYou land a few new customers and revenue starts growing.\n\nYou finally have enough money to hire someone and stop doing absolutely everything yourself.\n\nThree years later, the business is making $250K a year in profit.\n\nAnd someone offers you $2M to buy it.\n\nThink about that for a second.\n\nYou went from wondering how you were going to pay your employees to having someone offer you millions of dollars for the company.\n\nThat's gotta be one of the coolest feelings in entrepreneurship.\n\nAnd I think it's something people outside of startups don't always understand.\n\nThey see the acquisition announcement.\n\nThey see the purchase price.\n\nThey don't see the years you spent refreshing your bank account, getting rejected by customers, or wondering if you were wasting your life.\n\nBuilding a startup is really damn hard.\n\nWhich is why I think even the smaller acquisitions deserve a lot more recognition.\n\nYou have no idea what someone went through to get there.\n\nAnd turning something that almost failed into a $2M exit?\n\nThat's a hell of an accomplishment.\n\nP.S. thinking about selling your startup? Our team will help you understand what your business is worth, prepare it for buyers, and guide you through the entire acquisition process. Meet the team here: https://t.co/6hqLR8REAe", "posted_utc": "2026-11-18T12:53:49.000Z", "posted_ct": "Nov 18, 06:53 AM CT", "likes": 9, "replies": 7, "reply": "", "angle": "Big reach: your own near-broke founder moment", "tier": "Reply now", "hot": true, "new": true}, {"handle": "DannyMagazu", "name": "Dan Magazu", "followers": 5767, "id": "2123039246948913203", "url": "https://x.com/DannyMagazu/status/2123039246948913203", "text": "Here’s something home service businesses should test if they aren't already doing it:\n\nInstead of quoting somebody one price, give them three options:\n\n• Good: The basic job done right.\n• Better: The option you'd recommend for their project.\n• Best: The job with additional upgrades or everything they originally wanted included.\n\nFor example: you're quoting a deck replacement.\n\nThe homeowner might be expecting a standard deck, but when they see what it costs to upgrade the materials or add a few features, they might be happy to spend more.\n\nAnd if they aren't interested, they can still go with the original option.\n\nThe point is to give people a choice instead of assuming you know exactly how much they're willing to spend.\n\nYou might be leaving a pretty significant amount of money on the table by only offering one option.\n\nI'd be testing this if I were selling expensive home improvement projects.", "posted_utc": "2026-11-18T13:02:55.000Z", "posted_ct": "Nov 18, 07:02 AM CT", "likes": 0, "replies": 1, "reply": "", "angle": "Garage door cert: tiered quotes at the door", "tier": "Worth a look", "hot": false, "new": true}, {"handle": "_toddanderson", "name": "Todd Anderson - SEO for the Trades", "followers": 7609, "id": "2123039495771525596", "url": "https://x.com/_toddanderson/status/2123039495771525596", "text": "\"I didn't even put a website. I just asked GPT.\" \n\nThat's what our home service client told us a customer told them last week after they closed a $10k project. \n\nGive this prompt to Claude to get the same result for your home service company: \n\n1 - \"Claude, create 10 customer avatar profiles based on our CRM data, sales call recordings, and customer pain points.\" \n\nUpload all your call recordings from your SDR team and give it a list of the pain points your ICP often encounters. \n\nMake sure you include your area, as there are a lot of variants and consumer habits depending on where you're at. \n\nThis is going to give you essentially 10 personas that Claude can pretend to be. \n\n2 - Run each of those 10 separate customers in 10 separate chats, explaining the ICP to the AI and asking who it would recommend based on their profile. \n\nWhat we're looking for is a pattern of who Claude is recommending broadly across your market. \n\n3 - Diagnose. \n\nLook at who Claude recommended and try and pick out the pattern.\n- Were the top companies littered with social proof?\n- Did they have more blogs?\n- What kind of copy did they have on the page?\n- Was their website set up a certain way?\n- Were they exact-match domains?\n- Did the AI pick them because they were a legacy business? \n- Was it because they had multiple locations? \n- Was it because they had copy talking about a large crew they had? \n- Was it because they have neighborhood pages built out close to where the person had reached out from?\n\n4 - Apply. \n\nTake what you learned from step 3 and apply it to your own website. \n\nHave Claude scrape through the outputs and optimize your online presence for it. \n\n5 - Wait, and measure in 4 weeks. \n\nEnsure you have attribution tracking in place with GA4 across the website and monitor your profile in ChatGPT and GSC to watch for AI mentions. \n\nAsk your SDR team to inquire about where the lead came from and measure how many are coming from AI. \n\nBonus - Repeat this process on a timer. \n\nYou can even set up a monthly job with Claude to go run through your site and run the competitor test scan against either the same 10 profiles or 10 new profiles to see who's ranking in AI. \n\nNote on this though..... The system is not perfect, and there's still going to be a thumbprint on each Claude account, even if you hydrate it with a certain demographic profile. \n\nStill, this can get you pretty close, and it will help your understanding of how an AI ranks a business in your area.", "posted_utc": "2026-11-18T13:03:54.000Z", "posted_ct": "Nov 18, 07:03 AM CT", "likes": 0, "replies": 1, "reply": "", "angle": "HVAC test bed: asking callers where they heard", "tier": "Worth a look", "hot": false, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');const isQt=p.mode==='qt';
c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}${isQt?'<span class="badge" style="background:#7c3aed">QT</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
${p.angle?'<div class="angle">Angle: '+esc(p.angle)+'</div>':''}<textarea placeholder="${isQt?'Your quote take...':'Your one-liner...'}">${esc(draft)}</textarea><div class="row"><button class="primary rp">${isQt?'Quote on X':'Reply on X'}</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>{const u=isQt?('https://x.com/intent/post?url='+encodeURIComponent(p.url)+'&text='+encodeURIComponent(ta.value)):('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value));window.open(u,'_blank','noopener')};
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
