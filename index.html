<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X Reply Queue</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:#f5f6f8;color:#14171a}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e3e6ea;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1}.pill{background:#eef3ff;color:#1d4ed8;border-radius:99px;padding:4px 10px;font-weight:600}
.bar{height:4px;background:#e3e6ea;width:100%}.bar i{display:block;height:100%;background:#1d9bf0;width:0}
button{font:inherit;border:1px solid #cfd5db;background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{background:#0f1419;color:#fff;border-color:#0f1419}
main{max-width:680px;margin:0 auto;padding:12px}h2{font-size:13px;text-transform:uppercase;color:#536471;margin:18px 4px 8px}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:12px;padding:14px;margin-bottom:12px}
.card.done{opacity:.45}.card.skip{opacity:.3}.who{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.who b{font-size:15px}.muted{color:#536471;font-size:13px}.text{white-space:pre-wrap;margin:8px 0;max-height:220px;overflow:auto}
textarea{width:100%;min-height:84px;font:inherit;border:1px solid #cfd5db;border-radius:8px;padding:8px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.cnt{margin-left:auto;font-size:13px;color:#536471}.cnt.over{color:#d00;font-weight:700}
a{color:#1d9bf0;text-decoration:none}
.card.new{border-left:5px solid #16a34a}.card.hot{background:#fff4d6;border-color:#f0b429}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:4px;color:#fff;vertical-align:middle}
.b-new{background:#16a34a}.b-hot{background:#e8590c}.legend{font-size:13px;color:#536471;margin:4px 4px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.angle{background:#eef3ff;border-left:3px solid #1d4ed8;padding:6px 10px;border-radius:6px;margin:8px 0;font-weight:600}.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:4px}
</style></head><body>
<header><h1>X Reply Queue <span class="muted">@onhand_terry</span></h1>
<span class="pill" id="prog"></span><span class="pill" id="timer">30:00</span>
<a class="pill" href="scorecard.html" style="text-decoration:none">📊 Scorecard</a><a class="pill" href="plan.html" style="text-decoration:none">🗓️ Plan</a><a class="pill" href="investors.html" style="text-decoration:none">💼 Investors</a><button id="tbtn">Start</button><button id="treset">Reset</button></header><div class="bar"><i id="pbar"></i></div>
<main><div class="legend"><span><span class="sw" style="border-left:5px solid #16a34a;background:#fff;border:1px solid #ccc;border-left:5px solid #16a34a"></span><span class="badge b-new">NEW</span>new account / first time in queue</span><span><span class="sw" style="background:#fff4d6;border:1px solid #f0b429"></span><span class="badge b-hot">HOT</span>top pick / highest engagement</span></div><div id="list"></div></main>
<script>
const POSTS=[{"handle": "levelsio", "name": "@levelsio", "followers": 981964, "id": "2114316321311650149", "url": "https://x.com/levelsio/status/2114316321311650149", "text": "Finally learnt how to make 🍿 popcorn in a pan\n\nI wanted to stop using those microwave popcorn bags\n\nMicrowave popcorn bags used to have a PFAS bag lining but that got banned in EU and US, but they're still not great. They use cheap palm oil (highly saturated fat) and synthetic butter flavoring (2,3-pentanedione a chemical twin of diacetyl that was used before and banned)\n\n1) put a kinda tall pan, like a sauce pan, on medium to high heat (I use 12/14 on electric stove)\n2) then make the pan very hot first like the sides have to feel hot too\n3) then spray the pan inside with extra virgin olive oil (maybe you can use butter too? I will try next time)\n4) then cover the pan with corn, it shouldn't stack, just level\n5) keep pan open and wait until one corn pops\n6) once it pops, put the lid fully on and start moving it back and forth kinda shaking, so the corns don't burn\n7) then it takes about same as microwave popcorn, like 3-4mins, then once it stops popping every few seconds stop it\n8) then add salt and put in a bowl\n\nThat gets you healthy popcorn with just olive oil and salt!\n\nI'm not sure about adding salt before or after btw, I'll try, one problem adding it after is you sometimes breathe in the salt when eating cause it doesn't stick so well to the popcorn", "posted_utc": "2026-10-25T11:21:07.000Z", "posted_ct": "Oct 25, 06:21 AM CT", "likes": 107, "replies": 34, "reply": "Step 9: ship it as a $29/month app.", "angle": "982k followers, 16k views in an hour. Pure deadpan", "tier": "Large tech: reply now", "hot": true, "new": true}, {"handle": "agazdecki", "name": "Andrew Gazdecki", "followers": 316829, "id": "2114325073150738848", "url": "https://x.com/agazdecki/status/2114325073150738848", "text": "Every founder should know what their startup is worth, even if they have zero plans to sell. \n\nImagine you're running a SaaS doing $1.5M in ARR and $500K in profit.\n\nBusiness is good and you're paying yourself well.\n\nThen one random Tuesday, someone emails you offering $3M to buy the company.\n\nSounds pretty exciting!\n\nBut is $3M a great offer or should you counter at $5M?\n\nWould another buyer pay $6M?\n\nIs $3M actually more than the business is worth?\n\nYou'd be surprised how many founders have absolutely no idea.\n\nAnd I totally get it.\n\nWhen you're busy building a startup, thinking about selling it probably isn't at the top of your list.\n\nBut understanding what buyers value can also help you build a better business.\n\nMaybe your margins need work.\n\nMaybe too much revenue comes from one customer.\n\nMaybe the entire company falls apart if you take a two-week vacation.\n\nThese are things worth fixing whether you sell next month or ten years from now.\n\nSpend a little time understanding what your startup could sell for.\n\nYou might be sitting on a much more valuable asset than you realize.\n\nP.S. thinking about selling your startup? Our team will help you understand what your business is worth, prepare it for buyers, and guide you through the entire acquisition process. Meet the team here: https://t.co/6hqLR8REAe", "posted_utc": "2026-10-25T11:55:54.000Z", "posted_ct": "Oct 25, 06:55 AM CT", "likes": 9, "replies": 6, "reply": "Most trades businesses fail the two-week vacation test on day two.", "angle": "Two-week vacation test vs trades owners", "tier": "Large tech: reply now", "hot": true, "new": true}, {"handle": "noahiglerSEO", "name": "Noah Igler", "followers": 7502, "id": "2114317051531595962", "url": "https://x.com/noahiglerSEO/status/2114317051531595962", "text": "All 5 of the biggest home service companies we work with are adding a second trade and a second market at the same time.\n\nTheir main Google profile was built for one trade in one area.\n\nThis is how we're setting each one up, and why Google makes it hard:\n\n> HVAC company pushing into plumbing (sewer lines, water lines, re-pipes) and a new suburb\n> Plumber adding furnaces and heat pumps while it grows into the metro next door\n> HVAC company adding plumbing and a second location\n> Roofer building out retail replacement next to its insurance work, plus showrooms in a new state\n> Plumbing shop going after drains, excavation and water treatment on the other side of town\n\nGoogle makes both hard. A profile's main category tells Google what it does best, and the map pack favors whoever is closest to the person searching. An HVAC profile 20 minutes away struggles to show up for \"plumber near me,\" even after you add plumbing to it.\n\nThe setup:\n\n> A separate Google profile with a DBA focused on the new trade, at a real location where your best jobs in that trade already come from\n> Service pages for the new trade with real job photos, linked from the city pages where you'll run that work\n> Review asks that mention the new service, so the new profile builds proof in that trade\n> Google Ads on the big tickets in the new trade (sewer lines, re-pipes, new systems) while the organic side catches up\n\nOne HVAC company we work with opened a satellite office with its own profile. It returned about 10x its cost in its first 6 months.", "posted_utc": "2026-10-25T11:24:01.000Z", "posted_ct": "Oct 25, 06:24 AM CT", "likes": 3, "replies": 3, "reply": "", "angle": "Second trade means a second phone line to answer", "tier": "Reply soon", "hot": false, "new": true}, {"handle": "_toddanderson", "name": "Todd Anderson - SEO for the Trades", "followers": 7515, "id": "2114311321067852259", "url": "https://x.com/_toddanderson/status/2114311321067852259", "text": "For any other entrepreneurs starting out early on in their journey, you've got to avoid shiny object syndrome at all costs. \n\nThis is coming from a guy who made the mistake this last year. \n\nWe hit record revenue months hiring SEOs for other marketing companies, and the work was fun, and the cash was great. \n\nThe problem was my attention was split between two different businesses. \n\nEventually, growth on both sides started stalling. \n\nSome advice I can confidently stand behind for anyone else starting out is just to stay consistent and focused. \n\nAnd honestly, it's a really simple concept, but it's really hard to stick to in practice.", "posted_utc": "2026-10-25T11:01:15.000Z", "posted_ct": "Oct 25, 06:01 AM CT", "likes": 1, "replies": 0, "reply": "Says everyone running two businesses at once. Asking for a friend.", "angle": "Self-own: HVAC company plus AI startup", "tier": "Reply soon", "hot": false, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
${p.angle?'<div class="angle">Angle: '+esc(p.angle)+'</div>':''}<textarea placeholder="Your one-liner...">${esc(draft)}</textarea><div class="row"><button class="primary rp">Reply on X</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>window.open('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value),'_blank','noopener');
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
