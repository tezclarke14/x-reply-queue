.b-new{background:#16a34a}.b-hot{background:#e8590c}.legend{font-size:13px;color:#536471;margin:4px 4px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}

<script>
const POSTS=[{"handle": "mhp_guy", "name": "Chris Koerner", "followers": 191244, "id": "2122393181589512546", "url": "https://x.com/mhp_guy/status/2122393181589512546", "text": "It costs $60K+ to pressure wash a parking garage.\n\nBack in 2024 I talked to a guy charging that and owners didn't bat an eye. Better yet, he subbed out all the work at 50% margins!\n\nHere are the details:\n\nThe area: Cali \n(thats what people in California call it right?)\n\nThe garage: 8 story near the airport\n\nThe model: Cold call parking garage owners with the pitch that regular maintenance (sweep and wash) is way cheaper than repairs or replacement.\n\nUsually with home services you have to pick 1 of 2:\n\nHigh ticket\nRecurring\n\nWith this you get both.\n\nThe guy in question, @brandonadixon (great follow), spent 10 years in the MLB, retired, and bought a street sweeping business.\n\n(Safe to say it was the right decision.)\n\nIt was doing about $20K/month when he bought it, $30K/month a few months later when we first spoke, and $60K/month by the time of this job.\n\nThat 1 job was set to double his revenue again.\n\nAnd unlike his $500 sweeping jobs, he didn't have to buy a $75K truck or do the work himself.\n\nHe was my first caller ever on episode 001 and came back for episode 011. And he actually implemented my advice!\n\nJust don't compete with him anywhere in Cali, cause he'll crush you.\n\nIf you've got questions for Brandon, drop them below and he'll answer.", "posted_utc": "2026-11-16T18:15:41.000Z", "posted_ct": "Nov 16, 12:15 PM CT", "likes": 14, "replies": 1, "reply": "", "angle": "Subbed-out model, AI runs the middle", "tier": "Reply now", "hot": true, "new": true}, {"handle": "sweatystartup", "name": "Nick Huber", "followers": 536138, "id": "2122373990698094860", "url": "https://x.com/sweatystartup/status/2122373990698094860", "text": "This guy has been my Philippines operation manager for 4.5 years. \n\nMarried a Filipino and has 3 kids.\n\nBest hire we’ve ever made. \n\nHis parents are pissed they never see him. https://t.co/MNn1UtVfcl", "posted_utc": "2026-11-16T16:59:25.000Z", "posted_ct": "Nov 16, 10:59 AM CT", "likes": 36, "replies": 8, "reply": "Best hire you've ever made, and the one his parents would fire.", "angle": "Offshore ops vs AI-run back office", "tier": "Reply now", "hot": true, "new": true}, {"handle": "Codie_Sanchez", "name": "Codie Sanchez", "followers": 716827, "id": "2122374909032534273", "url": "https://x.com/Codie_Sanchez/status/2122374909032534273", "text": "Hire winners, they'll likely keep winning.\n\nBefriend givers, they make giving a habit.\n\nAvoid talkers, they mistake words for actions.", "posted_utc": "2026-11-16T17:03:04.000Z", "posted_ct": "Nov 16, 11:03 AM CT", "likes": 309, "replies": 29, "reply": "", "angle": "Big reach: agents don't talk, they act", "tier": "Reply now", "hot": false, "new": true}, {"handle": "noahiglerSEO", "name": "Noah Igler", "followers": 7778, "id": "2122385976542613956", "url": "https://x.com/noahiglerSEO/status/2122385976542613956", "text": "I ranked the lead sources a $10M home service company spends money on, by what each one is worth after year one.\n\nThat's a different list than you get from cost per lead in month one.\n\nTop tier gets the most money, and F is where I'd stop:\n\nS TIER\n> Real offices with their own Google profiles across your metro. Each one helps you rank in the map pack and in Google's AI Overviews around that office, and your cost per customer drops the longer they run. An HVAC company we work with got about 10x its cost back from its second office in the first 6 months.\n> Past customers, memberships and referrals. They're the cheapest jobs you'll ever book, and referrals show up already trusting you.\n\nA TIER\n> Google Ads on replacements, installs and new systems, with every sold job tracked back to the click\n> LSA, once your reviews are strong\n\nB TIER\n> Organic website pages: service pages, city pages and real price ranges. They're slow to build, but they keep working.\n> Meta. People see you, then search your name later, so it lifts your Google numbers too.\n> Referral partnerships with other businesses, like realtors, builders and other construction companies. Their customers already need your trade, and a warm intro closes better than a cold lead.\n\nC TIER\n> Radio, TV, streaming and billboards. These work best for bigger companies that already have a brand or want to build one, and they can be great as long as you're OK without an immediate return. Watch your branded searches to see if they're working.\n> Truck wraps and yard signs. They pay off when your Google profile wins the search that comes after.\n> Door-to-door. It can work in roofing and pest control, and it works better once people already know your name.\n\nD TIER\n> Google Ads on repair and service calls, unless your techs turn a lot of them into replacements. We work with an HVAC company that closes 80 to 90% of its no-heat calls into new furnaces, so repair works for them.\n> Postcards on your main phone number. A pest control company we work with mailed 6,000 in August and got 12 QR scans, and it can't tell how many calls they drove.\n\nF TIER\n> Buying shared leads from Angi, HomeAdvisor or Thumbtack. They can fill the job board, but it's very hard to get outsized returns from them. The same homeowner can go to several companies, and nothing builds up when you stop paying. Keep your profiles on those sites for reviews and AI answers.", "posted_utc": "2026-11-16T17:47:03.000Z", "posted_ct": "Nov 16, 11:47 AM CT", "likes": 1, "replies": 0, "reply": "", "angle": "HVAC test bed: which leads actually close", "tier": "Worth a look", "hot": false, "new": true}, {"handle": "andywalkerhq", "name": "Andy Walker", "followers": 8260, "id": "2122373896351396323", "url": "https://x.com/andywalkerhq/status/2122373896351396323", "text": "If I had a plumbing company…\n\nHere’s how I'd structure my day if I wanted to break past $3M/yr:\n\n6-7: Review yesterday's numbers\n7-8: Meet with the team\n8-10: Sales + estimates\n10-12: Hiring + training\n12-2: Fix bottlenecks\n2-4: Build systems\n\nI'd protect the first 4 hours like my life depended on it.", "posted_utc": "2026-11-16T16:59:03.000Z", "posted_ct": "Nov 16, 10:59 AM CT", "likes": 2, "replies": 0, "reply": "12-2 fix bottlenecks, 2-4 build the systems that cause them.", "angle": "Which blocks the AI already took", "tier": "Worth a look", "hot": false, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');const isQt=p.mode==='qt';
c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}${isQt?'<span class="badge" style="background:#7c3aed">QT</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
${p.angle?'<div class="angle">Angle: '+esc(p.angle)+'</div>':''}<textarea placeholder="${isQt?'Your quote take...':'Your one-liner...'}">${esc(draft)}</textarea><div class="row"><button class="primary rp">${isQt?'Quote on X':'Reply on X'}</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>{const u=isQt?('https://x.com/intent/post?url='+encodeURIComponent(p.url)+'&text='+encodeURIComponent(ta.value)):('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value));window.open(u,'_blank','noopener')};
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
