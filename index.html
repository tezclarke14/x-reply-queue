a{color:#1d9bf0;text-decoration:none}

<script>
const POSTS=[{"handle": "agazdecki", "name": "Andrew Gazdecki", "followers": 316777, "id": "2113968592773362100", "url": "https://x.com/agazdecki/status/2113968592773362100", "text": "After 16 years building his company, Vincent Serpico decided it was time to sell and the business was doing better than ever.\n\nPretty interesting timing right?\n\nVincent built Founders Workshop, a software development company that helped founders launch over 300 applications.\n\nBut after 16 years, he wanted to spend more time working on AI.\n\nSo he did something I wish more founders would think about.\n\nHe spent 6–12 months getting the business ready to operate without him.\n\nDocumented processes and improved operations.\n\nAutomated what he could.\n\nGot everything organized for a buyer.\n\nThen he listed the company on @acquiredotcom and worked with our M&A team.\n\nThe acquisition took about a year to close but here's the cool part.\n\nAfter selling, Vincent stayed available for 90 days.\n\nThe buyer barely needed him.\n\nThat's how you know you've built something someone else can actually take over.\n\nAnd what did Vincent do after selling?\n\nBought himself a custom AI workstation and got back to building cool stuff.\n\nCongrats Vincent and the Founders Workshop team.\n\nLove seeing founders build something great, sell it, and get excited about what's next.\n\nCheck out the full podcast interview here: https://t.co/h3PKAn43Yn", "posted_utc": "2026-10-24T12:19:22.000Z", "posted_ct": "Oct 24, 07:19 AM CT", "likes": 6, "replies": 0, "reply": "Build it, sell it, buy a GPU. The 2026 founder lifecycle.", "angle": "Founder exit: built to run without you", "tier": "Founders: reply now", "hot": true, "new": true}, {"handle": "guilleflorvs", "name": "Guillermo Flor", "followers": 12381, "id": "2113948625013178718", "url": "https://x.com/guilleflorvs/status/2113948625013178718", "text": "Andreessen's framework for why Elon is essentially unbeatable:\n\nYou have to go back to the late 1800s and early 1900s — Ford, Carnegie — to find founders who operated this way.\n\nCarnegie didn't just build steel. He owned the iron ore mines, the railroads, the coke ovens. By 1900 he controlled ~25% of US steel output. Ford didn't just build cars — he owned rubber plantations, glass factories, and 16 million acres of timberland by the 1920s.\n\nThe pattern Andreessen identifies is the same one playing out now: a single leader who simultaneously runs multiple capital-intensive industries, where each company becomes infrastructure for the next.\n\nTesla needs batteries → Elon builds the battery supply chain. SpaceX needs avionics → Elon builds the avionics. X needs satellite internet → Starlink already exists.\n\nMost conglomerates are financial portfolios. This is vertical integration at civilizational scale.\n\nThe reason quarterly-driven rivals can't respond: they'd have to spin up entire industries from scratch to match capabilities Elon has been compounding for 20 years.\n\nCarnegie's advantage took decades and the Sherman Antitrust Act to slow down. The historical parallel isn't flattering to competitors.", "posted_utc": "2026-10-24T11:00:02.000Z", "posted_ct": "Oct 24, 06:00 AM CT", "likes": 3, "replies": 0, "reply": "Carnegie owned the mines. Our version is an HVAC company in Texas.", "angle": "AI rollups: own the operation, not just software", "tier": "Investors: reply now", "hot": false, "new": true}, {"handle": "noahiglerSEO", "name": "Noah Igler", "followers": 7499, "id": "2113956431258873988", "url": "https://x.com/noahiglerSEO/status/2113956431258873988", "text": "Servpro has 114 open Google Business Profiles across the New York City metro area.\n\nFrom Sept 18 to Oct 18, those 114 profiles got 71 new Google reviews combined, and 75 of them got none.\n\nHere's what they get right, and where a $10M restoration company can beat them:\n\nBlackstone bought into Servpro in 2019. The 114 profiles break down to 27 in the five boroughs, 29 on Long Island, 11 in Westchester, Rockland and Putnam, and 47 on the New Jersey side. Almost every one is named \"SERVPRO of [area],\" and most send people to their own location page on https://t.co/NQL3eWuwmR.\n\nWhat they get right:\n\n> 114 profiles spread from Long Island to the Jersey Shore, so they're close to a lot of searchers\n> 89% of their new reviews got an owner reply, with a median reply time under a day\n> The reviews they did get averaged 4.8 stars\n\nWhere it's thin:\n\n> 71 reviews across 114 profiles is about 0.6 per profile for the whole month\n> Their busiest profile got 7, and only 2 profiles got 5 or more\n> The typical profile has 40 reviews total. 66 have fewer than 50, and 5 have none at all.\n> None of the names include the service. \"SERVPRO of [area]\" doesn't match a search for \"water damage restoration near me.\"\n> 9 profiles sit under a 4.5 rating\n\nHow a $10M restoration company takes the zip codes they cover weakly:\n\n> Get to 10 new reviews a month. That alone would have beaten every Servpro profile in the metro last month.\n> Put a DBA with \"water damage restoration\" in the name on your next profile.\n> Place that profile where your best jobs already come from, then look up the closest Servpro. Odds are it got no new reviews last month.\n> Answer the phone 24/7. Water jobs go to whoever picks up first.\n> Build a page on your own site for every town that profile covers, with real job photos from those towns.", "posted_utc": "2026-10-24T11:31:03.000Z", "posted_ct": "Oct 24, 06:31 AM CT", "likes": 5, "replies": 1, "reply": "114 locations and 75 of them are in witness protection.", "angle": "PE rollup scale vs. review follow-up", "tier": "Founders: reply now", "hot": false, "new": true}, {"handle": "_toddanderson", "name": "Todd Anderson - SEO for the Trades", "followers": 7500, "id": "2113951138944860645", "url": "https://x.com/_toddanderson/status/2113951138944860645", "text": "In about 70% of our discovery calls, SEO is not the fix home service business owners need.\n\nHere's what I check before I'd accept your money: \n\n1. Reviews\n\nSometimes in the markets we audit, the competition is too steep to beat with SEO alone. \n\nIf you're in a tier 1 market going up against legacy competition with thousands of reviews, you're going to need more than one 5-star review a week. \n\nFor a simple check, just go take the top three competitors that are beating you in the map pack and see if you can achieve or beat their review velocity. \n\n2. Close rate from the sales team\n\nMore calls from SEO are going to be worthless if you don't have a team that can close them. \n\nGo into your CRM and count how many calls turned into sold jobs from your sales team. \n\nOftentimes, if this isn't at least 20%+ on average, SEO is just going to be sending you more calls to lose. \n\n3. Runway \n\nYes, even in 2026, with all of our AI tools, SEO takes time, and ROI only begins to show up at months 6 to 8. \n\nTake the retainer for SEO and multiply it by a healthy 8.5, just for good measure. \n\nIf you can't carry that number without it paying you back anytime soon, then you're not ready for SEO yet.\n\n4. The service you're targeting\n\n If you're trying to target a niche service while ranking for a broad term like \"plumber near me,\" the SEO campaign is going to miss, and you're far better off just running PPC.\n\nI always tell people that SEO is like casting a net into a pond, whereas PPC is fishing with a pole with specific bait for a specific fish. \n\nSEO pulls in everything. PPC can snipe certain jobs. \n\nOnly when all four of these are in place does SEO work really, really well. When they aren't, I just tell prospects that they're just not ready and to come back when those four are dialed in.", "posted_utc": "2026-10-24T11:10:01.000Z", "posted_ct": "Oct 24, 06:10 AM CT", "likes": 0, "replies": 0, "reply": "More calls into a voicemail is just expensive voicemail.", "angle": "HVAC test bed: more calls vs. answered calls", "tier": "Founders: reply now", "hot": false, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
${p.angle?'<div class="angle">Angle: '+esc(p.angle)+'</div>':''}<textarea placeholder="Your one-liner...">${esc(draft)}</textarea><div class="row"><button class="primary rp">Reply on X</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>window.open('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value),'_blank','noopener');
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
