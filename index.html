<script>
const POSTS=[{"handle": "_toddanderson", "name": "Todd Anderson - SEO for the Trades", "followers": 7529, "id": "2117236575733965126", "url": "https://x.com/_toddanderson/status/2117236575733965126", "text": "I walked with a $4.3 million electrical company last week whose owner was proud of the 300 website pages he had written with the help of Claude for his SEO. \n\nNone of his pages were indexed by Google, none were ranking, and he has no booked work to show for his efforts. \n\nWith the advent of AI, it's just too easy to write massive amounts of content online right now, and a lot of business owners are falling prey to it. \n\nHere's how we roll these out for our clients. \n\n- If they don't have the basic service and their top 5 location pages built already, we build those week 1. \n- After that, we start rolling out systematic location pages across the metro they want to rank in. Usually anywhere from 5 to 7 a month. \n- We watch these closely and ensure the pages we write are getting indexed by Google consistently before we start writing more. \n\nThis strategy will continue until we've mapped out most of the metro they want to rank in, with city and neighborhood-type pages. \n\nIf you're building out your location pages yourself, open up Google Search Console and ensure that your pages are getting indexed before you write more.", "posted_utc": "2026-11-02T12:45:10.000Z", "posted_ct": "Nov 02, 06:45 AM CT", "likes": 3, "replies": 0, "reply": "300 pages, 0 indexed. Claude really nailed the brief.", "angle": "Texas HVAC test bed: AI pages vs booked jobs", "tier": "Reply now", "hot": true, "new": true}, {"handle": "noahiglerSEO", "name": "Noah Igler", "followers": 7564, "id": "2117230749384372405", "url": "https://x.com/noahiglerSEO/status/2117230749384372405", "text": "This is Google's new AI agent for your Google Business Profile.\n\nIt answers customer questions, offers open appointment times and sends a link to book.\n\nHere's how it works, and what I'd set up before you turn it on:\n\nCustomers tap Message on your profile in Google Search or Maps, and the chat opens in the regular texting app on their phone. The agent answers from what's on your profile and sends the harder questions to you.\n\nOn your end, every conversation shows up inside your Business Profile, split into \"Needs your attention\" and \"Handled by your AI agent.\" You can take over any chat whenever you want.\n\nTwo catches:\n\n> It's still a pilot. Google calls it early access at no cost, and not every business has it yet.\n> The AI only works when the customer's phone and carrier support RCS. Everyone else's message goes to your business phone as a regular text.\n\nGoogle is in this race on both sides of the call now. Since July 2025, its AI can call local businesses for searchers to check prices and availability. Now it's offering to answer for you too, and the same messaging tool has a Promote tab that ties into Google Ads.\n\nMy read is that Google wants the first conversation between a homeowner and your company to happen inside Google.\n\nWhat I'd set up first:\n\n> Fix what it reads first. Add every service you run with a real description, and make sure your hours and the towns you cover are right, because it can only answer as well as your profile does.\n> Turn on the handoff alert, and decide who on your team owns the chats it can't answer. A chat that sits for an hour is a job someone else can book.\n> Point the booking link on your profile at your real booking tool, with tracking tags, so you can see what these chats book.\n> If your profile shows a tracking line or a landline, find out where those regular texts end up.\n> Test it from your own phone. Ask what a homeowner would: can someone come out today, do you install tankless water heaters, what does a new AC cost.", "posted_utc": "2026-11-02T12:22:01.000Z", "posted_ct": "Nov 02, 06:22 AM CT", "likes": 7, "replies": 5, "reply": "", "angle": "What your HVAC GBP agent would mis-book", "tier": "Reply now", "hot": false, "new": true}, {"handle": "guilleflorvs", "name": "Guillermo Flor", "followers": 12935, "id": "2117229721691750748", "url": "https://x.com/guilleflorvs/status/2117229721691750748", "text": "Mark Cuban's take on the next job wave deserves more attention than it's getting.\n\nHis argument: software as we know it is dying. Generic SaaS gets replaced by AI customized to how each business actually operates.\n\nThe question then becomes, who builds and deploys that for the 33 million companies in the US that can't do it themselves?\n\nThat's the market. Not AI for enterprises with 500-person eng teams. The other 99%.\n\nSMBs don't have CTOs. They don't have prompt engineers. They need someone to sit across the table, understand their workflow, and wire up an AI system that fits it.\n\nThat's a services business. Probably the largest one this decade.\n\nWe broke this down step by step in Product Market Fit: https://t.co/a6d1HT1c7r", "posted_utc": "2026-11-02T12:17:56.000Z", "posted_ct": "Nov 02, 06:17 AM CT", "likes": 4, "replies": 3, "reply": "", "angle": "Building AI-run trades shops, not SaaS", "tier": "Reply now", "hot": false, "new": true}, {"handle": "agazdecki", "name": "Andrew Gazdecki", "followers": 317262, "id": "2117240646562099292", "url": "https://x.com/agazdecki/status/2117240646562099292", "text": "Your first $10K in MRR is one of the hardest milestones you'll ever hit as a founder. \n\nGetting 100 strangers to pay you $100 a month for something you built is pretty incredible.\n\nEspecially when you remember how it started.\n\nYou probably spent months building the product.\n\nLaunched to absolutely nobody.\n\nSent 100s of cold emails.\n\nGot ignored by 99% of them.\n\nHad customers tell you your product sucked.\n\nAnd at some point you probably wondered if anyone was ever going to pay for the damn thing lol.\n\nThen you get your first customer.\n\nThen 10 and then 50.\n\nEventually your waking up to $10K in recurring revenue every month.\n\nThat's $120K ARR.\n\nYou've figured out how to build something people actually want and convince them to pay for it.\n\nAnd now you've got a foundation to build on.\n\nI think founders sometimes get so caught up comparing themselves to startups doing $10M or $100M in revenue that they forget how difficult those first few customers really are.\n\nIf you're working toward your first $10K MRR, keep going.\n\nAnd if you've already hit it, take a minute to appreciate what you've built.\n\nIt's a pretty damn big deal.\n\nP.S. thinking about selling your startup? Our team will help you understand what your business is worth, prepare it for buyers, and guide you through the entire acquisition process. Meet the team here: https://t.co/6hqLR8REAe", "posted_utc": "2026-11-02T13:01:21.000Z", "posted_ct": "Nov 02, 07:01 AM CT", "likes": 11, "replies": 5, "reply": "", "angle": "YC alum: first paying customers story", "tier": "Reply now", "hot": true, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');const isQt=p.mode==='qt';
c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}${isQt?'<span class="badge" style="background:#7c3aed">QT</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
${p.angle?'<div class="angle">Angle: '+esc(p.angle)+'</div>':''}<textarea placeholder="${isQt?'Your quote take...':'Your one-liner...'}">${esc(draft)}</textarea><div class="row"><button class="primary rp">${isQt?'Quote on X':'Reply on X'}</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>{const u=isQt?('https://x.com/intent/post?url='+encodeURIComponent(p.url)+'&text='+encodeURIComponent(ta.value)):('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value));window.open(u,'_blank','noopener')};
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
