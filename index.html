<script>
const POSTS=[{"handle": "SMB_Attorney", "name": "SMB Attorney", "followers": 160744, "id": "2121651943235784763", "url": "https://x.com/SMB_Attorney/status/2121651943235784763", "text": "Nothing gets business owners more fired up than implying AI will make running a business passive.\n\nIt’s the same conversation as implying it will replace lawyers.\n\nIf you think businesses will be passive or lawyers will be irrelevant, then Im sorry but you don’t know what we even do lol", "posted_utc": "2026-11-14T17:10:16.000Z", "posted_ct": "Nov 14, 11:10 AM CT", "likes": 39, "replies": 12, "reply": "", "angle": "HVAC test bed: AI isn't passive ownership", "tier": "Reply now", "hot": true, "new": true}, {"handle": "PaulKlayVC", "name": "Paul Klay", "followers": 4476, "id": "2121664514131190205", "url": "https://x.com/PaulKlayVC/status/2121664514131190205", "text": "the best way to become great at sales and build a network of ideal customers is to become one of them yourself.\n\ni have a framework for doing this without spending years on it, while still building your product.\n\nthe idea is simple: if you're building a product for influencers, become an influencer yourself. this helps you understand their problems firsthand and build relationships with exactly the people you want to sell to. most importantly, they'll see you as one of them rather than someone trying to sell them something. that puts you in a much stronger position when it comes to sales.\n\nhere's how to do it faster:\n\n1. find someone who's already where you want to be.\n\nstarting from scratch takes time, and there's no guarantee of success. instead, find someone who's already part of your target audience, has relevant experience, and knows the right people. the goal is to build a close working relationship with them.\n\n2. become their assistant or bring them on as an advisor.\n\nthe right approach depends on your ideal customer.\n\nlet's say you're building a product for CMOs at companies doing $1B+ in revenue. building a billion-dollar company just to understand those customers obviously isn't realistic. neither is landing a CMO role at one overnight. but becoming an assistant to one of those CMOs is much more achievable.\n\nif the target audience is more accessible, like influencers, there's another approach. start building an account and bring a successful influencer on as an advisor to help it grow.\n\n3. give them a reason to work with you.\n\nthe simplest answer is money.\n\nif you're becoming someone's assistant: don't ask for a salary. you could even offer to pay them for the opportunity. this removes the risk of hiring someone who might waste their time. once you're in, focus on being genuinely useful. gradually take on more responsibility, learn how they work, and build relationships with people in their network.\n\nif you're working with an advisor: pay them, but also offer a share of the results they help achieve. for example, let's say an influencer is helping grow an account. the goal is to understand the market and build connections with other influencers, so advertising revenue isn't really a priority. offering the advisor almost all the advertising revenue the account generates could be a good deal. this gives them a strong incentive to help the account grow while providing valuable experience, an audience, and the right connections.\n\nthat's the whole idea. becoming part of a market doesn't have to take years.\n\nrelatively small investment can provide access to experience and connections that took someone else decades to build.\n\nall while continuing to build a startup.", "posted_utc": "2026-11-14T18:00:13.000Z", "posted_ct": "Nov 14, 12:00 PM CT", "likes": 14, "replies": 2, "reply": "Skipped the assistant step and got an HVAC company.", "angle": "Became the customer: owning an HVAC company", "tier": "Reply now", "hot": false, "new": true}, {"handle": "kwharrison13", "name": "Kyle Harrison", "followers": 28714, "id": "2121649611055960441", "url": "https://x.com/kwharrison13/status/2121649611055960441", "text": "Waymo co-CEO Dmitri Dolgov on demos versus products:\n\n“By demo standards... autonomous driving was solved in 2010.”\n\n“So, the demo took 18 months, the product took about 15 years.” https://t.co/gIMh20aiJd", "posted_utc": "2026-11-14T17:01:00.000Z", "posted_ct": "Nov 14, 11:01 AM CT", "likes": 2, "replies": 3, "reply": "", "angle": "AI in live ops: demo vs real phones", "tier": "Reply now", "hot": false, "new": true}, {"handle": "irentdumpsters", "name": "Bodhi- Local SEO", "followers": 23641, "id": "2121659217396301917", "url": "https://x.com/irentdumpsters/status/2121659217396301917", "text": "If you own a home service company and want a really saucy way to build local backlinks I would seriously consider starting a local business podcast.\n\nInterview business owners in your market.\n\nPlumbers\n\nRoofers\n\nLandscapers\n\nElectricians\n\nHVAC companies\n\nRemodelers\n\nPool companies\n\nReal estate people\n\nBasically anyone who serves the same homeowners without directly competing with you.\n\nThen turn every interview into an actual piece of content.\n\nPut the episode on your website.\n\nPut it on YouTube.\n\nCut clips for social.\n\nWrite a page about the guest and their company.\n\nLink to their business naturally from the episode page.\n\nThen give them the episode, clips and write-up so they have a reason to feature it on their own website and link back to you.\n\nNow you are not cold emailing random websites begging for links.\n\nYou are creating something useful with another local business and both sides actually have a reason to mention each other.\n\nDo 50 of these and you can build a ridiculous amount of local relevance while your competitors are still buying the same shitty directory links everyone else has.\n\nYou also get content, relationships, referrals, brand awareness and YouTube distribution out of the exact same strategy.\n\nThat is the kind of local SEO play I love because one piece of work can compound across a bunch of different channels.", "posted_utc": "2026-11-14T17:39:10.000Z", "posted_ct": "Nov 14, 11:39 AM CT", "likes": 13, "replies": 3, "reply": "", "angle": "Trades cross-referral content for local SEO", "tier": "Worth a look", "hot": false, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');const isQt=p.mode==='qt';
c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}${isQt?'<span class="badge" style="background:#7c3aed">QT</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
${p.angle?'<div class="angle">Angle: '+esc(p.angle)+'</div>':''}<textarea placeholder="${isQt?'Your quote take...':'Your one-liner...'}">${esc(draft)}</textarea><div class="row"><button class="primary rp">${isQt?'Quote on X':'Reply on X'}</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>{const u=isQt?('https://x.com/intent/post?url='+encodeURIComponent(p.url)+'&text='+encodeURIComponent(ta.value)):('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value));window.open(u,'_blank','noopener')};
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
