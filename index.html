<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X Reply Queue</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:#f5f6f8;color:#14171a}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e3e6ea;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1}.pill{background:#eef3ff;color:#1d4ed8;border-radius:99px;padding:4px 10px;font-weight:600}
.bar{height:4px;background:#e3e6ea;width:100%}.bar i{display:block;height:100%;background:#1d9bf0;width:0}
button{font:inherit;border:1px solid #cfd5db;background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{background:#0f1419;color:#fff;border-color:#0f1419}
main{max-width:680px;margin:0 auto;padding:12px}h2{font-size:13px;text-transform:uppercase;color:#536471;margin:18px 4px 8px}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:12px;padding:14px;margin-bottom:12px}
.card.done{opacity:.45}.card.skip{opacity:.3}.who{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.who b{font-size:15px}.muted{color:#536471;font-size:13px}.text{white-space:pre-wrap;margin:8px 0;max-height:220px;overflow:auto}
textarea{width:100%;min-height:84px;font:inherit;border:1px solid #cfd5db;border-radius:8px;padding:8px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.cnt{margin-left:auto;font-size:13px;color:#536471}.cnt.over{color:#d00;font-weight:700}
a{color:#1d9bf0;text-decoration:none}
.card.new{border-left:5px solid #16a34a}.card.hot{background:#fff4d6;border-color:#f0b429}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:4px;color:#fff;vertical-align:middle}
.b-new{background:#16a34a}.b-hot{background:#e8590c}.legend{font-size:13px;color:#536471;margin:4px 4px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:4px}
</style></head><body>
<header><h1>X Reply Queue <span class="muted">@onhand_terry</span></h1>
<span class="pill" id="prog"></span><span class="pill" id="timer">30:00</span>
<button id="tbtn">Start</button><button id="treset">Reset</button></header><div class="bar"><i id="pbar"></i></div>
<main><div class="legend"><span><span class="sw" style="border-left:5px solid #16a34a;background:#fff;border:1px solid #ccc;border-left:5px solid #16a34a"></span><span class="badge b-new">NEW</span>new account / first time in queue</span><span><span class="sw" style="background:#fff4d6;border:1px solid #f0b429"></span><span class="badge b-hot">HOT</span>top pick / highest engagement</span></div><div id="list"></div></main>
<script>
const POSTS=[{"handle": "cleanwithmike", "name": "Mike Cleans", "followers": 82086, "id": "2112889409422979271", "url": "https://x.com/cleanwithmike/status/2112889409422979271", "text": "Things you should've done in 2021:\n\n• Learn AI \n• Invest in stocks\n• Lock in a 3% mortgage\n\nThings you should do in 2027:", "posted_utc": "2026-10-21T12:51:05.000Z", "posted_ct": "Oct 21, 07:51 AM CT", "likes": 380, "replies": 19, "reply": "Buy a boring service business and put AI on the phones. In 2021 the edge was learning AI. In 2027 it's pointing it at a trade where the phone still rings out after 5pm.", "tier": "Reply now", "hot": true, "new": false}, {"handle": "sweatystartup", "name": "Nick Huber", "followers": 528759, "id": "2112940222510252104", "url": "https://x.com/sweatystartup/status/2112940222510252104", "text": "Six months into any business you're doing the same thing every other business is doing i.e hiring, training, managing, firing, marketing, sales, and problem solving. \n\nIf you're still providing the service yourself six months in, all you've built is a job for yourself.", "posted_utc": "2026-10-21T16:13:00.000Z", "posted_ct": "Oct 21, 11:13 AM CT", "likes": 98, "replies": 49, "reply": "In trades the trap is sneakier. The owner stops turning wrenches and starts answering every call instead. Still a job, just one with more interruptions.", "tier": "Reply now", "hot": true, "new": false}, {"handle": "levelsio", "name": "@levelsio", "followers": 979949, "id": "2113024336097591766", "url": "https://x.com/levelsio/status/2113024336097591766", "text": "Some people say this will be the end of PHP \n\nI don't think so because these AI-assisted vulnerability exploits will now increasingly happen to any language, any framework, any server software etc.\n\nI mean Node patched a high security vulnerability this week too\n\nA new era of infinite cat and mouse games between people assisted by super intelligent AI trying to hack every single app, site and server and on the other side companies trying to defend themselves from it also assisted by AI\n\nA new era of cybersecurity has begun", "posted_utc": "2026-10-21T21:47:14.000Z", "posted_ct": "Oct 21, 04:47 PM CT", "likes": 669, "replies": 49, "reply": "The scariest PHP sites aren't at tech companies. They're the plumber's WordPress site a nephew built years ago that nobody has the login to. AI attackers don't need a big target, just a forgotten one.", "tier": "Reply now", "hot": true, "new": false}, {"handle": "gregisenberg", "name": "GREG ISENBERG", "followers": 748545, "id": "2113044829957459984", "url": "https://x.com/gregisenberg/status/2113044829957459984", "text": "I think we’ll see a lot more of this. \n\nThe attackers were going after the AI keys stored on Railway, because an API key is basically a credit card for compute now. \n\nEvery company running agents is sitting on a pile of these keys!\n\nhere’s the 10 minute fix. rotate every key tonight, set a hard monthly spend limit in each AI dashboard, give every agent its own key, and turn on usage alerts so you know the second something spikes.\n\nsomeone should build the tool that finds every AI key a company has, rotates them every week and pings you when spend looks weird. charge $99 a month. every startup running agents needs it yesterday.", "posted_utc": "2026-10-21T23:08:40.000Z", "posted_ct": "Oct 21, 06:08 PM CT", "likes": 653, "replies": 171, "reply": "Small businesses have it worse: the key lives in an automation someone's cousin set up and nobody remembers. Spend limits should be the default, not the 10-minute fix.", "tier": "Reply now", "hot": true, "new": false}, {"handle": "gregisenberg", "name": "GREG ISENBERG", "followers": 748545, "id": "2113006714354024672", "url": "https://x.com/gregisenberg/status/2113006714354024672", "text": "I think AI agents are going to go through 9 stages before every business accepts them.\n\nRight now we’re at stage 1, where big companies like Amazon, Delta etc are blocking them.\n\nHere are the next 8 stages and the startup ideas I’d build. https://t.co/Fu8a2vjBNL https://t.co/3Ob9xuSvdm", "posted_utc": "2026-10-21T20:37:13.000Z", "posted_ct": "Oct 21, 03:37 PM CT", "likes": 254, "replies": 87, "reply": "The trades might skip a few of these stages. A homeowner with a dead AC doesn't care who booked the job, only that someone picked up.", "tier": "Reply now", "hot": false, "new": false}, {"handle": "jasonlk", "name": "Jason ✨👾SaaStr.Ai✨ Lemkin", "followers": 253779, "id": "2113024527961878864", "url": "https://x.com/jasonlk/status/2113024527961878864", "text": "\"Claudeforce is an order of magnitude better to use than native Saleforce UI/UX itself.\n\nIt's exciting, but also a clear sign of the death of UI/UX.\n\nYour agents don't need one.\n\nAnd you can build a better 'headless' one for you and your team in minutes.\" https://t.co/PVa43WnMXC https://t.co/lakH8R6Ooh", "posted_utc": "2026-10-21T21:48:00.000Z", "posted_ct": "Oct 21, 04:48 PM CT", "likes": 28, "replies": 19, "reply": "Field service software is next. A tech in an attic doesn't want another screen, he wants to say \"job done, two capacitors, bill it\" and walk to the truck.", "tier": "Reply now", "hot": false, "new": false}, {"handle": "sweatystartup", "name": "Nick Huber", "followers": 528759, "id": "2113061532212883834", "url": "https://x.com/sweatystartup/status/2113061532212883834", "text": "Business is funny.\n\nYou can pour 50 hours a week into one business and 10 into another and the one you are putting less time into grows like crazy with no stress.\n\nAnd 6 months later it is the other way around!", "posted_utc": "2026-10-22T00:15:02.000Z", "posted_ct": "Oct 21, 07:15 PM CT", "likes": 124, "replies": 28, "reply": "The 10-hour business grows because you can't touch it enough to break it. Less time forces systems. More time turns the owner into the bottleneck.", "tier": "Reply now", "hot": false, "new": false}, {"handle": "agazdecki", "name": "Andrew Gazdecki", "followers": 316674, "id": "2113243358609191222", "url": "https://x.com/agazdecki/status/2113243358609191222", "text": "Turning down a $6M offer for your startup is basically making a $6M bet on yourself... and that's a pretty big bet.\n\nImagine you've spent 5 years building a SaaS company.\n\nIt's doing $1M a year in profit.\n\nBusiness is growing 20% a year.\n\nThen someone offers you $6M to buy the whole thing.\n\nYou think you can double the business over the next three years and sell it for $12M.\n\nMaybe you can.\n\nBut here's something I'd ask myself.\n\nIf someone wired you $6M today, would you turn around and spend all of it buying your own startup?\n\nBecause that's essentially the decision you're making.\n\nI love founders who believe in what they're building.\n\nI've turned down acquisition offers myself.\n\nBut there's a difference between believing your company can be worth $12M someday and having someone willing to pay you $6M for it today.\n\nBoth are pretty incredible outcomes.\n\nAnd sometimes taking the money, celebrating the win, and going after your next idea is a perfectly good decision.\n\nP.S. thinking about selling your startup? Our team will help you understand what your business is worth, prepare it for buyers, and guide you through the entire acquisition process. Meet the team here: https://t.co/6hqLR8REAe", "posted_utc": "2026-10-22T12:17:33.000Z", "posted_ct": "Oct 22, 07:17 AM CT", "likes": 11, "replies": 3, "reply": "Best test in here: would you spend $6M buying your own company today? Most founders say yes instantly. Far fewer would for a stranger's company with the same numbers.", "tier": "Reply now", "hot": false, "new": false}, {"handle": "cleanwithmike", "name": "Mike Cleans", "followers": 82086, "id": "2112922118354506025", "url": "https://x.com/cleanwithmike/status/2112922118354506025", "text": "Unpopular opinion:\n\nA guy making $120k running a boring cleaning business with 30+ hours of free time every week is wealthier than a banker making $300k who can't take a Tuesday off.", "posted_utc": "2026-10-21T15:01:03.000Z", "posted_ct": "Oct 21, 10:01 AM CT", "likes": 13, "replies": 5, "reply": "The Tuesday is the real salary. The trap in trades is hitting $300k and still having every call ring your cell.", "tier": "Reply now", "hot": false, "new": false}, {"handle": "levie", "name": "Aaron Levie", "followers": 3528422, "id": "2113137032633757773", "url": "https://x.com/levie/status/2113137032633757773", "text": "If you wanted to know all the jobs that AI will produce, look no further than cybersecurity. This is going to become one of the biggest investment areas for enterprises going forward. \n\nAnd even as the work becomes more agentic and autonomous you will need more talent to point the agents at the most critical work, review findings, patch systems, respond to incidents, and more. \n\nLots of opportunity right now for the systems that protect data and enterprises, as well as the professionals that are deploying them and protecting organizations.\n\nIt’s going to only get more wild out there.", "posted_utc": "2026-10-22T05:15:03.000Z", "posted_ct": "Oct 22, 12:15 AM CT", "likes": 467, "replies": 70, "reply": "Same pattern in the trades. AI doesn't remove the tech, it removes the dead time around the tech, and someone still has to know which alert actually matters.", "tier": "Reply now", "hot": false, "new": false}, {"handle": "andywalkerhq", "name": "Andy Walker - SMB Marketing", "followers": 8001, "id": "2112937721043755128", "url": "https://x.com/andywalkerhq/status/2112937721043755128", "text": "A missed call feels like nothing. \n\nYou tell yourself: One in a day, who cares.\n \nMiss two bookable calls a week at an $8k ticket and that's $800k a year walking to the guy who picked up.\n \nSmall leaks sink big businesses.", "posted_utc": "2026-10-21T16:03:03.000Z", "posted_ct": "Oct 21, 11:03 AM CT", "likes": 33, "replies": 13, "reply": "The missed call isn't the expensive part. The customer doesn't call back, they call the next number on Google. That's the first thing I'd point AI at in an HVAC shop: not marketing, the phone.", "tier": "New account: just added", "hot": false, "new": true}, {"handle": "ChrisRamsey60", "name": "Chris Ramsey | SMB and R.E.", "followers": 125045, "id": "2113234322312368310", "url": "https://x.com/ChrisRamsey60/status/2113234322312368310", "text": "Everybody wants to own a service business. Here’s how I would start.\n\nWhen you own enough real estate, you already have a pipeline of work. Maintenance, construction, HVAC, landscaping and snow removal. Services you’re paying for anyway.\n\nPick one where your properties generate enough consistent demand to support a team. Partner with a skilled operator. Give them ownership and a reason to grow with you. They bring the trade expertise. You bring the work, capital and business infrastructure.\n\nStart with your own properties. Get the pricing, quality and systems right. Then expand to other property owners.\n\nYour portfolio becomes the foundation for a service business that can eventually grow well beyond it.\n\nSometimes your next business opportunity is sitting in the invoices you’re already paying.", "posted_utc": "2026-10-22T11:41:39.000Z", "posted_ct": "Oct 22, 06:41 AM CT", "likes": 10, "replies": 3, "reply": "Last line is the whole post. Your invoices are a market you've already validated with your own money. One rule I'd add: hand the operator real systems on day one, or you've just bought someone a job.", "tier": "New account: just added", "hot": false, "new": true}, {"handle": "agazdecki", "name": "Andrew Gazdecki", "followers": 316674, "id": "2113048159459172475", "url": "https://x.com/agazdecki/status/2113048159459172475", "text": "Nobody really prepares founders for how exciting it is when their employees start coming up with better ideas than they do.", "posted_utc": "2026-10-21T23:21:54.000Z", "posted_ct": "Oct 21, 06:21 PM CT", "likes": 207, "replies": 30, "reply": "Same thing in a trades shop when a tech fixes a process you didn't know was broken. The best ideas come from whoever's closest to the customer, and in HVAC that's rarely the owner.", "tier": "Worth a reply", "hot": false, "new": false}, {"handle": "jasonlk", "name": "Jason ✨👾SaaStr.Ai✨ Lemkin", "followers": 253779, "id": "2113061773347803575", "url": "https://x.com/jasonlk/status/2113061773347803575", "text": "When I'm ready to buy,  \n\nA great sales rep makes it easier.  And better.  And gets all my questions answered.  \n\nA mediocre rep just makes it harder.", "posted_utc": "2026-10-22T00:16:00.000Z", "posted_ct": "Oct 21, 07:16 PM CT", "likes": 24, "replies": 24, "reply": "That's the whole HVAC replacement sale. Customer is sweating in a hot house. A great tech explains the options in plain English; a mediocre one makes them call two more companies.", "tier": "Worth a reply", "hot": false, "new": false}, {"handle": "jasonlk", "name": "Jason ✨👾SaaStr.Ai✨ Lemkin", "followers": 253779, "id": "2113079676746789186", "url": "https://x.com/jasonlk/status/2113079676746789186", "text": "New!! Our agents built their own mailbox\n\nMuse and 10K had no integration. So they made a shared mailbox themselves.\n\nhttps://t.co/5g7jxmZMrz", "posted_utc": "2026-10-22T01:27:08.000Z", "posted_ct": "Oct 21, 08:27 PM CT", "likes": 16, "replies": 14, "reply": "Agents building the integration nobody would sell them is the real unlock for trades. Plenty of the software in a service business has no API, and the agent doesn't care.", "tier": "Worth a reply", "hot": false, "new": false}, {"handle": "WilsonCompanies", "name": "John Wilson", "followers": 39142, "id": "2112905786758214100", "url": "https://x.com/WilsonCompanies/status/2112905786758214100", "text": "Your CRM should show you where leads come from, how many turn into sold jobs, and which marketing channels actually generate revenue. https://t.co/VM2XkMSnCP", "posted_utc": "2026-10-21T13:56:10.000Z", "posted_ct": "Oct 21, 08:56 AM CT", "likes": 5, "replies": 6, "reply": "And if it can't show which leads called, didn't book, and never got a callback, it's a contact list with a subscription fee. That last group is where the money hides.", "tier": "Worth a reply", "hot": false, "new": false}, {"handle": "harjtaggar", "name": "Harj Taggar", "followers": 39617, "id": "2112899963453907069", "url": "https://x.com/harjtaggar/status/2112899963453907069", "text": "The top end of growth rates for companies riding an AI tailwind just keeps accelerating. https://t.co/mDG3SoNkL3", "posted_utc": "2026-10-21T13:33:01.000Z", "posted_ct": "Oct 21, 08:33 AM CT", "likes": 31, "replies": 6, "reply": "Next wave rides the tailwind selling to people who don't care about AI at all. A plumber will never ask what model you use, only whether the phone got answered.", "tier": "Worth a reply", "hot": false, "new": false}, {"handle": "zachglabman", "name": "zach", "followers": 11828, "id": "2112983280647889065", "url": "https://x.com/zachglabman/status/2112983280647889065", "text": "I come back to this often \n\nthe absurd pessimism and decelerationism from academic economists around labor and labor markets is unlike anything else\n\nthe has never been a better time to be a job seeker without an ego, never a worse time to be someone with one https://t.co/MfM9Ga3c3n", "posted_utc": "2026-10-21T19:04:06.000Z", "posted_ct": "Oct 21, 02:04 PM CT", "likes": 12, "replies": 0, "reply": "Same in the trades. The guys without ego are learning to work alongside AI dispatch. The ones with ego are still arguing about whether a computer can answer a phone.", "tier": "Worth a reply", "hot": false, "new": false}, {"handle": "Austen", "name": "Austen Allred", "followers": 487497, "id": "2113033791686213710", "url": "https://x.com/Austen/status/2113033791686213710", "text": "If you got hacked recently and haven’t told anyone yet now is the time to notify", "posted_utc": "2026-10-21T22:24:48.000Z", "posted_ct": "Oct 21, 05:24 PM CT", "likes": 589, "replies": 24, "reply": "For a small business the notification usually comes from a customer: \"why did your website just send me a pharmacy ad?\"", "tier": "Worth a reply", "hot": false, "new": false}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
<textarea>${esc(draft)}</textarea><div class="row"><button class="primary rp">Reply on X</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>window.open('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value),'_blank','noopener');
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
