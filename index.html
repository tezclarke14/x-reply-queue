<title>X Reply Queue</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:#f5f6f8;color:#14171a}

a{color:#1d9bf0;text-decoration:none}

.b-new{background:#16a34a}.b-hot{background:#e8590c}.legend{font-size:13px;color:#536471;margin:4px 4px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.angle{background:#eef3ff;border-left:3px solid #1d4ed8;padding:6px 10px;border-radius:6px;margin:8px 0;font-weight:600}.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:4px}
</style></head><body>
<header><h1>X Reply Queue <span class="muted">@onhand_terry</span></h1>
<span class="pill" id="prog"></span><span class="pill" id="timer">30:00</span>
<a class="pill" href="scorecard.html" style="text-decoration:none">📊 Scorecard</a><a class="pill" href="plan.html" style="text-decoration:none">🗓️ Plan</a><a class="pill" href="investors.html" style="text-decoration:none">💼 Investors</a><button id="tbtn">Start</button><button id="treset">Reset</button></header><div class="bar"><i id="pbar"></i></div>
<main><div class="legend"><span><span class="sw" style="border-left:5px solid #16a34a;background:#fff;border:1px solid #ccc;border-left:5px solid #16a34a"></span><span class="badge b-new">NEW</span>new account / first time in queue</span><span><span class="sw" style="background:#fff4d6;border:1px solid #f0b429"></span><span class="badge b-hot">HOT</span>top pick / highest engagement</span></div><div id="list"></div></main>
<script>
const POSTS=[{"handle": "agazdecki", "name": "Andrew Gazdecki", "followers": 318056, "id": "2125580730621440352", "url": "https://x.com/agazdecki/status/2125580730621440352", "text": "Your startup might be worth a lot more to a competitor than it is to you.\n\nThis is one of the more interesting things about acquisitions.\n\nSay you own a SaaS company with 2,000 paying customers and $300K in annual profit.\n\nYou know how much money the business makes, how fast it's growing, and roughly what it costs to acquire a customer.\n\nBut a competitor looking to acquire your business is doing some completely different math.\n\nThey already have a customer support team.\n\nThey already have a sales team.\n\nThey could potentially eliminate $100K in overlapping annual expenses.\n\nAnd if just 20% of your customers buy another one of their products at $100 a month, that's another $480K in annual revenue.\n\nSuddenly, your little SaaS company looks like a much bigger financial opportunity to them.\n\nThis is why I think founders should be careful about valuing their startups purely on a multiple of profit.\n\nEvery buyer has a different reason for wanting to acquire your business.\n\nSome want the cash flow. \n\nOthers want your technology, your customers, or a faster way to enter a new market.\n\nAnd occasionally, someone comes along who can make considerably more money from your business than you can.\n\nThat's also why having multiple buyers interested in your startup is so important.\n\nYou never really know who's going to see the most value in what you've built until you start having those conversations.\n\nP.S. thinking about selling your startup? Our team will help you understand what your business is worth, prepare it for buyers, and guide you through the entire acquisition process. Meet the team here: https://t.co/6hqLR8REAe", "posted_utc": "2026-11-25T13:21:52.000Z", "posted_ct": "Nov 25, 07:21 AM CT", "likes": 7, "replies": 1, "reply": "Same in the trades. The customer list is worth more to the guy down the road.", "angle": "Rollups: who pays most for a trades co", "tier": "Reply now", "hot": true, "new": true}, {"handle": "LoganARobison", "name": "Logan Robison ⚡️", "followers": 9638, "id": "2125580954030809474", "url": "https://x.com/LoganARobison/status/2125580954030809474", "text": "Was going to wait until after Thanksgiving… but here we go!\n\nWhat started as a small hobby project 1.5 years ago has turned into a full-blown, all-in-one platform for Airbnb/STR cleaning companies. \n\nWith Same Day Turn you can connect to your hosts’ calendars through iCal links, bill hosts directly from the platform, run payroll, build universal & property-specific checklists, create automated workflows for departure cleans, quality control inspections, trash jobs, etc \n\nIt even has a marketplace where you can post a job and get in front of +110k STR cleaners \n\nWith Same Day Turn, you’ll never need manually input a booking again saving yourself from human error and extra admin expenses\n\nWe built the software I always wanted for the vacation rental cleaning side of my business. And we made it FREE to use a basic version of it. \n\nAnd before you have to ask, no, this isn’t vibe coded. I’m working with a local developer on this every day. \n\nSo if your company cleans 1 or 100 short-term rentals, check out Same Day Turn today!\n\nLinked below 👇", "posted_utc": "2026-11-25T13:22:45.000Z", "posted_ct": "Nov 25, 07:22 AM CT", "likes": 3, "replies": 4, "reply": "", "angle": "Building ops software for service crews", "tier": "Reply now", "hot": false, "new": true}, {"handle": "irentdumpsters", "name": "Bodhi- Local SEO", "followers": 23848, "id": "2125568798228947352", "url": "https://x.com/irentdumpsters/status/2125568798228947352", "text": "Churn is directly correlated with billing frequency. The less often you bill, the less churn you have. https://t.co/ofg5gyOTow https://t.co/GSfcL8Jyi5", "posted_utc": "2026-11-25T12:34:27.000Z", "posted_ct": "Nov 25, 06:34 AM CT", "likes": 1, "replies": 1, "reply": "", "angle": "HVAC maintenance plans: billing vs churn", "tier": "Reply now", "hot": false, "new": true}, {"handle": "noahiglerSEO", "name": "Noah Igler", "followers": 7864, "id": "2125566688569491891", "url": "https://x.com/noahiglerSEO/status/2125566688569491891", "text": "I spent dozens of hours studying 3 home service brands doing $100M+ a year: Roto-Rooter, A1 Garage Door and Truly Nolen.\n\n6 habits kept showing up in all three, and every one of them shows up on Google.\n\nFor scale, Roto-Rooter brought in about $900M last year, and KKR agreed to buy A1 for a reported $2B in September.\n\nHere's the check I'd run on your company for each habit:\n\n> Every service you want more of has its own page and its own focus on Google\n> The first screen of your homepage takes the worry out of the bill\n> Last month, you got a review on 30% or more of your jobs\n> You're top 3 across your whole service area, not just near your shop\n> More people search your company name every month\n> AI answers name you for your trade in your city\n\nHow each brand does it is below.\n\n(Bookmark this)", "posted_utc": "2026-11-25T12:26:04.000Z", "posted_ct": "Nov 25, 06:26 AM CT", "likes": 3, "replies": 4, "reply": "", "angle": "Ohm SEO test bed vs the big brands", "tier": "Reply now", "hot": false, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');const isQt=p.mode==='qt';
c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}${isQt?'<span class="badge" style="background:#7c3aed">QT</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
${p.angle?'<div class="angle">Angle: '+esc(p.angle)+'</div>':''}<textarea placeholder="${isQt?'Your quote take...':'Your one-liner...'}">${esc(draft)}</textarea><div class="row"><button class="primary rp">${isQt?'Quote on X':'Reply on X'}</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>{const u=isQt?('https://x.com/intent/post?url='+encodeURIComponent(p.url)+'&text='+encodeURIComponent(ta.value)):('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value));window.open(u,'_blank','noopener')};
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
