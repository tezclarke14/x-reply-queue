<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X Reply Queue</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:#f5f6f8;color:#14171a}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e3e6ea;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1}.pill{background:#eef3ff;color:#1d4ed8;border-radius:99px;padding:4px 10px;font-weight:600}
.bar{height:4px;background:#e3e6ea;width:100%}.bar i{display:block;height:100%;background:#1d9bf0;width:0}
button{font:inherit;border:1px solid #cfd5db;background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{background:#0f1419;color:#fff;border-color:#0f1419}
main{max-width:680px;margin:0 auto;padding:12px}h2{font-size:13px;text-transform:uppercase;color:#536471;margin:18px 4px 8px}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:12px;padding:14px;margin-bottom:12px}
.card.done{opacity:.45}.card.skip{opacity:.3}.who{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.who b{font-size:15px}.muted{color:#536471;font-size:13px}.text{white-space:pre-wrap;margin:8px 0;max-height:220px;overflow:auto}
textarea{width:100%;min-height:84px;font:inherit;border:1px solid #cfd5db;border-radius:8px;padding:8px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.cnt{margin-left:auto;font-size:13px;color:#536471}.cnt.over{color:#d00;font-weight:700}
a{color:#1d9bf0;text-decoration:none}
.card.new{border-left:5px solid #16a34a}.card.hot{background:#fff4d6;border-color:#f0b429}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:4px;color:#fff;vertical-align:middle}
.b-new{background:#16a34a}.b-hot{background:#e8590c}.legend{font-size:13px;color:#536471;margin:4px 4px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.angle{background:#eef3ff;border-left:3px solid #1d4ed8;padding:6px 10px;border-radius:6px;margin:8px 0;font-weight:600}.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:4px}
</style></head><body>
<header><h1>X Reply Queue <span class="muted">@onhand_terry</span></h1>
<span class="pill" id="prog"></span><span class="pill" id="timer">30:00</span>
<a class="pill" href="scorecard.html" style="text-decoration:none">📊 Scorecard</a><a class="pill" href="plan.html" style="text-decoration:none">🗓️ Plan</a><a class="pill" href="investors.html" style="text-decoration:none">💼 Investors</a><button id="tbtn">Start</button><button id="treset">Reset</button></header><div class="bar"><i id="pbar"></i></div>
<main><div class="legend"><span><span class="sw" style="border-left:5px solid #16a34a;background:#fff;border:1px solid #ccc;border-left:5px solid #16a34a"></span><span class="badge b-new">NEW</span>new account / first time in queue</span><span><span class="sw" style="background:#fff4d6;border:1px solid #f0b429"></span><span class="badge b-hot">HOT</span>top pick / highest engagement</span></div><div id="list"></div></main>
<script>
const POSTS=[{"handle": "LoganARobison", "name": "Logan Robison ⚡️", "followers": 9557, "id": "2121231665569648985", "url": "https://x.com/LoganARobison/status/2121231665569648985", "text": "Our first week in business we did $500 from one job and it was almost a total disaster. \n\nI didn’t know what to quote so I threw out a number that sounded high to me ($200). I hired some contractors and told them the pay was $100. They laughed at me. \n\nI asked what they wanted and they said $250. I knew I was supposed to make at least 50% on each job, so I called the customer back and told him it would be $500. Thankfully, he agreed \n\nI had no clue what I was doing. If that first job had gone wrong, I probably would have given up. But it went fine and I’m still here. That customer was our first 5-star review.  \n\nI hate the question “what business should I start?” It doesn’t matter when it’s your first one. It’s more important that you start something vs starting the right thing. That question becomes more important once you have some reps in.\n\nMy main business isn’t sexy or impressive. If anything, it’s kind of the bottom of the barrel in terms of a cool factor but it let me quit my job and has provided a pretty incredible life. If you want to be an entrepreneur, pick something (literally anything) and get your first sale. Figure out the rest later", "posted_utc": "2026-11-13T13:20:14.000Z", "posted_ct": "Nov 13, 07:20 AM CT", "likes": 2, "replies": 1, "reply": "Everyone's first quote is a number that sounded high to them", "angle": "HVAC test bed: quoting is the hard part", "tier": "Reply now", "hot": true, "new": true}, {"handle": "agazdecki", "name": "Andrew Gazdecki", "followers": 317772, "id": "2121228030777462808", "url": "https://x.com/agazdecki/status/2121228030777462808", "text": "A founder who sells their startup for $3M could walk away with more money than someone who sells for $30M. \n\nSounds ridiculous but hear me out.\n\nFounder #1 bootstraps a SaaS company.\n\nNever raises a dollar.\n\nOwns 100% of the business.\n\nSells it for $3M.\n\nWalks away with roughly $3M before taxes and transaction costs.\n\nFounder #2 raises $20M in venture capital over several rounds.\n\nBuilds a much bigger company.\n\nEventually sells for $30M.\n\nSounds like a massive win, right?\n\nWell, let's say the founder owns 15% at exit.\n\nAnd investors have a standard 1x non-participating liquidation preference.\n\nIf investors choose to take their $20M back first, there's $10M left for common shareholders.\n\nDepending on the cap table, that founder could walk away with significantly less than $3M.\n\nDespite selling their company for 10x more.\n\nObviously, this is a simplified example. Actual payouts depend on ownership, preference terms, and the full cap table.\n\nAnd venture capital can absolutely be the right decision when you're building something that needs serious capital to scale.\n\nI think founders underestimate how much ownership matters.\n\nWe celebrate the size of acquisitions all the time.\n\nNobody really talks about how much the founder actually gets to keep.\n\nP.S. thinking about selling your startup? Our team will help you understand what your business is worth, prepare it for buyers, and guide you through the entire acquisition process. Meet the team here: https://t.co/6hqLR8R6KG", "posted_utc": "2026-11-13T13:05:47.000Z", "posted_ct": "Nov 13, 07:05 AM CT", "likes": 11, "replies": 7, "reply": "", "angle": "Founder ownership: what UK startup taught you", "tier": "Reach", "hot": false, "new": true}, {"handle": "noahiglerSEO", "name": "Noah Igler", "followers": 7761, "id": "2121232874800091591", "url": "https://x.com/noahiglerSEO/status/2121232874800091591", "text": "If you run a plumbing, HVAC or electrical company, these are the Google Business Profile categories we recommend.\n\nIn Google's own words: \"The categories you select affect your local ranking on Google.\"\n\nHere's the list by trade, and how we pick them:\n\n(Bookmark this)\n\nOne rule covers all of them: the category has to finish the sentence \"This business IS a.\" That's Google's test. Store and supplier categories only fit if you actually sell the product.\n\n1. Plumbing\nPrimary: Plumber. Then add any of these that match work you really do:\n> Drainage service\n> Water softening equipment supplier, if you sell and install them\n> Septic system service\n> Water damage restoration service\n> Gas installation service\n> Bathroom remodeler\n\n2. HVAC\nPrimary: HVAC contractor. Secondary:\n> Air conditioning contractor\n> Heating contractor\n> Air conditioning repair service\n> Furnace repair service\n> Air duct cleaning service\n> Insulation contractor\n\n3. Electrical\nPrimary: Electrician. Secondary:\n> Electrical installation service\n> Lighting contractor\n> Electric generator shop\n> Security system installation service\n> Electric vehicle charging station contractor\n> Solar energy system service\n\n4. Names that aren't categories anymore, or never were\n> Renamed: \"Generator shop\" is now \"Electric generator shop,\" \"Solar energy contractor\" is now \"Solar energy system service,\" and \"Security system installer\" is now \"Security system installation service.\"\n> Water heater installation, drain cleaning, sewer repair and plumbing leak detection are services under Plumber, not categories.\n> There's no \"Emergency plumber\" or heat pump category.\n\nWhy it matters:\n\n> Primary category ranked #1 for the map pack in Whitespark's 2026 survey of local SEO experts. Additional categories ranked #8.\n> Google says \"All locations of a business must share a 'Primary category.'\" If your plumbing and HVAC need different primaries, that's a separate brand with its own real location.\n> Store categories like \"Air conditioning store\" or \"Plumbing supply store\" can make Google read you as a retailer, not a company that comes to the house.\n\nHow we set them up:\n\n> Search the job you want most in your town, and check the primary category on the top 3 profiles\n> Set the primary to the main trade in the profile name. Every location under the same name gets the same primary.\n> Add secondaries only for work that office really does. Google allows up to 9.\n> Put the specific jobs in the services list, each with its own description\n> Set them once and leave them. Google says that if you add or edit a category, \"you might be asked to verify your business again.\"", "posted_utc": "2026-11-13T13:25:02.000Z", "posted_ct": "Nov 13, 07:25 AM CT", "likes": 0, "replies": 0, "reply": "", "angle": "Ohm HVAC: setting up our own profile", "tier": "Reply now", "hot": false, "new": true}, {"handle": "SMB_Attorney", "name": "SMB Attorney", "followers": 160734, "id": "2121230146279780703", "url": "https://x.com/SMB_Attorney/status/2121230146279780703", "text": "Absolutely insane that we need legislation for this.\n\nI want businesses to make money. Build something great. Take care of customers. Earn their loyalty.\n\nBut digging through someone’s personal data to figure out how much extra you can squeeze out of them?\n\nCome on.\n\nI don’t want a background check everytime I buy a cheeseburger.", "posted_utc": "2026-11-13T13:14:12.000Z", "posted_ct": "Nov 13, 07:14 AM CT", "likes": 5, "replies": 0, "reply": "", "angle": "Trades quotes: price the job, not the customer", "tier": "Reply now", "hot": false, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');const isQt=p.mode==='qt';
c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}${isQt?'<span class="badge" style="background:#7c3aed">QT</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
${p.angle?'<div class="angle">Angle: '+esc(p.angle)+'</div>':''}<textarea placeholder="${isQt?'Your quote take...':'Your one-liner...'}">${esc(draft)}</textarea><div class="row"><button class="primary rp">${isQt?'Quote on X':'Reply on X'}</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>{const u=isQt?('https://x.com/intent/post?url='+encodeURIComponent(p.url)+'&text='+encodeURIComponent(ta.value)):('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value));window.open(u,'_blank','noopener')};
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
