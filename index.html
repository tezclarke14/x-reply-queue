const POSTS=[{"handle": "JulienBek", "name": "Julien Bek", "followers": 12159, "id": "2117964142686478693", "url": "https://x.com/JulienBek/status/2117964142686478693", "text": "Sequoia is consolidating in the US. I’m staying in Europe. Time to build 👊 \n\nI’ve spent the past 10 years investing in European founders, including founders at companies such as @Revolut, @Rillet, @attio, @DustHQ, @MiroHQ , @MelioPayments among others. The best part has been getting to know ambitious founders early, believing in what they could build, and staying alongside them as they do it. \n\nI’m grateful to my colleagues at @sequoia for the opportunity to do that together. This feels like a good moment to think about what the next 10 years could look like.\n\nMy heart is in Europe, and I’ve decided to stay here. I’ll continue supporting the founders I work with and serving on my boards. \n\nThere’s more to build, and I’m looking forward to what comes next.", "posted_utc": "2026-11-04T12:56:16.000Z", "posted_ct": "Nov 04, 06:56 AM CT", "likes": 25, "replies": 5, "reply": "Went the other way. Texas has better AC.", "angle": "UK founder who went the other way", "tier": "Reply now", "hot": true, "new": true}, {"handle": "_toddanderson", "name": "Todd Anderson - SEO for the Trades", "followers": 7535, "id": "2117955022528864384", "url": "https://x.com/_toddanderson/status/2117955022528864384", "text": "I worked with a $4.3 million electrical company last week whose owner was proud of the 300 website pages he had written with the help of Claude for his SEO. \n\nNone of his pages were indexed by Google, none were ranking, and he has no booked work to show for his efforts. \n\nWith the advent of AI, it's just too easy to write massive amounts of content online right now, and a lot of business owners are falling prey to it. \n\nHere's how we roll these out for our clients. \n\n- If they don't have the basic service and their top 5 location pages built already, we build those week 1. \n- After that, we start rolling out systematic location pages across the metro they want to rank in. Usually anywhere from 5 to 7 a month. \n- We watch these closely and ensure the pages we write are getting indexed by Google consistently before we start writing more. \n\nThis strategy will continue until we've mapped out most of the metro they want to rank in, with city and neighborhood-type pages. \n\nIf you're building out your location pages yourself, open up Google Search Console and ensure that your pages are getting indexed before you write more.", "posted_utc": "2026-11-04T12:20:01.000Z", "posted_ct": "Nov 04, 06:20 AM CT", "likes": 3, "replies": 0, "reply": "300 pages and zero readers. Very efficient.", "angle": "AI content vs booked jobs at our HVAC shop", "tier": "Reply now", "hot": true, "new": true}, {"handle": "noahiglerSEO", "name": "Noah Igler", "followers": 7577, "id": "2117954522626552084", "url": "https://x.com/noahiglerSEO/status/2117954522626552084", "text": "If I owned a $10M roofing company in Nashville, here's exactly how I'd make Google our biggest source of new roofs:\n\n(Bookmark this)\n\nThe Nashville metro has about 2.2 million people, up 9% since 2020, and its biggest roofers already have serious review counts.\n\nThese are the most-reviewed roofing profiles on Google in Nashville right now:\n\n> MidSouth Construction: 1,123\n> Centennial Roofing: 1,045\n> Don Kennedy Roofing: 952\n> Music City Roofers: 881\n> Storm Guard Roofing: 864\n\nMusic City Roofers is owned by Feazel, an Ohio roofing company backed by private equity. Storm Guard is a national franchise brand.\n\nYou don't need to pass any of them to win most of the metro.\n\nMidSouth has the most reviews in the city, all on one Google profile at one address in southeast Nashville. I searched for roofers in nine suburbs, and it didn't show up in the top 5 in any of them.\n\nThat pin is about 14 miles from Hendersonville, 16 from Franklin, 24 from Murfreesboro and Gallatin, and 28 from Spring Hill. Google mostly shows a profile to people within a few miles of it.\n\nThe roofers who show up across the suburbs run more than one profile. Centennial has three and ranks first in Brentwood. Tim Leeper Roofing has two, and they show up in the top 5 in Franklin, Brentwood, Hendersonville and Mt. Juliet.\n\nNow look at who Google lists first in the suburbs:\n\n> Gallatin: 57 to 160 reviews\n> Smyrna: 57 to 193\n> Murfreesboro: 85 to 364\n> Lebanon: 93 to 406, and the first listing has 97\n> Spring Hill: 69 to 570\n\nMurfreesboro has about 153,000 people, more than any city in the metro except Nashville. The busiest roofer in its top 5 has 364 reviews.\n\nThis is how I'd go after them:\n\n1. Set up tracking before anything else\nGive each Google profile, the website and Google Ads its own tracking number, and match every sold roof in the CRM back to the lead that started it.\n\n2. Find the money first, then check the map\nExport the last 12-24 months of sold roofs by zip code from your CRM. Then, run a map scan for \"roof replacement near me\" and \"new roof near me\" across the metro. The places where you have good jobs but poor rankings are typically where we'd set up the next GBP.\n\n3. Start with one new office, not three\nI wouldn't open three offices off the bat. Every profile needs its own steady flow of reviews to rank, so you can only run as many profiles as your reviews can support.\n\nIf the CRM backs it up, I'd start with Gallatin, where none of the top 5 has more than 160 reviews. Once that profile is ranking well and enough reviews are coming in to support another one, I'd add Murfreesboro. It's the biggest city in the metro after Nashville, and the busiest roofer in its top 5 has 364 reviews, so it takes more reviews to break into. Lebanon, where the first roofer Google lists has 97 reviews, would be third, and Smyrna, where none of the top 5 has 200, would be fourth.\n\nI'd skip Franklin and Brentwood for now. Storm Guard has 864 reviews in Franklin, and Centennial has 1,045 in Brentwood.\n\nEach office gets a lease in the business name, a permanent sign with the exact name and its own suite number.\n\n4. Name each office for the trade and the town\nThe first one would be [Brand] Roofing Gallatin, and the later ones would be [Brand] Roofing Murfreesboro and [Brand] Roofing Lebanon.\n\nIt has to be a real DBA. In Tennessee, a company registers an assumed name with the Secretary of State for $20 plus an online fee. Get it on the lease, invoices and citations before it goes on the profile. A few of the suburb leaders already have the town in their name.\n\n5. Fill out each profile\n> Set the primary category to Roofing contractor.\n> Add every service with a short description that names the town: roof replacement, roof repair, storm and hail damage inspections, insurance claim help, metal roofs and gutters.\n> Give it its own tracking number, and put that same name, address and number on 50 core directory listings.\n> Point the website button at that office's city page, with tracking tags.\n> Upload real photos from roofs in that town, and post twice a week with a Learn More button to a service or city page.\n\n6. Get a review on 40 to 50% of your jobs\nThe number of reviews you get each month decides how many profiles you can run, so I'd set the target at a review on 40% of all jobs and push the team for 50%. It's possible if you do a really good job, and I'd do whatever it takes to get there.\n\nThe project manager asks at the final walkthrough, with the before and after photos on his phone, and texts them over so the homeowner can attach them. Pay the project managers for every review.\n\nFor each profile, count the closest competitor's new reviews from the last 30 days and beat that number every month. Ramp a new profile up instead of hitting it with a pile of reviews at once: about 15 in month one, 25 to 30 in month two, 30 to 35 in month three, then 40 to 45 a month. When the reviews coming in can support another profile, that's when the next office opens.\n\n7. City pages with real local detail\n> Name the storms that hit that town. The National Weather Service logged hail up to 2.25 inches in Franklin and 1.75 inches in Murfreesboro on May 26, 2024.\n> Explain why roofs there are due. Smyrna doubled its housing units between 2000 and 2020, and a 3-tab shingle roof lasts about 20 years, so the roofs from the first half of that boom are 20 years old now.\n> Show the local rules and your license number. In Davidson and Rutherford counties, residential jobs from $3,000 to under $25,000 need a Home Improvement license, and insurance-paid roofing contracts have to give homeowners 3 days to cancel.\n\n8. Publish real prices\nThere's almost no real Nashville roof pricing online, and This Old House only has a statewide average of $8,518. I'd build a page called \"What a new roof costs in Gallatin\" with a real price range, what pushes it up or down (pitch, layers and material) and the monthly payment.\n\n9. Get local links\n> Join Williamson, Inc., the Rutherford County Chamber and the Gallatin and Hendersonville area chambers\n> Go after the Tennessean's Best of Music City awards, which have had a roofing category\n> Sponsor youth sports in the towns where the new offices are\n> Send a press release a month tying your name to roofing and the town\n\n10. Run Google Ads until organic catches up\nBid on your own name, and put the rest on replacement and storm searches in the towns where the new offices aren't ranking yet.\n\nWhat to expect:\n\nYou're not catching MidSouth or Centennial in their backyards anytime soon.\n\nFollow the ramp and a new Gallatin office has about 200 reviews by month six. That's more than any of the five roofers Google lists in Gallatin today. Plan on 6 to 12 months before organic carries real weight.", "posted_utc": "2026-11-04T12:18:02.000Z", "posted_ct": "Nov 04, 06:18 AM CT", "likes": 7, "replies": 2, "reply": "", "angle": "Reviews naming techs, from our HVAC test bed", "tier": "Reply if time", "hot": false, "new": true}, {"handle": "sahilpatwa", "name": "Sahil Patwa", "followers": 825, "id": "2117936919824814390", "url": "https://x.com/sahilpatwa/status/2117936919824814390", "text": "For founders looking to do their initial AI Roll-up acquisitions, remember: not all sellers are alike. \n\nUnderstanding who you're buying from is the first step to a strong pipeline. (Know your Audience, always) https://t.co/9NJk1ns3k9", "posted_utc": "2026-11-04T11:08:05.000Z", "posted_ct": "Nov 04, 05:08 AM CT", "likes": 5, "replies": 1, "reply": "", "angle": "AI rollups seen from inside an HVAC shop", "tier": "Reply if time", "hot": false, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';

function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';

const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;

c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}${isQt?'<span class="badge" style="background:#7c3aed">QT</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
${p.angle?'<div class="angle">Angle: '+esc(p.angle)+'</div>':''}<textarea placeholder="${isQt?'Your quote take...':'Your one-liner...'}">${esc(draft)}</textarea><div class="row"><button class="primary rp">${isQt?'Quote on X':'Reply on X'}</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>{const u=isQt?('https://x.com/intent/post?url='+encodeURIComponent(p.url)+'&text='+encodeURIComponent(ta.value)):('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value));window.open(u,'_blank','noopener')};
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';

// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}

else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
