<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X Reply Queue</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:#f5f6f8;color:#14171a}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e3e6ea;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1}.pill{background:#eef3ff;color:#1d4ed8;border-radius:99px;padding:4px 10px;font-weight:600}
.bar{height:4px;background:#e3e6ea;width:100%}.bar i{display:block;height:100%;background:#1d9bf0;width:0}
button{font:inherit;border:1px solid #cfd5db;background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{background:#0f1419;color:#fff;border-color:#0f1419}
main{max-width:680px;margin:0 auto;padding:12px}h2{font-size:13px;text-transform:uppercase;color:#536471;margin:18px 4px 8px}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:12px;padding:14px;margin-bottom:12px}
.card.done{opacity:.45}.card.skip{opacity:.3}.who{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.who b{font-size:15px}.muted{color:#536471;font-size:13px}.text{white-space:pre-wrap;margin:8px 0;max-height:220px;overflow:auto}
textarea{width:100%;min-height:84px;font:inherit;border:1px solid #cfd5db;border-radius:8px;padding:8px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.cnt{margin-left:auto;font-size:13px;color:#536471}.cnt.over{color:#d00;font-weight:700}
a{color:#1d9bf0;text-decoration:none}
.card.new{border-left:5px solid #16a34a}.card.hot{background:#fff4d6;border-color:#f0b429}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:4px;color:#fff;vertical-align:middle}
.b-new{background:#16a34a}.b-hot{background:#e8590c}.legend{font-size:13px;color:#536471;margin:4px 4px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.angle{background:#eef3ff;border-left:3px solid #1d4ed8;padding:6px 10px;border-radius:6px;margin:8px 0;font-weight:600}.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:4px}
</style></head><body>
<header><h1>X Reply Queue <span class="muted">@onhand_terry</span></h1>
<span class="pill" id="prog"></span><span class="pill" id="timer">30:00</span>
<a class="pill" href="scorecard.html" style="text-decoration:none">📊 Scorecard</a><a class="pill" href="plan.html" style="text-decoration:none">🗓️ Plan</a><a class="pill" href="investors.html" style="text-decoration:none">💼 Investors</a><button id="tbtn">Start</button><button id="treset">Reset</button></header><div class="bar"><i id="pbar"></i></div>
<main><div class="legend"><span><span class="sw" style="border-left:5px solid #16a34a;background:#fff;border:1px solid #ccc;border-left:5px solid #16a34a"></span><span class="badge b-new">NEW</span>new account / first time in queue</span><span><span class="sw" style="background:#fff4d6;border:1px solid #f0b429"></span><span class="badge b-hot">HOT</span>top pick / highest engagement</span></div><div id="list"></div></main>
<script>
const POSTS=[{"handle": "agazdecki", "name": "Andrew Gazdecki", "followers": 317540, "id": "2119776836171542647", "url": "https://x.com/agazdecki/status/2119776836171542647", "text": "I'd rather sell my startup for $5M at 30 than $20M at 50 and I know a lot of founders will disagree with me on this.\n\nBut 20 years of your life is worth a hell of a lot of money.\n\nThink about what $5M at 30 could do for someone.\n\nYou could buy a house or invest a few million dollars.\n\nSpend more time with your family.\n\nStart another company without worrying about how you're going to pay your bills.\n\nAnd you still have decades ahead of you to build something bigger.\n\nNow imagine spending another 20 years grinding away to eventually sell for $20M.\n\nSure, that's 4x the money but you can't buy back those 20 years.\n\nI sold my first company for eight figures at 29.\n\nAnd one of the biggest things that exit gave me was the freedom to decide what I wanted to do next.\n\nI ended up starting more companies.\n\nObviously, there's a huge difference between $5M and $20M, especially after taxes, dilution, and everything else.\n\nBut I think founders sometimes underestimate how valuable an early exit can be.\n\nP.S. thinking about selling your startup? Our team will help you understand what your business is worth, prepare it for buyers, and guide you through the entire acquisition process. Meet the team here: https://t.co/GI23R60S1X", "posted_utc": "2026-11-09T12:59:15.000Z", "posted_ct": "Nov 09, 06:59 AM CT", "likes": 7, "replies": 6, "reply": "The P.S. is doing a lot of work here", "angle": "Former founder: what 20 years actually costs", "tier": "Reach", "hot": true, "new": true}, {"handle": "andywalkerhq", "name": "Andy Walker", "followers": 8141, "id": "2119772429358661704", "url": "https://x.com/andywalkerhq/status/2119772429358661704", "text": "Over the last six months we've invested more money into Stryker than ever before.\n\nWe’ve hired industry veterans with 20+ years experience in home service to launch our Google Ads department.\n\nTwo full time AI engineers to build ‘Stryke’ our real time revenue attribution platform.\n\nA marketer who helped scale a well known company from $10M -> $50M/year.\n\nWe’ve been reinvesting everything to build Stryker 2.0.\n\nComing soon..", "posted_utc": "2026-11-09T12:41:45.000Z", "posted_ct": "Nov 09, 06:41 AM CT", "likes": 8, "replies": 0, "reply": "", "angle": "HVAC test bed: attribution is the hard part", "tier": "Reply now", "hot": true, "new": true}, {"handle": "guilleflorvs", "name": "Guillermo Flor", "followers": 14211, "id": "2119766657425879225", "url": "https://x.com/guilleflorvs/status/2119766657425879225", "text": "Mark Cuban's take on the next job wave deserves more attention than it's getting.\n\nHis argument: software as we know it is dying. Generic SaaS gets replaced by AI customized to how each business actually operates.\n\nThe question then becomes, who builds and deploys that for the 33 million companies in the US that can't do it themselves?\n\nThat's the market. Not AI for enterprises with 500-person eng teams. The other 99%.\n\nSMBs don't have CTOs. They don't have prompt engineers. They need someone to sit across the table, understand their workflow, and wire up an AI system that fits it.\n\nThat's a services business. Probably the largest one this decade.\n\nWe broke this down step by step in Product Market Fit: https://t.co/a6d1HT1c7r", "posted_utc": "2026-11-09T12:18:49.000Z", "posted_ct": "Nov 09, 06:18 AM CT", "likes": 1, "replies": 0, "reply": "", "angle": "You're building that SMB AI services business", "tier": "Reply now", "hot": false, "new": true}, {"handle": "DannyMagazu", "name": "Dan Magazu", "followers": 5739, "id": "2119777023631732956", "url": "https://x.com/DannyMagazu/status/2119777023631732956", "text": "I turned down a job opportunity at Amazon with a $150k salary because I wanted to keep building my landscaping business.\n\nAnd a lot of people thought I was making a terrible decision.\n\nI'd spent years doing well in school, got into software engineering, and had a pretty clear career path.\n\nBut I had already started making money running my own business, and I wanted to see how far I could take it.\n\nThat experience eventually led me to start Ride The Wave, where we now work with 500+ home service companies.\n\nI wouldn't tell somebody to quit their job because they have a business idea.\n\nGet some customers first. Figure out if you can make money. Make sure it's something you actually want to spend your time doing.\n\nBut once you've proven it works, there's a lot to be said for betting on yourself.", "posted_utc": "2026-11-09T13:00:00.000Z", "posted_ct": "Nov 09, 07:00 AM CT", "likes": 0, "replies": 1, "reply": "", "angle": "Also left tech for the trades", "tier": "Reply now", "hot": false, "new": true}, {"handle": "_toddanderson", "name": "Todd Anderson - SEO for the Trades", "followers": 7539, "id": "2119778233499500980", "url": "https://x.com/_toddanderson/status/2119778233499500980", "text": "Acquiring local links is one of the easiest things you can do as a home service business owner to win more jobs from Google. \n\nHere's how we build them for our clients:\n\n1. Run an audit with AI. \n\nHave an AI check the backlink profiles of 10 of your competitors. \n\nHave it scrape out all the locally relevant domains into a list. \n\n2. Rank them. \n\nFirst, you want to go after all the Chambers of Commerce. These should only cost you a yearly fee of a few hundred dollars. \n\nSecond, you want to go after any kind of trade associations or niche-type directories that are relevant to your industry. Again, a yearly membership should only cost you a few hundred bucks. \n\nThird, go after the longest-standing organizations in your area. These are usually annual events that have been running for decades, like a marathon or a fun run of some kind. \n\nThe fourth tier is going to be your garden-variety links, like sports clubs, rotary clubs, and smaller organizations. \n\n3. Reach out and inquire about a sponsorship. \n\nThese should only run you about a few hundred bucks, and you want to make sure your logo is listed on their sponsorship page, linking back to your homepage. \n\nWe've built dozens of these for our clients in the past year, and we attribute this to a lot of the success we've seen in our SEO campaigns.", "posted_utc": "2026-11-09T13:04:49.000Z", "posted_ct": "Nov 09, 07:04 AM CT", "likes": 1, "replies": 1, "reply": "The fun run sponsorship is the only marketing spend that comes with a free T-shirt", "angle": "HVAC test bed: local links vs paid ads", "tier": "Reply now", "hot": false, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');const isQt=p.mode==='qt';
c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}${isQt?'<span class="badge" style="background:#7c3aed">QT</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
${p.angle?'<div class="angle">Angle: '+esc(p.angle)+'</div>':''}<textarea placeholder="${isQt?'Your quote take...':'Your one-liner...'}">${esc(draft)}</textarea><div class="row"><button class="primary rp">${isQt?'Quote on X':'Reply on X'}</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>{const u=isQt?('https://x.com/intent/post?url='+encodeURIComponent(p.url)+'&text='+encodeURIComponent(ta.value)):('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value));window.open(u,'_blank','noopener')};
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
