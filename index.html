<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X Reply Queue</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:#f5f6f8;color:#14171a}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e3e6ea;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1}.pill{background:#eef3ff;color:#1d4ed8;border-radius:99px;padding:4px 10px;font-weight:600}
.bar{height:4px;background:#e3e6ea;width:100%}.bar i{display:block;height:100%;background:#1d9bf0;width:0}
button{font:inherit;border:1px solid #cfd5db;background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{background:#0f1419;color:#fff;border-color:#0f1419}
main{max-width:680px;margin:0 auto;padding:12px}h2{font-size:13px;text-transform:uppercase;color:#536471;margin:18px 4px 8px}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:12px;padding:14px;margin-bottom:12px}
.card.done{opacity:.45}.card.skip{opacity:.3}.who{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.who b{font-size:15px}.muted{color:#536471;font-size:13px}.text{white-space:pre-wrap;margin:8px 0;max-height:220px;overflow:auto}
textarea{width:100%;min-height:84px;font:inherit;border:1px solid #cfd5db;border-radius:8px;padding:8px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.cnt{margin-left:auto;font-size:13px;color:#536471}.cnt.over{color:#d00;font-weight:700}
a{color:#1d9bf0;text-decoration:none}
.card.new{border-left:5px solid #16a34a}.card.hot{background:#fff4d6;border-color:#f0b429}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:4px;color:#fff;vertical-align:middle}
.b-new{background:#16a34a}.b-hot{background:#e8590c}.legend{font-size:13px;color:#536471;margin:4px 4px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.angle{background:#eef3ff;border-left:3px solid #1d4ed8;padding:6px 10px;border-radius:6px;margin:8px 0;font-weight:600}.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:4px}
</style></head><body>
<header><h1>X Reply Queue <span class="muted">@onhand_terry</span></h1>
<span class="pill" id="prog"></span><span class="pill" id="timer">30:00</span>
<a class="pill" href="scorecard.html" style="text-decoration:none">📊 Scorecard</a><a class="pill" href="plan.html" style="text-decoration:none">🗓️ Plan</a><a class="pill" href="investors.html" style="text-decoration:none">💼 Investors</a><button id="tbtn">Start</button><button id="treset">Reset</button></header><div class="bar"><i id="pbar"></i></div>
<main><div class="legend"><span><span class="sw" style="border-left:5px solid #16a34a;background:#fff;border:1px solid #ccc;border-left:5px solid #16a34a"></span><span class="badge b-new">NEW</span>new account / first time in queue</span><span><span class="sw" style="background:#fff4d6;border:1px solid #f0b429"></span><span class="badge b-hot">HOT</span>top pick / highest engagement</span></div><div id="list"></div></main>
<script>
const POSTS=[{"handle": "_toddanderson", "name": "Todd Anderson - SEO for the Trades", "followers": 7518, "id": "2114675922582249498", "url": "https://x.com/_toddanderson/status/2114675922582249498", "text": "An $11M+ HVAC, plumbing and electrical contractor I consulted for this summer was getting zero plumbing jobs from SEO.\n\nThey had hundreds of service calls.\n\nBut all of their Google profiles were set to \"HVAC contractor.\"\n\nGoogle gives each profile one primary category, and it's the strongest signal for what that profile shows up for. That setup works until winter, when the AC calls dry up.\n\nI see this setup over and over with multi-trade contractors.\n\nWhat I told them:\n\n1. Don't switch an existing profile to plumber. You'll end up with a suspended profile, and you're going to lose the HVAC market share that you currently have \n\n2. Research where the plumbing jobs are and stand up a new profile there, with plumber as the primary category.\n\n3. Send every plumbing review to that profile.", "posted_utc": "2026-10-26T11:10:03.000Z", "posted_ct": "Oct 26, 06:10 AM CT", "likes": 2, "replies": 0, "reply": "", "angle": "HVAC test bed: the winter call dip", "tier": "Reply now", "hot": true, "new": true}, {"handle": "agazdecki", "name": "Andrew Gazdecki", "followers": 316872, "id": "2114670832220017029", "url": "https://x.com/agazdecki/status/2114670832220017029", "text": "Your startup might be worth $5M today and $2M a year from now and the crazy part is you could be running the exact same business.\n\nSame customers, same revenue, same team.\n\nBut maybe interest rates went up.\n\nMaybe buyers stopped paying premium multiples for your industry.\n\nMaybe a new competitor showed up and everyone got nervous.\n\nSuddenly that $5M valuation you were excited about last year is looking more like $2M.\n\nI've seen how quickly buyer sentiment can change.\n\nAnd I think founders sometimes assume that if they keep working hard and growing their startup, its value will automatically go up.\n\nUnfortunately acquisitions don't always work that way.\n\nYou can do everything right and still end up selling for less because the market changed around you.\n\nThat's why I think it's worth understanding what your startup could sell for today, even if you're planning to run it for another five years.\n\nYou never know when the market might be giving you a pretty incredible opportunity.\n\nP.S. thinking about selling your startup? Our team will help you understand what your business is worth, prepare it for buyers, and guide you through the entire acquisition process. Meet the team here: https://t.co/6hqLR8REAe", "posted_utc": "2026-10-26T10:49:49.000Z", "posted_ct": "Oct 26, 05:49 AM CT", "likes": 13, "replies": 8, "reply": "", "angle": "317k. Sold a startup: market sets the price", "tier": "Large tech: reply now", "hot": true, "new": true}, {"handle": "ChrisRamsey60", "name": "Chris Ramsey | SMB and R.E.", "followers": 124996, "id": "2114684214318924152", "url": "https://x.com/ChrisRamsey60/status/2114684214318924152", "text": "Two guys start at the same plant at 22.\n\nSame job. Same pay.\n\nOne spends 20 years waiting for the perfect deal.\n\nThe other buys one small ugly building every couple years.\n\nAt 45 the first guy is still waiting.\n\nThe second guy doesn’t have to go in on Monday.", "posted_utc": "2026-10-26T11:43:00.000Z", "posted_ct": "Oct 26, 06:43 AM CT", "likes": 5, "replies": 1, "reply": "", "angle": "125k. Buying boring assets, Monday humor", "tier": "Large tech: reply now", "hot": false, "new": true}, {"handle": "noahiglerSEO", "name": "Noah Igler", "followers": 7503, "id": "2114678934641996232", "url": "https://x.com/noahiglerSEO/status/2114678934641996232", "text": "This 8-figure roofing company spent $3.2K on non-branded Google Ads in the first 2.5 weeks after we took over its ads.\n\nThose ads have already sold $29K in roofs.\n\nThis is what we changed:\n\n> Non-branded had been paused before we started. We relaunched it and are testing two different landing pages to see which one books more inspections.\n> Cost per lead came in at $272, against the $400 we forecast to start.\n> We report the branded campaign on its own line. It sold $148K on $2.1K, about 70x, and it should be that high, because those people were already searching for the company by name. Blend it in and the whole account looks far better than it is.\n\nOn the SEO side, organic search went from $183K to $216K in new sales month over month, up 18%. Calls from their main Google profile went up 26% over the same stretch. Most of it was cleanup:\n\n> Keywords written into the profile's service descriptions\n> The name, address and phone fixed wherever the website and the profile didn't match\n> Every directory listing matched to the profile, with a real description on the sites that allow one\n\nTheir average Google ranking across the keywords we track went from about 25 to 16. Some of that is seasonal, and I told them that.\n\nBefore us, they'd spent years with two big home service ad agencies, and the ads were never very profitable. The owner told me, \"Trust me, I've been burning money in Google for a long time.\"\n\nTwo and a half weeks into the ads, he said, \"Oh my gosh. We're actually making money with Google Ads.\"", "posted_utc": "2026-10-26T11:22:01.000Z", "posted_ct": "Oct 26, 06:22 AM CT", "likes": 4, "replies": 1, "reply": "", "angle": "Blended ROAS hides the truth; trades marketing", "tier": "Reply soon", "hot": false, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
${p.angle?'<div class="angle">Angle: '+esc(p.angle)+'</div>':''}<textarea placeholder="Your one-liner...">${esc(draft)}</textarea><div class="row"><button class="primary rp">Reply on X</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>window.open('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value),'_blank','noopener');
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
