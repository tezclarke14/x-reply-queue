<script>
const POSTS=[{"handle": "awilkinson", "name": "Andrew Wilkinson", "followers": 392949, "id": "2120211451055075506", "url": "https://x.com/awilkinson/status/2120211451055075506", "text": "Anyone in Austin or Phoenix/Scottsdale want to hang out? In Scottsdale until Friday, then heading to Austin this weekend. \n\nEmail me!", "posted_utc": "2026-11-10T17:46:16.000Z", "posted_ct": "Nov 10, 11:46 AM CT", "likes": 6, "replies": 5, "reply": "", "angle": "Austin local: building AI-run HVAC here", "tier": "Reach", "hot": true, "new": true}, {"handle": "PaulKlayVC", "name": "Paul Klay", "followers": 4347, "id": "2120208942093480426", "url": "https://x.com/PaulKlayVC/status/2120208942093480426", "text": "best vc content formats based on my experience\n\n- deep research into specific niches and market shifts. for example, @gregisenberg wrote an excellent article, \"$5T Opportunity: AI Roll Ups,\" which we probably should've written ourselves, considering how early we invested in Dwelly. this is a great format because you help readers understand the reasoning behind a particular opportunity, backed by data and experience. it could also be research into a broader market shift, like @kwharrison13's article \"The Death of Venture Capital's Short Kings.\" the key to making this format work is having real expertise and being able to explain complex things in a way people can easily understand.\n\n- investment theses. this is similar to the first format, but it's more actionable because you're actually putting your own money behind the thesis. you explain where you see opportunities and market inefficiencies, then show how you're acting on them. a great example is @GEVS94's article \"Rise of the Borderless Founder,\" which explains the reasoning and data behind the thesis while also showing what they're doing about it: hosting dinners for these founders, recruiting them, and investing in them.\n\n- breakdowns of recent deals. calculate who made how much money, what multiples investors achieved, and so on. this is @PaulBonnet's signature format, and it consistently gets great views. most people either can't be bothered to do the math or don't know how. seeing the actual numbers when someone has already done the work for you is always interesting and genuinely useful for understanding what's happening in the market.\n\n- interesting early-stage artifacts. what a unicorn looked like when you first invested in it. an interesting story about a portfolio company's founder. @a16z posted \"Cursor, 4 years ago,\" featuring a Hacker News screenshot where the founder described the project as an email extension. it got 1.4M views. they've also posted what SpaceX's first reactor looked like, Airbnb's website in 2008, and so on. all of these posts performed extremely well.\n\n- lists and maps of startups or people. curated lists and rankings almost always get great engagement. there are two main reasons. first, you tag people and appeal to their egos. people naturally want to react to and share content that features them. second, you've done the research and created something that solves a real problem for someone. say someone wants to learn about VC. here's a list of the best creators covering the venture capital industry. that same list is also useful for GPs and CMOs at other funds who are building their own content strategies. this is one of @cosign's main growth strategies, and it works extremely well because of the obvious network effect.\n\n- interpreting research data. take an interesting statistic and explain what it actually means, or challenge a well-known investor's or founder's opinion using data. this format is particularly effective. @credistick is great at it, and his content consistently gets strong views. not everyone can connect the dots and draw conclusions from numbers, and plenty of people don't even look at the data. presenting it this way gives your arguments real evidence.\n\n- podcasts and clips. this is becoming especially relevant following the recent announcement from @XCreators, and @HarryStebbings has really nailed this format. but you can't just start another podcast because everyone else is doing it. the space is genuinely overcrowded. you need to understand exactly what problem you're solving and for whom. before launching, check whether someone else is already solving that problem better than you could. there's not much point in starting yet another podcast unless you can get someone like @elonmusk on it. you need to know who's going to watch and why.\n\n- educational content. how to fundraise, how venture capital works, and so on. @harris has been publishing some good articles in this format recently. there are two things to keep in mind. first, who's reading it? if your goal is to attract LPs, they obviously already know the basics, and so do experienced founders. this type of content usually attracts beginners and tends to work well on TikTok, Instagram, and similar platforms. second, check whether someone has already explained the topic better than you plan to. writing the hundredth explanation of how venture capital works isn't going to add much value if you have nothing new to say.\n\n- personal reflections. just observations from your own life and work. which types of founders tend to perform better, something non-obvious you've learned about relationships, whatever. anything you think could be useful that comes from your personal experience. sometimes it's just a thought worth sharing.\n\n- digests of what happened over the past week or month. a great format when you focus on a specific niche. @pavelprata is perfect with his monthly VC/LP debrief. if you don't have a large audience yet, don't try to cover every piece of news. pick a smaller segment you know really well and become the best and most popular source in that niche first.\n\n- nostalgia. what happened in VC over the past year? this isn't a regular format, but it can be amazing if you put real effort into it. some friends of mine who ran a large football media account used to create incredible illustrations capturing the year's biggest and most memorable moments through tiny details. they'd then build a list around those illustrations.\n\n- interactive content. recently, all kinds of vibe-coded websites featuring memes have gone viral. @vkleban made a cool game where both players are controlled by Jev models. others have built websites that calculate how much your X account is worth, and so on. if you execute the idea well and make people curious enough to try it, this format almost always performs extremely well.\n\nlower-quality formats that still work\n\n- announcing that you're investing and asking people to drop their pitch decks, websites, or startup descriptions in the comments. it's engagement farming and tends to attract a lower-quality audience, but it works for generating views.\n\n- memes about recent events. just look at @TurnerNovak's most popular posts. almost all of them are memes. maybe one in ten really takes off, and the audience isn't always that relevant, but the format clearly works. \n\n- shitposting and short takes. i'm not a fan of this format, and frankly, i'm not very good at it. still, these posts can occasionally get incredible traction. @chiefofautism has built a great audience with this approach.", "posted_utc": "2026-11-10T17:36:18.000Z", "posted_ct": "Nov 10, 11:36 AM CT", "likes": 21, "replies": 6, "reply": "", "angle": "AI rollups from inside a live HVAC shop", "tier": "Reply now", "hot": false, "new": true}, {"handle": "irentdumpsters", "name": "Bodhi- Local SEO", "followers": 23597, "id": "2120205118272393319", "url": "https://x.com/irentdumpsters/status/2120205118272393319", "text": "If you own a home service company I would be paying VERY close attention to what is happening with ads inside ChatGPT right now.\n\nOpenAI has started rolling out visual ads that can appear while somebody is waiting for ChatGPT to generate an image.\n\nThe ads are clearly labeled and disappear once the image is finished generating.\n\nThat sounds small but I think the bigger thing here is obvious.\n\nChatGPT is becoming another place businesses may eventually be able to buy attention.\n\nThink about how people already use ChatGPT:\n\n“Design my dream backyard”\n\n“Show me what my kitchen could look like remodeled”\n\n“Create a modern bathroom design”\n\n“What would my house look like with a black roof?”\n\n“Show me different landscaping ideas for my backyard”\n\nThose are not random searches.\n\nThose can be people literally visualizing projects they are about to spend money on.\n\nNow imagine an ad showing up during that process for:\n\nRoofing companies\n\nKitchen remodelers\n\nBathroom remodelers\n\nLandscapers\n\nPool builders\n\nPainters\n\nFlooring companies\n\nWindow companies\n\nGeneral contractors\n\nThat is why I would not look at this as just another random ad placement.\n\nThe interesting part is WHEN the person could potentially see the ad.\n\nIf somebody asks ChatGPT to visualize a new kitchen they could be much closer to hiring a contractor than someone mindlessly scrolling Instagram.\n\nIf somebody uploads a photo of their backyard and asks AI to design a pool they are basically telling the platform exactly what project they are thinking about.\n\nIf somebody asks for different roof colors on their house there is a pretty obvious commercial intent sitting behind that request.\n\nNow to be clear I would NOT go tell your marketing team to move your Google Ads budget into ChatGPT tomorrow.\n\nThe current format is still new and OpenAI has said testing is beginning with a group of US advertisers.\n\nWe also do not know yet how good the targeting will be, what home service categories will be available, how expensive the clicks will become or whether these ads will actually produce qualified leads.\n\nBut I would absolutely start thinking about the creative now.\n\nIf I owned a roofing company I would want ads showing real transformations.\n\nBefore roof.\n\nAfter roof.\n\nDifferent shingle colors.\n\nMetal roof examples.\n\nCompleted projects in the market.\n\nIf I owned a remodeling company I would want some of my best kitchen and bathroom transformations ready.\n\nIf I owned a landscaping company I would want the backyard projects that immediately make somebody stop and look.\n\nIf this becomes a real advertising channel I think the companies with the best VISUAL proof are going to have a huge advantage.\n\nI would also start paying much closer attention to how customers are already talking about your service inside ChatGPT.\n\nWhat are they asking?\n\nWhat problems are they trying to solve?\n\nWhat are they trying to visualize?\n\nWhat are they comparing?\n\nWhat questions happen right before somebody becomes a lead?\n\nThat information could eventually become just as important for ad targeting and creative as keyword research is for Google Ads today.\n\nGoogle has spent decades monetizing search intent.\n\nMeta monetized attention and interests.\n\nChatGPT has an opportunity to monetize the actual conversation somebody is having while they are trying to solve a problem.\n\nFor home service companies that could become extremely interesting because a lot of our customers have VERY expensive problems.\n\nA broken AC.\n\nA leaking roof.\n\nA kitchen they want remodeled.\n\nA backyard they want completely redone.\n\nA bathroom they hate looking at every day.\n\nIf OpenAI can eventually put the right local company in front of that person at the exact moment they are researching or visualizing the project I want to be early to that.\n\nI would not move budget yet.\n\nI would start paying attention NOW.", "posted_utc": "2026-11-10T17:21:06.000Z", "posted_ct": "Nov 10, 11:21 AM CT", "likes": 8, "replies": 4, "reply": "", "angle": "HVAC test bed: ChatGPT as lead source", "tier": "Reply now", "hot": false, "new": true}, {"handle": "andywalkerhq", "name": "Andy Walker", "followers": 8209, "id": "2120201078906012137", "url": "https://x.com/andywalkerhq/status/2120201078906012137", "text": "If you want to 2x your home service business next year, start these boring habits now:\n\n• Answer every call\n• Call form fills in 5 minutes\n• Ask for the review\n• Follow up 7 days\n• Own your Maps pin\n• Get your face on camera\n• Same-day estimates\n• Raise your prices\n• Fire wrong hires fast", "posted_utc": "2026-11-10T17:05:03.000Z", "posted_ct": "Nov 10, 11:05 AM CT", "likes": 8, "replies": 3, "reply": "Answer every call is carrying that whole list", "angle": "Answer every call: what AI fixes first", "tier": "Reply now", "hot": false, "new": true}, {"handle": "agazdecki", "name": "Andrew Gazdecki", "followers": 317669, "id": "2120195590336413825", "url": "https://x.com/agazdecki/status/2120195590336413825", "text": "Your startup's next million dollars in revenue might come from something you're currently giving away for free.", "posted_utc": "2026-11-10T16:43:14.000Z", "posted_ct": "Nov 10, 10:43 AM CT", "likes": 40, "replies": 21, "reply": "", "angle": "Trades: free estimates as the funnel", "tier": "Reach", "hot": true, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');const isQt=p.mode==='qt';
c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}${isQt?'<span class="badge" style="background:#7c3aed">QT</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
${p.angle?'<div class="angle">Angle: '+esc(p.angle)+'</div>':''}<textarea placeholder="${isQt?'Your quote take...':'Your one-liner...'}">${esc(draft)}</textarea><div class="row"><button class="primary rp">${isQt?'Quote on X':'Reply on X'}</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>{const u=isQt?('https://x.com/intent/post?url='+encodeURIComponent(p.url)+'&text='+encodeURIComponent(ta.value)):('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value));window.open(u,'_blank','noopener')};
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
