<script>
const POSTS=[{"handle": "_toddanderson", "name": "Todd Anderson - SEO for the Trades", "followers": 7539, "id": "2119857568965177639", "url": "https://x.com/_toddanderson/status/2119857568965177639", "text": "A roofer we worked with got 304 calls to their Google Business Profile in only 3 months. \n\nThey paid us $3,000 a month for 12 months of work, costing them a total of $36,000 for the marketing budget. \n\nOf those 304 calls, they were able to book 106 jobs with an average ticket around $4,200 each. \n\nTo say to the math, that's just shy of $450,000 in revenue, purely from just those organic calls to the Google Profile. \n\nFrom our SEO campaign alone, it's over a 12x ROI on our services for them. \n\nAnd the campaign was not an easy one. This was a tier one market, and it took us six months of work to prep for busy season, to dominate that three-month period. \n\nAnd that leads me to the one question I lead with on all of my discovery calls these days: \n\n\"Do you have the patience and the budget to wait for the results to come in?\"\n\nEven in the era of AI, SEO still takes time, and it rewards those who are patient and can stick to the plan. \n\nThe home service businesses that win in SEO are the ones that can investing in the campaigns and not see an ROI in month 4 of the project.", "posted_utc": "2026-11-09T18:20:04.000Z", "posted_ct": "Nov 09, 12:20 PM CT", "likes": 2, "replies": 0, "reply": "", "angle": "HVAC test bed: calls vs booked jobs", "tier": "Reply now", "hot": true, "new": true}, {"handle": "guilleflorvs", "name": "Guillermo Flor", "followers": 14240, "id": "2119856119010955679", "url": "https://x.com/guilleflorvs/status/2119856119010955679", "text": "BREAKING: Skyfall AI just put an AI CEO called Steve in charge of three businesses it bought.\n\nThe scoreboard so far:\nA social media API tool went from $3,649 to $8,307 MRR in under three months.\nA Shopify app that had been sliding for five years is now holding at $8,379.\nNext up, a $2M program to acquire five more startups for Steve to run.\n\nThe AI CEO headline will get the clicks. The business model is the bigger story.\n\nBuy small, cash-flowing software. Replace the operating layer with agents. Keep a human owner on the big calls. That is a holding company playbook with almost no headcount per acquisition.\n\nIf it works at $8k MRR, the obvious next step is $80k and then $800k. Search funds and micro-PE should be watching this closely.\n\nFounders running a sub-$10k MRR product: would you sell it to an AI-run holdco, or start one yourself?", "posted_utc": "2026-11-09T18:14:18.000Z", "posted_ct": "Nov 09, 12:14 PM CT", "likes": 0, "replies": 0, "reply": "Steve's first trades acquisition is going to be a humbling week", "angle": "You're building the blue-collar Steve", "tier": "Reply now", "hot": true, "new": true}, {"handle": "wolfejosh", "name": "Josh Wolfe", "followers": 273176, "id": "2119848678286340180", "url": "https://x.com/wolfejosh/status/2119848678286340180", "text": "Some of our best bets have come from spotting what we like to call directional arrows of progress—arrows of inevitability that tell you where to look.\n\nAs AI moves off the screen and into the physical world, from words, code and images to the spacecraft, aircraft and cars we build, it has to understand the machine.\n\nWhen Nominal raised its last financing in March, I wrote that engineering the physical world isn’t ready for AI. Not because the models don’t work, but because the data isn’t there. Hardware teams don’t lack rigor, their tools lack memory. For most teams, much of what there is to know about a machine is scattered across spreadsheets and hard drives, or stuck in the heads of engineers who eventually rotate off the program.\n\nI also wrote that when AI finally works for hardware, it would need a data layer underneath it. Nominal built that, pulling every test, sensor reading and configuration into one place. Now it’s building the Hardware Intelligence Platform on top of it.\n\nNominal’s software doesn’t just record what happened, it helps engineers understand what happened, why it happened, and what they should investigate next. For example, an engine runs hot during a test, and instead of a week of digging, an engineer can immediately ask why. Nominal isn’t just another engineering tool but the platform the next generation of hardware companies will run on, from first simulation to fleets in the field.\n\nIn hardware, a wrong answer means a failed test, a damaged prototype, or a delayed launch. So engineers will only trust AI that gets it right, and the final call is still theirs. We believe the most valuable software companies of the next decade will be built where general AI isn’t enough, where data is messy and mistakes are expensive…hardware tops that list.\n\nWe backed @CameronLMcCord, @brycestrauss and @Jrshoch at the pre-seed 4 years ago, when nobody was talking about this problem, and have backed them in every round since. Between them, they’d seen it up close at @anduriltech, @AppliedInt and @PalantirTech, and saw where the arrow pointed before anyone else did.\n\nAnd today Nominal announced a $240 million Series C at a $3 billion valuation. AI is headed into the physical world, and Nominal is how it gets there.\nAll systems…NOMINAL.", "posted_utc": "2026-11-09T17:44:44.000Z", "posted_ct": "Nov 09, 11:44 AM CT", "likes": 10, "replies": 0, "reply": "", "angle": "HVAC: the data lives in techs' heads", "tier": "Reach", "hot": false, "new": true}, {"handle": "smblawgroup", "name": "SMB Law Group", "followers": 12008, "id": "2119842453486485557", "url": "https://x.com/smblawgroup/status/2119842453486485557", "text": "JUST IN: Big Tech's AI race is set to save small business owners time, but won't help them find customers, according to new reporting. (Fortune)", "posted_utc": "2026-11-09T17:20:00.000Z", "posted_ct": "Nov 09, 11:20 AM CT", "likes": 2, "replies": 6, "reply": "", "angle": "HVAC test bed: AI books, doesn't find", "tier": "Reply now", "hot": false, "new": true}, {"handle": "Codie_Sanchez", "name": "Codie Sanchez", "followers": 716410, "id": "2119829141809684489", "url": "https://x.com/Codie_Sanchez/status/2119829141809684489", "text": "There are 5 levels of owning a business, decide which level you’re building toward:\n\nLevel 1 - it makes sales\nLevel 2 - it makes a profit\nLevel 3 - it pays you well\nLevel 4 - it pays you well w/o constant stress\nLevel 5 - it runs so well someone pays to buy it", "posted_utc": "2026-11-09T16:27:06.000Z", "posted_ct": "Nov 09, 10:27 AM CT", "likes": 178, "replies": 62, "reply": "", "angle": "AI-run trades shop aims straight at Level 5", "tier": "Reach", "hot": false, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');const isQt=p.mode==='qt';
c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}${isQt?'<span class="badge" style="background:#7c3aed">QT</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
${p.angle?'<div class="angle">Angle: '+esc(p.angle)+'</div>':''}<textarea placeholder="${isQt?'Your quote take...':'Your one-liner...'}">${esc(draft)}</textarea><div class="row"><button class="primary rp">${isQt?'Quote on X':'Reply on X'}</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>{const u=isQt?('https://x.com/intent/post?url='+encodeURIComponent(p.url)+'&text='+encodeURIComponent(ta.value)):('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value));window.open(u,'_blank','noopener')};
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
