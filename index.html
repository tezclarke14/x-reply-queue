<script>
const POSTS=[{"handle": "noahiglerSEO", "name": "Noah Igler", "followers": 7823, "id": "2123836027823444317", "url": "https://x.com/noahiglerSEO/status/2123836027823444317", "text": "I talked to an $11M HVAC owner who'd rather pay his techs to stay home than send them on an $800 Google Ads call that brings in a $300 job.\n\nIn his words: \"I'll stay the size we're at, but I need to be profitable.\"\n\nA lot of the $10M+ owners I talk to want the same thing right now, and it starts with knowing your return on every channel.\n\nWhen we went through his Google Ads, a lot of the spend sat in campaigns returning about 1.3x. He didn't know several of his channels were under 2.5x.\n\nAt a 40% gross margin, 2.5x is about break-even on the first job. Every $1 in ads brings back $2.50 in sales, and $1 of that is gross profit, which only pays for the ad. At 1.3x, you lose about 48 cents on every dollar you spend.\n\nHis fix: any campaign under 3x gets cut, and that money moves to replacement and new system leads. His service board is already booked six weeks out with maintenance, so he doesn't need to pay for more service calls.\n\nHere's how I'd check your own numbers:\n\n> Pull revenue by source from your CRM for the last 6 to 12 months\n> Put it next to what you spent on each channel over the same stretch\n> Work out the return and the cost per new customer for each one\n> Flag anything under your break-even, which is 1 divided by your gross margin\n\nOne catch before you cut. Some channels make your other channels work. Radio, TV and Meta put your name in front of people who search for you later, and that search gets credited to Google.\n\nCut radio, and your Google Ads can slide from 6x to 3x over a few months. You won't know why, and you'll assume radio was the 1x channel all along.\n\nIf you cut a channel like that, watch your branded searches and your Google Ads return for the next 60 to 90 days. If they drop, that channel was doing more than your tracking showed.", "posted_utc": "2026-11-20T17:49:02.000Z", "posted_ct": "Nov 20, 11:49 AM CT", "likes": 2, "replies": 4, "reply": "", "angle": "Ohm test bed: which calls actually pay", "tier": "Reply now", "hot": true, "new": true}, {"handle": "SBA_Matthias", "name": "Matthias Smith, CEO - Pioneer Capital Advisory LLC", "followers": 37910, "id": "2123828642736152963", "url": "https://x.com/SBA_Matthias/status/2123828642736152963", "text": "New open-world game just dropped for searchers.\n\nMain quest: buy a $1 million EBITDA HVAC co for under 4x\n\nSide quests: get the broker to call you back, explain add-backs to a credit officer, and sign a personal guarantee with a smile.\nFinal boss: the QoE.\n\nRated S for SOP 50 10 8.1.", "posted_utc": "2026-11-20T17:19:41.000Z", "posted_ct": "Nov 20, 11:19 AM CT", "likes": 3, "replies": 0, "reply": "Final boss: answering the phones after close.", "angle": "After close: actually running the HVAC co", "tier": "Reply now", "hot": false, "new": true}, {"handle": "Codie_Sanchez", "name": "Codie Sanchez", "followers": 716923, "id": "2123824489947410632", "url": "https://x.com/Codie_Sanchez/status/2123824489947410632", "text": "If you want to win, stay away from crowds. Find the boring, the underpriced, the not-popular. Winning in investing or building is just discovery &gt; line queuing.", "posted_utc": "2026-11-20T17:03:11.000Z", "posted_ct": "Nov 20, 11:03 AM CT", "likes": 187, "replies": 39, "reply": "", "angle": "UK tech founder to Texas HVAC: boring wins", "tier": "Reply now", "hot": true, "new": true}, {"handle": "NYCounihan", "name": "Julian Counihan", "followers": 2177, "id": "2123822276584067359", "url": "https://x.com/NYCounihan/status/2123822276584067359", "text": "I'm averaging about 2 - 3 robot model pitches per week over the past two months", "posted_utc": "2026-11-20T16:54:24.000Z", "posted_ct": "Nov 20, 10:54 AM CT", "likes": 3, "replies": 1, "reply": "", "angle": "Industrial VC: AI ops before robots", "tier": "Worth a look", "hot": false, "new": true}, {"handle": "gvh41", "name": "Greg Van Horn", "followers": 3923, "id": "2123831528803217905", "url": "https://x.com/gvh41/status/2123831528803217905", "text": "Just got off the phone with a guy who’s been looking at home service franchises for the last 6 months.\n\n20+ year sales career, has capital, wants to build a real business, and has been getting pitched nonstop by franchise brokers.\n\nHere’s what I told him:\n\nI’m still insanely bullish on home services and entrepreneurship. I’ll just never go the franchise route again.\n\nThere’s a paradox in buying a franchise that’s only obvious after having bought one yourself:\n\nIn theory it’s a reduction of risk. You’ve never started a business before and you think you’re paying for playbooks, a sales process, brand recognition, a faster start, or whatever other shortcut excites you.\n\nIn reality, you’re introducing the maximum amount of risk.\n\nYou take out a 6-figure SBA loan to buy a business that doesn't exist yet. You lock yourself into a 10-year agreement with ongoing royalties, restrictive covenants, and liquidated damages.\n\nIf you hate it, or if the brand is a disaster, you can’t just walk away. You have to spend hundreds of thousands of dollars in liquidated damages and/or legal fees just to get out.\n\nSo if you’re sitting on capital and want to get into home services, there is a much better option:\n\n1. Start from scratch independently\n\nIt sounds intimidating, but it’s not nearly as expensive as people think. You can launch a home service brand for $10,000 (or much less).\n\nWill you take your bumps? Yes of course.\n\nWill they be the exact same bumps you’d take inside a franchise? Also yes. But at a fraction of the cost. Without any restrictive legal agreements. And if you decide 6 months in that you hate it, you can shut it down and move on with your life.\n\n2. Pay real operators for advice (the \"anti-franchise\" route)\n\nIf you want to accelerate your learning curve, don’t pay a franchisor whose corporate team has never actually run a business.\n\nInstead:\nPay a successful operator in another market $5K to shadow them for a week.\n\nAttend a 3-day workshop put on by someone actually doing $5M+ in the space.\n\nJoin a high-level best practice group.\n\nLook at \"anti-franchise\" models where you pay a flat fee for SOPs and playbooks, with zero royalties and zero 10-year legal handcuffs.\n\nEven if you drop $20,000-$50,000 on real-world education, it’s a drop in the bucket compared to franchise fees and ongoing royalties. And you keep 100% ownership of your brand.\n\nThe truth about starting today:\n\nWith the internet, AI, countless operators who will exchange money for advice, and insane grit and hustle, you don't need a franchisor to hold your hand.\n\nPick a category. Spin up a Google Business Profile. Call your local suppliers and manufacturer reps. Develop a sales process.\n\nBuy a couple thousand dollars in leads, start taking sales calls, and find good subs (or even bad ones, just fire them quickly).\n\nMost of what you need to learn will come during the act of running the business anyway. Not from any franchisor.", "posted_utc": "2026-11-20T17:31:10.000Z", "posted_ct": "Nov 20, 11:31 AM CT", "likes": 11, "replies": 10, "reply": "", "angle": "Why build an HVAC co, not buy a franchise", "tier": "Worth a look", "hot": false, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');const isQt=p.mode==='qt';
c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}${isQt?'<span class="badge" style="background:#7c3aed">QT</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
${p.angle?'<div class="angle">Angle: '+esc(p.angle)+'</div>':''}<textarea placeholder="${isQt?'Your quote take...':'Your one-liner...'}">${esc(draft)}</textarea><div class="row"><button class="primary rp">${isQt?'Quote on X':'Reply on X'}</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>{const u=isQt?('https://x.com/intent/post?url='+encodeURIComponent(p.url)+'&text='+encodeURIComponent(ta.value)):('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value));window.open(u,'_blank','noopener')};
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
