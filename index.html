<script>
const POSTS=[{"handle": "agazdecki", "name": "Andrew Gazdecki", "followers": 316746, "id": "2113603036614738276", "url": "https://x.com/agazdecki/status/2113603036614738276", "text": "I'd take a $4M cash offer for my startup over a complicated $5M offer any day of the week. \n\nHere's why. \n\nBuyer #1 offers you $4M in cash at closing.\n\nBuyer #2 offers you $5M.\n\nSounds like an easy decision, right?\n\nExcept buyer #2 wants to pay you $3M upfront, $1M over the next two years, and another $1M if the business hits certain revenue targets.\n\nOh and they want you to stick around for three years.\n\nSuddenly that extra $1M doesn't sound quite as exciting. Haha.\n\nI've seen founders get so focused on the headline acquisition price that they overlook how much money they're actually guaranteed to receive.\n\nAnd who wants to spend 3 years working for someone else just to hopefully collect the rest of their exit?\n\nObviously every deal is different.\n\nSometimes earnouts and seller financing make a ton of sense.\n\nBut if you've spent the last five years building a startup and someone offers you $4M in cash to buy it, that's a pretty incredible outcome.\n\nThe amount you actually get paid matters a whole lot more than the number in the press release.\n\nP.S. thinking about selling your startup? Our team will help you understand what your business is worth, prepare it for buyers, and guide you through the entire acquisition process. Meet the team here: https://t.co/6hqLR8REAe", "posted_utc": "2026-10-23T12:06:47.000Z", "posted_ct": "Oct 23, 07:06 AM CT", "likes": 8, "replies": 7, "reply": "That extra $1M is a 3-year job offer with a bonus you don't control. In a trades deal it's worse: the earnout rides on techs who were loyal to you, not the buyer.", "tier": "Reply now", "hot": true, "new": true}, {"handle": "levelsio", "name": "@levelsio", "followers": 980867, "id": "2113587042185576853", "url": "https://x.com/levelsio/status/2113587042185576853", "text": "Maybe important to repost this now that everyone is getting hacked\n\nIf you have a VPS, I recommend you to get if off the public internet and into a Tailscale network and Cloudflare Tunnel ASAP\n\nIt doesn't matter you have SSH key login, this is about exploits and vulnerabilities AI is finding\n\nThere's 2 ways into a VPS:\n- via your site/app (like the PHP exploit of this week with a file upload hack)\n- via your server (like hacking into SSH or some open port)\n\nThe site/app side you put on a Cloudflare Tunnel and then with the default Free Plan it has WAF security enabled by default and they jump on new security exploits fast, it means that the only way to reach your website is via the Cloudflare Tunnel, your server does not respond to port 80 or 443 anymore\n\nThe server side you put on a Tailscale network which is like your own private network that nobody can access but your own devices (like your laptop, your phone and your VPS) kinda like a VPN\n\nThen you switch off ANY regular access to your VPS on the firewall, in my case I use Hetzner and you create a new firewall then empty it and that blocks everything (test it)\n\nHow do Tailscale and Cloudflare Tunnel get in then? They don't. They go outbound. They make a tunnel to outside which sends and receives\n\nNow you've reduced your attack vector to Tailscale and your Cloudflare Tunnel, much safer, not perfect btw, but nothing is", "posted_utc": "2026-10-23T11:03:14.000Z", "posted_ct": "Oct 23, 06:03 AM CT", "likes": 1180, "replies": 52, "reply": "The scariest server isn't on Hetzner. It's the box under a plumbing shop's front desk running dispatch, port-forwarded so the owner can check it from home.", "tier": "Reply now", "hot": true, "new": true}, {"handle": "ChrisRamsey60", "name": "Chris Ramsey | SMB and R.E.", "followers": 125043, "id": "2113595155756265745", "url": "https://x.com/ChrisRamsey60/status/2113595155756265745", "text": "You need to get multiple loan quotes on every deal.\n\nI just got five quotes for the same deal:\n\n6.5%\n6.975%\n7%\n7.1%\n7.2%\n\nSame borrower. Same property. Five different rates.\n\nA few extra phone calls can make a big difference in your cash flow.", "posted_utc": "2026-10-23T11:35:28.000Z", "posted_ct": "Oct 23, 06:35 AM CT", "likes": 18, "replies": 4, "reply": "70 basis points from five phone calls. Most owners spend more time picking a truck wrap than shopping their debt.", "tier": "Reply now", "hot": false, "new": true}, {"handle": "Austen", "name": "Austen Allred", "followers": 487617, "id": "2113608396758778048", "url": "https://x.com/Austen/status/2113608396758778048", "text": "For the number of times I’ve seen the claim on X about, “Then these companies sign a bunch of bogus deals with their batchmates so they can all rotate money around and show fake revenue” I’ve literally never seen it happen https://t.co/ylvkcGnL2R", "posted_utc": "2026-10-23T12:28:05.000Z", "posted_ct": "Oct 23, 07:28 AM CT", "likes": 1, "replies": 1, "reply": "Rotating fake revenue with batchmates assumes batchmates have a budget. That's the weakest part of the conspiracy.", "tier": "Reply now", "hot": false, "new": true}, {"handle": "jasonlk", "name": "Jason ✨👾SaaStr.Ai✨ Lemkin", "followers": 254195, "id": "2113579434431467906", "url": "https://x.com/jasonlk/status/2113579434431467906", "text": "\"Hiring a seasoned CRO / VP Sales can make sense. \n\nBut you have to make sure they still want to be ... a CRO / VP Sales.  That they still want to spend 100% of their time selling. \n\nNot being a COO, or President, etc.\n\nNot everyone really wants to sell forever.\" https://t.co/jIyMtieVSC", "posted_utc": "2026-10-23T10:33:00.000Z", "posted_ct": "Oct 23, 05:33 AM CT", "likes": 7, "replies": 13, "reply": "Same trap in trades. Promote your best tech to service manager and you lose your best tech. Plenty of them just wanted to fix things, not run a schedule.", "tier": "Reply now", "hot": false, "new": true}, {"handle": "levie", "name": "Aaron Levie", "followers": 3528194, "id": "2113499900399034689", "url": "https://x.com/levie/status/2113499900399034689", "text": "Any form of security through obscurity is fully over. This barely worked as a method with humans, but just simply is over in a world of autonomous systems that will look through every crevice and try every permutation of attack possible.\n\nAs a result, years and years of legacy enterprise infrastructure will need to be upgraded, security practices modernized, data pipelines cleaned up, access controls better managed, and much more. Agents will help on the defensive side because they can both accelerate this work and equally simulate the risk vectors.\n\nBut there’s a long road ahead to prepare for this future. This is also partially why diffusion timelines will take longer than some realize.", "posted_utc": "2026-10-23T05:16:57.000Z", "posted_ct": "Oct 23, 12:16 AM CT", "likes": 264, "replies": 53, "reply": "Obscurity was the whole security plan for most small businesses. \"Nobody's going to hack an HVAC company\" stops being true when the attacker costs nothing to run.", "tier": "Reply now", "hot": false, "new": true}, {"handle": "ericwilliamrea", "name": "Eric Rea", "followers": 4715, "id": "2113265406316044777", "url": "https://x.com/ericwilliamrea/status/2113265406316044777", "text": "We built a $150M ARR business twice.\n\nThe first time took 8 years. The second took 2.5.\n\nToday, Podium crossed $150M in AI annual recurring revenue.\n\nThree years ago, we already had a great software business. Well over $100M in revenue, tens of thousands of customers, and a product we'd spent nearly a decade building.\n\nAnd we decided to start over.\n\nThe business was performing well. But we believed AI was going to fundamentally change the software industry and make much of traditional software obsolete.\n\nAs a founder, you pour your life into what you're building. An insane amount of time, sacrifice, and effort. The hard part is not getting too attached to it.\n\nWhen we started building our first AI agents, we had to confront the possibility that much of what we'd built might not be that valuable in the future. That's a tough pill to swallow.\n\nBut we also realized those same 10 years had put us in a unique position to take advantage of what AI could do for our customers.\n\nInstead of protecting what we'd spent a decade building, we decided to bet the future of the company on AI employees that actually do the work for our customers.\n\nWe massively underestimated what we'd signed up for.\n\nWe ended up building entirely new operating systems for the industries we serve, from the AI agents all the way down to the systems of record. Now customers run their entire businesses on Podium.\n\nReinventing our product wasn't even the hardest part. We had to reinvent how the entire company operated.\n\nWhen you've been running a company for over a decade, the operational inertia is incredibly powerful. We had to rethink how we build products, how we sell, how we serve customers, and how we run the business.\n\nWe effectively started a second startup inside an already successful company. And we're still at the very beginning.\n\nToday, we have 20,000 AI agents working for our customers. They've helped generate more than $13 billion in revenue for those businesses. And we're barely scratching the surface of what AI will be able to do for them.\n\nAnd we've done all of this while becoming profitable and generating free cash flow. We're building Podium to be around for decades.\n\nHuge credit to our team for having the guts to make this bet and the ability to actually pull it off. We still have a long way to go and tons of problems to solve, but it's so damn fun to be winning when the opportunity ahead is this big.\n\nIn the age of AI, you can either disrupt your own company or wait for somebody else to do it.\n\nI'd rather do it ourselves.", "posted_utc": "2026-10-22T13:45:10.000Z", "posted_ct": "Oct 22, 08:45 AM CT", "likes": 691, "replies": 131, "reply": "Starting over at $100M+ is the hardest part of this story. In home services the system of record is often the owner's cell phone, so building all the way down is the only way the agent works.", "tier": "New account: just added", "hot": true, "new": true}, {"handle": "Codie_Sanchez", "name": "Codie Sanchez", "followers": 715774, "id": "2113453377883394484", "url": "https://x.com/Codie_Sanchez/status/2113453377883394484", "text": "Never apologize for charging what you’re worth. https://t.co/AYkaZ6KTHx", "posted_utc": "2026-10-23T02:12:06.000Z", "posted_ct": "Oct 22, 09:12 PM CT", "likes": 530, "replies": 45, "reply": "Trades version: the cheapest quote wins the job and loses the business. Charge enough to answer the phone on a Sunday in August.", "tier": "Reply now", "hot": false, "new": true}, {"handle": "typesfast", "name": "Ryan Petersen", "followers": 755488, "id": "2113433486094905530", "url": "https://x.com/typesfast/status/2113433486094905530", "text": "Another big typhoon heading for Shanghai today.  More shipment delays incoming. https://t.co/ncryqYgQe7", "posted_utc": "2026-10-23T00:53:03.000Z", "posted_ct": "Oct 22, 07:53 PM CT", "likes": 99, "replies": 11, "reply": "That typhoon ends up as a Texas homeowner asking why the AC part is \"a few weeks out.\" In HVAC, supply chain news is customer service news.", "tier": "Reply now", "hot": false, "new": true}, {"handle": "jasonlk", "name": "Jason ✨👾SaaStr.Ai✨ Lemkin", "followers": 254195, "id": "2113442014024892738", "url": "https://x.com/jasonlk/status/2113442014024892738", "text": "New!! 20VC x SaaStr: $20M ARR and Unfundable\n\nA $20M ARR company growing 7x can't get a meeting.\n\nCapital is going to fewer names than ever. Seed is harder than growth.\n\nhttps://t.co/ROL8aqMVo7", "posted_utc": "2026-10-23T01:26:56.000Z", "posted_ct": "Oct 22, 08:26 PM CT", "likes": 20, "replies": 27, "reply": "$20M ARR at 7x and no meetings means the customers are the investors now. Every service business already runs that way.", "tier": "Reply now", "hot": false, "new": true}, {"handle": "agazdecki", "name": "Andrew Gazdecki", "followers": 316746, "id": "2113427992735277408", "url": "https://x.com/agazdecki/status/2113427992735277408", "text": "Startup founders should remember that the world rewards people who actually makes stuff happen.", "posted_utc": "2026-10-23T00:31:13.000Z", "posted_ct": "Oct 22, 07:31 PM CT", "likes": 105, "replies": 16, "reply": "Research feels like progress because nobody can reject it. Making stuff happen means someone can say no, which is why most people stall.", "tier": "Worth a reply", "hot": false, "new": true}, {"handle": "cleanwithmike", "name": "Mike Cleans", "followers": 82197, "id": "2113329063242719697", "url": "https://x.com/cleanwithmike/status/2113329063242719697", "text": "Everyone's worried AI will replace their job.\n\nMeanwhile, I'm looking at all the businesses AI can help one person operate:\n\n• Home maintenance\n• Cleaning companies\n• Landscaping services\n• Property management\n\nTons of opportunity out there right now.", "posted_utc": "2026-10-22T17:58:07.000Z", "posted_ct": "Oct 22, 12:58 PM CT", "likes": 18, "replies": 4, "reply": "Add HVAC to the list. The hard part isn't the AI. It's the license, the trucks, and the first property manager who'll take your call.", "tier": "Worth a reply", "hot": false, "new": true}, {"handle": "DannyMagazu", "name": "Dan Magazu", "followers": 5717, "id": "2113329319166542308", "url": "https://x.com/DannyMagazu/status/2113329319166542308", "text": "One of the biggest marketing opportunities for home service businesses right now is the owner getting on camera for their Facebook ads.\n\nPull out your phone and record a little selfie video talking about your business.\n\nIn so many industries, these kinds of videos dominate, but I haven't seen them take off in home services yet.\n\nMost owners skip it because they're not used to being on camera.\n\nBut in our tests, video ads have significantly outperformed static ones, and the owner's selfie video works phenomenally.", "posted_utc": "2026-10-22T17:59:08.000Z", "posted_ct": "Oct 22, 12:59 PM CT", "likes": 39, "replies": 20, "reply": "Owner selfies work because local trades run on trust. Two Austin property managers asked me why our number shows up as Palo Alto. A face fixes that faster than a logo.", "tier": "New account: just added", "hot": false, "new": true}, {"handle": "andywalkerhq", "name": "Andy Walker - SMB Marketing", "followers": 8002, "id": "2113298143181680973", "url": "https://x.com/andywalkerhq/status/2113298143181680973", "text": "If you hate selling, great.\n \nBuild an offer so clear and a guarantee so strong that the homeowner talks himself into it, and you'll never have to be the pushy guy to win the job.", "posted_utc": "2026-10-22T15:55:15.000Z", "posted_ct": "Oct 22, 10:55 AM CT", "likes": 14, "replies": 4, "reply": "Best close I heard this week wasn't mine. A realtor said \"I appreciate the hustle\" and offered to post us in her 177-person vendor group. Clear offer, zero pushing.", "tier": "Worth a reply", "hot": false, "new": true}, {"handle": "zachglabman", "name": "zach", "followers": 11841, "id": "2113324056665555048", "url": "https://x.com/zachglabman/status/2113324056665555048", "text": "big thanks to @connorkapoor @rhobusiness for cohosting Made In America (Austin) last night 🤙\n\n@digitalmetalinc makes the fastest castings in the west\n\nWe saw a live demo of the full process and screened Made Right Here, covering the skilled trades workforce America needs to win https://t.co/BfkkeOW5V4 https://t.co/CEGYHdPNEF", "posted_utc": "2026-10-22T17:38:13.000Z", "posted_ct": "Oct 22, 12:38 PM CT", "likes": 72, "replies": 6, "reply": "Building an HVAC company just up the road in Hutto. The trades story in central Texas is getting more interesting than the tech one.", "tier": "Worth a reply", "hot": false, "new": true}, {"handle": "jasonlk", "name": "Jason ✨👾SaaStr.Ai✨ Lemkin", "followers": 254195, "id": "2113326047626494137", "url": "https://x.com/jasonlk/status/2113326047626494137", "text": "You could always do vendor bake-offs.  We’ve always done them.\n\nBut a great agent means you can do much better bake-offs, with better data, so much faster.\n\nThis week we compared email deliverability across 3 vendors and 500,000+ emails at a level of detail we never would have been able to do before.\n\n10K nailed every element, even multivariant test, every issue.\n\nAnd its recommendations were crystal clear.", "posted_utc": "2026-10-22T17:46:08.000Z", "posted_ct": "Oct 22, 12:46 PM CT", "likes": 27, "replies": 34, "reply": "500,000 emails compared by one agent. Small businesses never ran bake-offs at all, they picked whoever called first. That's the bigger shift.", "tier": "Worth a reply", "hot": false, "new": true}, {"handle": "sweatystartup", "name": "Nick Huber", "followers": 528762, "id": "2113302306682794452", "url": "https://x.com/sweatystartup/status/2113302306682794452", "text": "I know a lot of very average people who make phenomenal money simply because they aren’t insecure. \n\nThey are confident enough in themselves and their own abilities to move forward regardless of other people’s opinions. \n\nThey aren’t afraid to make an ask, do some marketing to drum up business, or hop on the phone to spend a few days or weeks cold calling folks when business gets slow. \n\nThey don’t spend time feeling sorry for themselves if some of their calls or campaigns don't work out. \n\nThey don't waste days or weeks second guessing their strategy or over-analyzing what someone said to them last week in an email or on the phone. \n\nThey just move forward and keep taking action.", "posted_utc": "2026-10-22T16:11:47.000Z", "posted_ct": "Oct 22, 11:11 AM CT", "likes": 617, "replies": 50, "reply": "11 cold calls to property managers in two days. Half assumed I wanted to rent an apartment. You keep dialing anyway, that's the whole edge.", "tier": "Worth a reply", "hot": false, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
<textarea>${esc(draft)}</textarea><div class="row"><button class="primary rp">Reply on X</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>window.open('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value),'_blank','noopener');
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
