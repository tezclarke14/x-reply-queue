<script>
const POSTS=[{"handle": "noahiglerSEO", "name": "Noah Igler", "followers": 7705, "id": "2119405582868271523", "url": "https://x.com/noahiglerSEO/status/2119405582868271523", "text": "If you run a plumbing, HVAC or electrical company, these are the directory listings we recommend you get on.\n\nWe set up 50 core listings for every home service company we start with.\n\nHere's the list, and why each group matters:\n\n(Bookmark this)\n\nOne rule covers all of them: use the exact same business name, address and phone number as your Google Business Profile. If your profile shows a tracking number, that same tracking number goes on every listing.\n\n1. The maps\n> Google Business Profile\n> Apple Business Connect, which controls how you show up in Apple Maps, the default map on every iPhone\n> Bing Places, which feeds Bing Maps and Bing search\n\n2. Where homeowners check you out before they call\n> Yelp\n> BBB\n> Facebook\n> Nextdoor\n> Angi and HomeAdvisor, which share a parent company but still run as two separate sites\n> Thumbtack\n\n3. The data aggregators\n> Data Axle\n> Foursquare\n> TransUnion's Digital Business Profile, which used to be Neustar Localeze\n\nThese push your info out to navigation systems, apps and smaller directories. BrightLocal reports that Foursquare's data is used by apps like Uber and Nextdoor, and by ChatGPT.\n\n4. The older directories that still show up in search\n> Yellow Pages, which shares a network with Superpages and DexKnows\n> Manta\n\n5. Your trade and your town\n> The dealer or installer locator for every brand you install, like Carrier, Trane, Lennox, Rheem or Generac\n> Member directories for the associations you belong to, like ACCA, PHCC, IEC or NECA\n> Your local chamber of commerce\n\nWhy it matters:\n\n> Google checks your profile against the rest of the web. When your name, address and phone match everywhere, there's less for it to doubt.\n> Homeowners look you up on Yelp, the BBB and Nextdoor before they call.\n> ChatGPT and Google's AI answers pull business info from sites like these, not just from Google.\n\nHow we set them up:\n\n> Clean up old addresses, old phone numbers and duplicate listings first\n> Then build the core 50, all matching the Google profile\n> Do Yelp and the other sites that verify by phone by hand, so they don't hold up the rest", "posted_utc": "2026-11-08T12:24:02.000Z", "posted_ct": "Nov 08, 06:24 AM CT", "likes": 8, "replies": 4, "reply": "Foursquare feeding ChatGPT is a new one", "angle": "Directories don't answer the phone", "tier": "Reply now", "hot": true, "new": true}, {"handle": "agazdecki", "name": "Andrew Gazdecki", "followers": 317525, "id": "2119414742880252275", "url": "https://x.com/agazdecki/status/2119414742880252275", "text": "A startup making $500K a year in profit that grows 10% annually can become a pretty incredible wealth building machine.\n\nAnd you don't need some crazy growth rate to make it happen.\n\nLet's say you bootstrap a SaaS company.\n\nYou've got a small team, loyal customers, and you're making $500K a year in profit.\n\nYou grow that profit by 10% every year.\n\nAfter 5 years, you're making about $800K.\n\nAfter 10 years, you're making about $1.3M.\n\nAnd over those ten years, your business has generated roughly $8M in cumulative profit.\n\nAll from a company that started out making $500K.\n\nThat's before taxes, and assuming you can maintain those margins and keep growing.\n\nYou could take some of those profits as distributions along the way.\n\nKeep reinvesting in the business.\n\nEventually you might have a company worth several million dollars to a buyer.\n\nI think startup culture has made founders feel like growing 10% a year is somehow disappointing.\n\nBut compounding 10% annual profit growth for a decade while owning the entire business?\nThat's a pretty damn good outcome.\n\nP.S. thinking about selling your startup? Our team will help you understand what your business is worth, prepare it for buyers, and guide you through the entire acquisition process. Meet the team here: https://t.co/6hqLR8REAe", "posted_utc": "2026-11-08T13:00:26.000Z", "posted_ct": "Nov 08, 07:00 AM CT", "likes": 9, "replies": 4, "reply": "That's a well-run shop with extra steps", "angle": "HVAC shops already compound like this", "tier": "Reply now", "hot": true, "new": true}];const K='xrq:';
const st=id=>localStorage.getItem(K+'s:'+id)||'';
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n}
function age(t){const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){const L=document.getElementById('list');L.innerHTML='';let tier='';
POSTS.forEach(p=>{if(p.tier!==tier){tier=p.tier;L.insertAdjacentHTML('beforeend','<h2>'+esc(tier)+'</h2>')}
const s=st(p.id),draft=localStorage.getItem(K+'d:'+p.id)??p.reply;
const c=document.createElement('div');const isQt=p.mode==='qt';
c.className='card '+s+(p.new?' new':'')+(p.hot?' hot':'');c.innerHTML=`<div class="who"><span>${p.hot?'<span class="badge b-hot">HOT</span>':''}${p.new?'<span class="badge b-new">NEW</span>':''}${isQt?'<span class="badge" style="background:#7c3aed">QT</span>':''}<b>${esc(p.name)}</b> <span class="muted">@${esc(p.handle)} · ${fmt(p.followers)} followers</span></span>
<span class="muted">${age(p.posted_utc)} ago · ${esc(p.posted_ct)}</span></div><div class="text">${esc(p.text)}</div>
<div class="muted">♥ ${fmt(p.likes)} · 💬 ${fmt(p.replies)} <span>(at build time)</span> · <a href="${p.url}" target="_blank" rel="noopener">Open post ↗</a></div>
${p.angle?'<div class="angle">Angle: '+esc(p.angle)+'</div>':''}<textarea placeholder="${isQt?'Your quote take...':'Your one-liner...'}">${esc(draft)}</textarea><div class="row"><button class="primary rp">${isQt?'Quote on X':'Reply on X'}</button><button class="dn">${s==='done'?'Undo done':'Done'}</button><button class="sk">${s==='skip'?'Undo skip':'Skip'}</button><span class="cnt"></span></div>`;
const ta=c.querySelector('textarea'),cnt=c.querySelector('.cnt');
const upd=()=>{const n=[...ta.value].length;cnt.textContent=n+'/280';cnt.classList.toggle('over',n>280)};upd();
ta.oninput=()=>{localStorage.setItem(K+'d:'+p.id,ta.value);upd()};
c.querySelector('.rp').onclick=()=>{const u=isQt?('https://x.com/intent/post?url='+encodeURIComponent(p.url)+'&text='+encodeURIComponent(ta.value)):('https://x.com/intent/post?in_reply_to='+p.id+'&text='+encodeURIComponent(ta.value));window.open(u,'_blank','noopener')};
const set=v=>{st(p.id)===v?localStorage.removeItem(K+'s:'+p.id):localStorage.setItem(K+'s:'+p.id,v);render()};
c.querySelector('.dn').onclick=()=>set('done');c.querySelector('.sk').onclick=()=>set('skip');L.appendChild(c)});
const d=POSTS.filter(p=>st(p.id)==='done').length,k=POSTS.filter(p=>st(p.id)==='skip').length;
document.getElementById('prog').textContent=d+' done · '+k+' skipped · '+(POSTS.length-d-k)+' left';
document.getElementById('pbar').style.width=((d+k)/POSTS.length*100)+'%'}
// 30-minute session timer persisted in localStorage
let iv;const TB=document.getElementById('tbtn'),TE=document.getElementById('timer');
function rem(){const end=+localStorage.getItem(K+'end'),left=+localStorage.getItem(K+'left')||1800;return end?Math.max(0,(end-Date.now())/1000):left}
function tick(){const r=Math.ceil(rem());TE.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
if(r<=0&&localStorage.getItem(K+'end')){localStorage.removeItem(K+'end');localStorage.setItem(K+'left',0);TE.textContent="Time's up";clearInterval(iv);TB.textContent='Start'}}
function run(){clearInterval(iv);iv=setInterval(tick,1000);TB.textContent='Pause';tick()}
TB.onclick=()=>{if(localStorage.getItem(K+'end')){localStorage.setItem(K+'left',rem());localStorage.removeItem(K+'end');clearInterval(iv);TB.textContent='Start';tick()}
else{localStorage.setItem(K+'end',Date.now()+rem()*1000);run()}};
document.getElementById('treset').onclick=()=>{localStorage.removeItem(K+'end');localStorage.setItem(K+'left',1800);clearInterval(iv);TB.textContent='Start';tick()};
if(localStorage.getItem(K+'end'))run();else tick();render();
</script></body></html>
